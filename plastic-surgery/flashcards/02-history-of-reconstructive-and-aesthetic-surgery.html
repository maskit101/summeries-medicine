    explanation:"התשובה הנכונה (3) מבוססת על ציטוט ישיר מהפרק מתוך כתביו של Fioravanti עצמו. תשובות 1, 2, 4 אינן מבוססות כלל בטקסט — להפך, הפרק מדגיש שהידע נשמר כ'סוד משפחתי' שעבר אך ורק בעל-פה, בדיוק כמו אצל משפחת Branca לפניה שהטכניקה שלה 'נעלמה' ב-1460 עם מות אנטוניו.",
    term_definition:{term:"Il Tesoro della Vita Humana", text:"'אוצר חיי האדם' — ספרו של Leonardo Fioravanti, מנתח צבאי מבולוניה, שפורסם בוונציה ב-1570 וכלל את התיאור הראשון בכתב של טכניקת פלאפ הזרוע של משפחת Vianeo."},
    story:null,
    why_question:{q:"למה משפחות כמו Branca ו-Vianeo בחרו לשמור את הטכניקה בסוד, במקום לפרסם אותה ולזכות בקרדיט?", a:"כי במאות ה-15–16 לא היה עדיין מושג של 'פרסום מדעי' כדרך לצבור מוניטין מקצועי — ידע מעשי מיוחד היה נכס כלכלי משפחתי (כמו סוד מסחרי), שהעברתו לזרים הייתה מאיימת על פרנסת המשפחה על פני דורות."},

  en:{
    question:"How did the Italian Vianeo family's (16th century) secret arm-flap nasal reconstruction technique actually 'leak' to the wider world?",
    options:["The family published a printed instructional pamphlet for the public","The Pope ordered the family to disclose the technique","The military surgeon Leonardo Fioravanti pretended to be a squeamish onlooker who turned his face away from the operation, while actually watching every step 'through his fingers,' then published a detailed account in Il Tesoro della Vita Humana (1570), which likely reached Tagliacozzi","Antonio Branca's grandson sold the rights to the technique to Tagliacozzi for money"],
    answer_lines:[
      {t:"The Vianeo family (Pietro and Paolo) ran a successful clinic in Tropea, Calabria — knowledge kept purely oral", icon:"🔴", c:"B85042"},
      {t:"Fioravanti's own account: 'I pretended I had not the courage to look... yet my eyes saw perfectly'", icon:"🔵", c:"1C7293"},
      {t:"Published a detailed report in 1570 — about 27 years before Tagliacozzi's systematic book (1597)", icon:"🟢", c:"2C5F2D"}

    term_definition:{term:"Il Tesoro della Vita Humana", text:"'The Treasure of Human Life' — a book by Leonardo Fioravanti, a military surgeon from Bologna, published in Venice in 1570, containing the first written description of the Vianeo family's arm-flap technique."},
    story:null,
    why_question:{q:"Why did families like Branca and Vianeo choose to keep the technique secret rather than publish it and gain credit?", a:"Because in the 15th–16th centuries there was no concept yet of 'scientific publication' as a path to professional reputation — specialized practical knowledge was a family economic asset (like a trade secret), and passing it to outsiders threatened the family's livelihood across generations."},

{
  id:"c005", type:"qa", difficulty:"medium", topic_category:"principles",
  correct_index:0, has_image:true,
  he:{
    question:"במאה ה-19 הוכח לראשונה ששתל עור 'חופשי' (חתוך לגמרי מאספקת הדם המקורית) יכול לשרוד. מהו הסדר הכרונולוגי-מנגנוני הנכון של פורצי הדרך והמנגנון הביולוגי שמאפשר לשתל 'לתפוס'?",
    options:["Baronio הוכיח את העיקרון בכבש (1804) → Reverdin ביצע שתל אנושי מוצלח ראשון (1869) → Ollier הרחיב לעובי-חלקי → Wolfe/Thiersch שכללו לעובי-מלא; מנגנונית: ספיגה (imbibition) ← חיבור כלי דם קיימים (inosculation) ← נאואנגיוגנזה (neovascularization)","Reverdin ← Baronio ← Wolfe ← Ollier, מנגנונית: נאואנגיוגנזה מיידית בלבד ללא שלבי ביניים","Wolfe (1804) ← Ollier ← Baronio ← Reverdin, מנגנונית: השתל שורד רק דרך אספקת חמצן ישירה מהאוויר","הסדר אינו ידוע וללא משמעות קלינית"],
    answer_lines:[
      {t:"שלב 1 (0–48 שעות): ספיגה (imbibition) — השתל 'שותה' פלזמה מהמצע כמו ספוג, שמירה זמנית בלבד", icon:"🔵", c:"1C7293"},
      {t:"שלב 2 (יום 2–4): inosculation — קצוות כלי דם קיימים במצע ובשתל 'נפגשים' ומתחברים", icon:"🟢", c:"2C5F2D"},
      {t:"שלב 3 (מיום 4–7): נאואנגיוגנזה — נבטים חדשים של כלי דם צומחים לתוך השתל, אספקת דם יציבה", icon:"🟠", c:"D99A2B"},
      {t:"BROW: Baronio (1804, כבש) → Reverdin (1869, אדם) → Ollier (עובי-חלקי) → Wolfe/Thiersch (עובי-מלא)", icon:"🔴", c:"B85042"}
    ],
    explanation:"התשובה הנכונה (1) משלבת נכון גם את הסדר הכרונולוגי המדויק שמופיע בפרק וגם את המנגנון הביולוגי התלת-שלבי שמסביר למה בכלל שתל חופשי שורד. תשובה 2 הופכת את הסדר ומדלגת על שלבי הביניים החיוניים. תשובה 3 שגויה גם בתאריך (Wolfe אינו 1804 — זו שנת Baronio) וגם במנגנון (אין ספיגת חמצן ישירה מהאוויר). תשובה 4 שגויה כי לסדר יש משמעות קלינית ישירה — הוא משקף את ההתקדמות מעקרון בסיסי לטכניקה מדויקת (הבחנה בין עובי חלקי למלא).",
    term_definition:{term:"Inosculation", text:"שלב אמצעי בהשרשת שתל עור: חיבור פיזי-מכני בין קצוות כלי דם קטנים שנחתכו בשתל לבין קצוות כלי דם במצע הפצע, עוד לפני צמיחת כלי דם חדשים לגמרי."},
    story:"תארי שתל עור כמו צמח קטוף שמנסים להשריש מחדש באדמה: קודם הוא 'שותה' לחות מהאדמה כדי לא להתייבש (ספיגה), אחר כך השורשים הקטומים שלו 'נפגשים' עם נימי מים קיימים באדמה (inosculation), ורק בסוף צומחים לו שורשים חדשים לגמרי שמעגנים אותו לצמיתות (נאואנגיוגנזה).",
    why_question:{q:"למה בכלל שתל עור חייב מצע עם אספקת דם טובה (כמו שריר), ולא יכול 'לתפוס' על עצם חשופה?", a:"כי כל שלושת השלבים תלויים בקרבה פיזית של כלי דם פעילים במצע — עצם קורטיקלית חשופה (ללא פריוסטאום) כמעט חסרת כלי דם משלה, ולכן אין ממה 'לספוג', עם מה 'להתחבר' ומאיפה 'לצמוח' כלי דם חדשים."},

  en:{
    question:"In the 19th century it was first proven that a 'free' skin graft (fully cut off from its original blood supply) can survive. What is the correct chronological-mechanistic order of the pioneers and the biological mechanism enabling the graft to 'take'?",
    options:["Baronio proved the principle in a ram (1804) → Reverdin performed the first successful human graft (1869) → Ollier extended to split-thickness → Wolfe/Thiersch refined to full-thickness; mechanistically: imbibition ← inosculation ← neovascularization","Reverdin ← Baronio ← Wolfe ← Ollier, mechanistically: immediate neovascularization only, with no intermediate stages","Wolfe (1804) ← Ollier ← Baronio ← Reverdin, mechanistically: the graft survives only via direct oxygen uptake from air","The order is unknown and clinically meaningless"],
    answer_lines:[
      {t:"Stage 1 (0–48h): imbibition — the graft 'drinks' plasma from the bed like a sponge, temporary survival only", icon:"🔵", c:"1C7293"},
      {t:"Stage 2 (day 2–4): inosculation — cut vessel ends in the bed and graft 'meet' and link up", icon:"🟢", c:"2C5F2D"},
      {t:"Stage 3 (from day 4–7): neovascularization — new vessel sprouts grow into the graft, stable blood supply", icon:"🟠", c:"D99A2B"},
      {t:"BROW: Baronio (1804, ram) → Reverdin (1869, human) → Ollier (split-thickness) → Wolfe/Thiersch (full-thickness)", icon:"🔴", c:"B85042"}
    ],
    explanation:"Correct answer (1) correctly combines the exact chronology from the chapter with the three-stage biological mechanism explaining why a free graft survives at all. Option 2 reverses the order and skips essential intermediate stages. Option 3 is wrong both on the date (Wolfe isn't 1804 — that's Baronio) and the mechanism (no direct oxygen uptake from air). Option 4 is wrong because the order has direct clinical meaning — it reflects progress from basic principle to precise technique (split vs full thickness).",
    term_definition:{term:"Inosculation", text:"An intermediate stage of graft take: the physical-mechanical joining of small cut vessel ends in the graft with vessel ends in the wound bed, before entirely new vessels have grown."},
    story:"Picture a skin graft like a cut plant being replanted in soil: first it 'drinks' moisture from the soil to avoid drying out (imbibition), then its cut roots 'meet' existing water capillaries in the soil (inosculation), and only afterward does it grow entirely new roots that anchor it permanently (neovascularization).",
    why_question:{q:"Why does a skin graft need a bed with good blood supply (like muscle), and can't 'take' on exposed bone?", a:"Because all three stages depend on physical proximity to active vessels in the bed — exposed cortical bone (without periosteum) has almost no vessels of its own, so there's nothing to 'imbibe' from, nothing to 'link up' with, and nowhere for new vessels to 'grow' from."},
    key_terms:["Baronio","Reverdin","Ollier","Wolfe","imbibition","inosculation"]
  },

  he:{

    answer_lines:[

      {t:"בצוות גיליס: William Fry ו-Henry Pickerill כרופאי שיניים, קבוצת מרדימים מיומנים — שיטתה נהלים כמו הפלאפ הצינורי", icon:"🟡", c:"D99A2B"}

    explanation:"התשובה הנכונה (3) משקפת במדויק את שרשרת ההעברה שהפרק מתאר: חדשנות ארגונית נולדה בפריז אצל מורסטן וולדייה, ואומצה ושוכללה על ידי גיליס באנגליה. תשובות 1, 2, 4 מייחסות את המודל לגורמים ובמקומות שגויים — לקסר עסק בשחזור פנים-לסת בגרמניה אך לא תואר כמחדש המודל הצוותי; בלייר בארה\"ב הוכשר ב-Sidcup (כלומר קיבל את המודל, לא המציא אותו); לא היה קשר למלחמת העולם השנייה.",
    term_definition:{term:"Queen's Hospital, Sidcup", text:"מרכז ייעודי לשיקום פנים שהקים Gillies ב-1917, עם למעלה מ-1,000 מיטות — הפך למרכז ההפניה האירופי המוביל לפציעות פנים-לסת במלה\"ע 1."},

    why_question:{q:"למה שילוב מנתח פלסטי עם רופא שיניים היה כה קריטי דווקא בפציעות פנים-לסת, יותר מאשר בפציעות אחרות?", a:"כי בפגיעה בלסת יש שני צרכים שונים לגמרי בו-זמנית: תיקון הרקמה הרכה (עור, שריר) שדורש מיומנות כירורגית פלסטית, ויציבות השלד (הלסת התחתונה/העליונה) שדורשת מכשור והבנה דנטלית ייחודית — בלי ייצוב שלד תקין, גם התיקון הכי טוב של הרקמה הרכה ייכשל כי אין לו על מה 'לשבת'."},

var langIsHe = true;

function saveState(){ localStorage.setItem('psFlashcardsState_ch02', JSON.stringify(state)); }

function catList(){
  var s = {};
  CARDS.forEach(function(c){ s[c.topic_category] = true; });
  return Object.keys(s);
}

function populateFilters(){
  var sel = document.getElementById('catFilter');
  catList().forEach(function(cat){
    var o = document.createElement('option');
    o.value = cat;
    o.textContent = (langIsHe ? CAT_NAMES_HE[cat] : CAT_NAMES_EN[cat]) || cat;
    sel.appendChild(o);
  });
}

function renderStats(){
  var total = CARDS.length;
  var answered = 0, correct = 0, known = 0, review = 0;
  CARDS.forEach(function(c){
    var st = state[c.id];
    if(st && st.answered){ answered++; if(st.correct) correct++; }
    if(st && st.rating === 'known') known++;
    if(st && st.rating === 'review') review++;
  });
  var acc = answered ? Math.round(100*correct/answered) : 0;
  var el = document.getElementById('statsPanel');
  var L = langIsHe ? {tot:"סה\"כ כרטיסיות",ans:"נענו",acc:"דיוק",kn:"ידועות",rv:"לחזרה",rs:"איפוס"} :
                       {tot:"Total cards",ans:"Answered",acc:"Accuracy",kn:"Known",rv:"To review",rs:"Reset"};
  el.innerHTML =
    '<div class="item"><b>'+total+'</b>'+L.tot+'</div>'+
    '<div class="item"><b>'+answered+'/'+total+'</b>'+L.ans+'</div>'+
    '<div class="item"><b>'+acc+'%</b>'+L.acc+'</div>'+
    '<div class="item"><b>'+known+'</b>'+L.kn+'</div>'+
    '<div class="item"><b>'+review+'</b>'+L.rv+'</div>'+
    '<button class="reset">'+L.rs+'</button>';
  el.querySelector('.reset').addEventListener('click', function(){
    if(confirm(langIsHe ? 'לאפס את כל ההתקדמות?' : 'Reset all progress?')){
      state = {}; saveState(); renderAll();
    }
  });
}

function cardMatchesFilters(c){
  var cat = document.getElementById('catFilter').value;
  var diff = document.getElementById('diffFilter').value;
  var status = document.getElementById('statusFilter').value;
  var q = document.getElementById('searchBox').value.trim().toLowerCase();
  if(cat && c.topic_category !== cat) return false;
  if(diff && c.difficulty !== diff) return false;
  var st = state[c.id];
  if(status === 'unrated' && st && st.rating) return false;
  if(status === 'known' && (!st || st.rating !== 'known')) return false;
  if(status === 'review' && (!st || st.rating !== 'review')) return false;
  if(q){
    var text = (c.he.question+' '+c.en.question+' '+(c.he.key_terms||[]).join(' ')).toLowerCase();
    if(text.indexOf(q) === -1) return false;
  }
  return true;
}

function renderGrid(){
  var grid = document.getElementById('cardGrid');
  grid.innerHTML = '';
  CARDS.filter(cardMatchesFilters).forEach(function(c){
    var d = langIsHe ? c.he : c.en;
    var color = PALETTE[c.topic_category] || '#666';
    var catName = (langIsHe ? CAT_NAMES_HE[c.topic_category] : CAT_NAMES_EN[c.topic_category]);
    var st = state[c.id];
    var statusHtml = '';
    if(st && st.answered){
      statusHtml = '<span class="status '+(st.correct?'correct':'wrong')+'">'+(st.correct ? (langIsHe?'נכון':'correct') : (langIsHe?'טעות':'wrong'))+'</span>';
    } else {
      statusHtml = '<span class="status unrated">'+(langIsHe?'חדש':'new')+'</span>';
    }
    var div = document.createElement('div');
    div.className = 'card';
    div.style.borderInlineStartColor = color;
    div.innerHTML = '<span class="badge" style="background:'+color+'">'+catName+'</span>'+
      '<div class="q">'+d.question+'</div>'+
      '<div class="meta"><span>'+c.difficulty+'</span>'+statusHtml+'</div>';
    div.addEventListener('click', function(){ openCard(c.id); });
    grid.appendChild(div);
  });
}

    return '<button class="opt" data-i="'+i+'">'+opt+'</button>';
  }).join('');

  var linesHtml = d.answer_lines.map(function(l){
    return '<div class="a-line"><span class="dot" style="background:#'+l.c+'"></span><span>'+l.icon+' '+l.t+'</span></div>';
  }).join('');

  var defHtml = d.term_definition ? '<div class="box def"><h4>'+(langIsHe?'הגדרת מונח':'Term definition')+': '+d.term_definition.term+'</h4>'+d.term_definition.text+'</div>' : '';
  var storyHtml = d.story ? '<div class="box story"><h4>'+(langIsHe?'סיפור לזכירה':'Story to remember')+'</h4>'+d.story+'</div>' : '';
  var whyHtml = d.why_question ? '<div class="box why"><h4>'+(langIsHe?'שאלי את עצמך: למה?':'Ask yourself: why?')+'</h4><p><b>'+d.why_question.q+'</b></p><p>'+d.why_question.a+'</p></div>' : '';
  var mnemHtml = '';
  if(c.mnemonic){
    var mLines = (langIsHe ? c.mnemonic.breakdown.he : c.mnemonic.breakdown.en).map(function(x){return '<div>'+x+'</div>';}).join('');
    mnemHtml = '<div class="box mnemonic"><h4>'+(langIsHe?'טכניקת זכירה':'Mnemonic')+': '+c.mnemonic.text+'<span class="known">'+(c.mnemonic.source==='known'?(langIsHe?'מוכר':'known'):(langIsHe?'מקורי':'original'))+'</span></h4>'+mLines+'</div>';
  }
  var diagHtml = DIAGRAMS[c.id] ? '<div class="diagram-wrap">'+DIAGRAMS[c.id]+'</div>' : '';
  var videoHtml = c.video_link ? '<a class="video-link" href="'+c.video_link.url+'" target="_blank">&#9654; '+c.video_link.title+'</a>' : '';
  var termsHtml = d.key_terms ? '<div class="key-terms">'+d.key_terms.map(function(t){return '<span>'+t+'</span>';}).join('')+'</div>' : '';

  var body =
    '<span class="badge" style="background:'+color+'">'+catName+'</span>'+
    '<div class="q">'+d.question+'</div>'+
    '<div id="optsWrap">'+optsHtml+'</div>'+
    '<div class="answer-block" id="answerBlock">'+
      '<div class="a-lines">'+linesHtml+'</div>'+
      '<p style="font-size:14.5px; color:#374151">'+d.explanation+'</p>'+
      defHtml + storyHtml + whyHtml + mnemHtml + diagHtml + videoHtml + termsHtml +
      '<div class="rate-row">'+
        '<button class="known-btn" id="rateKnown">&#10003; '+(langIsHe?'ידעתי':'Got it')+'</button>'+
        '<button class="review-btn" id="rateReview">&#8635; '+(langIsHe?'לחזור על זה':'Review again')+'</button>'+
      '</div>'+
    '</div>'+
    '<button class="back-btn" id="backToQ" style="display:none">'+(langIsHe?'&#8592; חזרה לשאלה':'&#8592; Back to question')+'</button>';

  document.getElementById('modalBody').innerHTML = body;
  document.getElementById('modalBg').classList.add('show');

  var optsWrap = document.getElementById('optsWrap');
  var answerBlock = document.getElementById('answerBlock');
  var st = state[c.id] || {};

  function lockOptions(chosenIdx){
    optsWrap.querySelectorAll('.opt').forEach(function(btn){
      btn.disabled = true;
      var i = parseInt(btn.getAttribute('data-i'),10);
      if(i === c.correct_index) btn.classList.add('correct');
      else if(i === chosenIdx) btn.classList.add('wrong');
    });
  }

  if(st.answered){
    lockOptions(st.chosenIndex);
    answerBlock.classList.add('show');
    document.getElementById('backToQ').style.display = 'inline-block';
  }

  optsWrap.querySelectorAll('.opt').forEach(function(btn){
    btn.addEventListener('click', function(){
      var i = parseInt(btn.getAttribute('data-i'),10);
      var isCorrect = (i === c.correct_index);
      if(!state[c.id] || !state[c.id].answered){
        state[c.id] = state[c.id] || {};
        state[c.id].answered = true;
        state[c.id].correct = isCorrect;
        state[c.id].chosenIndex = i;
        saveState();
        renderStats();
      }
      lockOptions(i);
      answerBlock.classList.add('show');
      document.getElementById('backToQ').style.display = 'inline-block';
    });
  });

  document.getElementById('backToQ').addEventListener('click', function(){
    answerBlock.classList.remove('show');
    document.getElementById('backToQ').style.display = 'none';
  });

  document.getElementById('rateKnown') && document.getElementById('rateKnown').addEventListener('click', function(){
    state[c.id] = state[c.id] || {};
    state[c.id].rating = 'known';
    saveState(); renderGrid();
  });
  document.getElementById('rateReview') && document.getElementById('rateReview').addEventListener('click', function(){
    state[c.id] = state[c.id] || {};
    state[c.id].rating = 'review';
    saveState(); renderGrid();
  });
}

document.getElementById('closeBtn').addEventListener('click', function(){
  document.getElementById('modalBg').classList.remove('show');
  renderGrid();
});
document.getElementById('modalBg').addEventListener('click', function(e){
  if(e.target.id === 'modalBg'){ document.getElementById('modalBg').classList.remove('show'); renderGrid(); }
});
document.getElementById('langBtn').addEventListener('click', function(){
  langIsHe = !langIsHe;
  document.body.setAttribute('dir', langIsHe ? 'rtl' : 'ltr');
  document.getElementById('catFilter').innerHTML = '<option value="">'+(langIsHe?'כל הנושאים':'All topics')+'</option>';
  populateFilters();
  renderAll();
  if(currentCardId) openCard(currentCardId);
});
['searchBox','catFilter','diffFilter','statusFilter'].forEach(function(id){
  document.getElementById(id).addEventListener('input', renderGrid);
  document.getElementById(id).addEventListener('change', renderGrid);
});

populateFilters();
renderAll();
</script>
</body>
</html>
