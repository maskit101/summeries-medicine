<svg class="diagram" viewBox="0 0 860 300" xmlns="http://www.w3.org/2000/svg">
<title>פגיעה תאית הפיכה מול בלתי-הפיכה: מפל דלדול ה-ATP</title>
<text x="430" y="24" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1f2937">איסכמיה / רעלן / היפוקסיה ← ↓ATP ← נקודת האל-חזור</text>

<rect x="20" y="50" width="380" height="150" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="210" y="72" font-size="13" font-weight="700" text-anchor="middle" fill="#1e3a8a">פגיעה הפיכה</text>
<text x="210" y="94" font-size="10.5" text-anchor="middle" fill="#1f2937">↓ATP ← ↓פעילות משאבות Na⁺/K⁺ ו-Ca²⁺</text>
<text x="210" y="112" font-size="10.5" text-anchor="middle" fill="#1f2937">← נפיחות תאית (הסימן המוקדם ביותר)</text>
<text x="210" y="130" font-size="10.5" text-anchor="middle" fill="#1f2937">ניתוק ריבוזומים ← ↓סינתזת חלבון</text>
<text x="210" y="148" font-size="10.5" text-anchor="middle" fill="#1f2937">בלבבינג ממברנלי, גיוש כרומטין</text>
<text x="210" y="166" font-size="10.5" text-anchor="middle" fill="#1f2937">גופיפי מיאלין; אובדן תפקוד מהיר</text>
<text x="210" y="186" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1e3a8a">הסרת הגורם עכשיו ← החלמה מלאה</text>

<polygon points="405,125 435,118 435,132" fill="#4b5563"/>

<rect x="440" y="50" width="400" height="150" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="640" y="72" font-size="13" font-weight="700" text-anchor="middle" fill="#7f1d1d">פגיעה בלתי-הפיכה</text>
<text x="640" y="94" font-size="10.5" text-anchor="middle" fill="#1f2937">פירוק ממברנת הפלזמה</text>
<text x="640" y="112" font-size="10.5" text-anchor="middle" fill="#1f2937">← זרימת Ca²⁺ פנימה ← אנזימי פירוק</text>
<text x="640" y="130" font-size="10.5" text-anchor="middle" fill="#1f2937">נזק מיטוכונדריאלי ← אובדן שרשרת הנשימה ← ↓↓ATP</text>
<text x="640" y="148" font-size="10.5" text-anchor="middle" fill="#1f2937">קרע ליזוזומלי ← אוטוליזה</text>
<text x="640" y="166" font-size="10.5" text-anchor="middle" fill="#1f2937">פיקנוזיס ← קריורקסיס ← קריוליזיס</text>
<text x="640" y="186" font-size="10.5" font-weight="700" text-anchor="middle" fill="#7f1d1d">אין חזרה ← מוות תאי (נמק)</text>

<polygon points="640,205 640,225 635,215" fill="#4b5563"/>
<rect x="470" y="230" width="340" height="45" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="640" y="250" font-size="11" font-weight="700" text-anchor="middle" fill="#92400e">Ferroptosis (מסלול מקביל): פרוקסידציית ליפידים,</text>
<text x="640" y="266" font-size="10.5" text-anchor="middle" fill="#92400e">תלוית ברזל — נחסמת ע"י כלאטורי ברזל / נוגדי חמצון</text>
</svg>
