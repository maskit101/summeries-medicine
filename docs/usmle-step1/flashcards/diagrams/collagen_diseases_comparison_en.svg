<svg class="diagram" viewBox="0 0 860 230" xmlns="http://www.w3.org/2000/svg">
<title>Collagen diseases and copper proteins — comparison summary</title>
<text x="430" y="24" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937">Collagen diseases — summary of differences</text>
<rect x="20" y="45" width="270" height="145" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="155" y="70" font-size="12" font-weight="700" text-anchor="middle" fill="#1e3a8a">Osteogenesis imperfecta</text>
<text x="155" y="92" font-size="10.3" text-anchor="middle" fill="#1f2937">COL1A1/COL1A2, defective type I</text>
<text x="155" y="116" font-size="10.3" font-weight="700" text-anchor="middle" fill="#1e3a8a">"BITE": Bone fractures</text>
<text x="155" y="134" font-size="10.3" font-weight="700" text-anchor="middle" fill="#1e3a8a">Blue sclerae, Teeth</text>
<text x="155" y="152" font-size="10.3" font-weight="700" text-anchor="middle" fill="#1e3a8a">Ear (hearing loss)</text>
<rect x="300" y="45" width="270" height="145" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
<text x="435" y="70" font-size="12" font-weight="700" text-anchor="middle" fill="#065f46">Ehlers-Danlos syndrome</text>
<text x="435" y="92" font-size="10.3" text-anchor="middle" fill="#1f2937">COL5A1/2 (classical)</text>
<text x="435" y="108" font-size="10.3" text-anchor="middle" fill="#1f2937">COL3A1 (vascular)</text>
<text x="435" y="130" font-size="10.3" font-weight="700" text-anchor="middle" fill="#065f46">Hyperelastic skin</text>
<text x="435" y="148" font-size="10.3" font-weight="700" text-anchor="middle" fill="#065f46">Hypermobile joints</text>
<text x="435" y="166" font-size="10.3" font-weight="700" text-anchor="middle" fill="#065f46">Vessel/uterus rupture (vascular)</text>
<rect x="580" y="45" width="260" height="145" rx="10" fill="#fce7f3" stroke="#a21caf" stroke-width="1.5"/>
<text x="710" y="70" font-size="12" font-weight="700" text-anchor="middle" fill="#701a75">Menkes disease (ATP7A)</text>
<text x="710" y="92" font-size="10.3" text-anchor="middle" fill="#1f2937">X-linked, copper deficiency</text>
<text x="710" y="112" font-size="10.3" text-anchor="middle" fill="#1f2937">↓lysyl oxidase</text>
<text x="710" y="134" font-size="10.3" font-weight="700" text-anchor="middle" fill="#701a75">"Kinky" hair</text>
<text x="710" y="152" font-size="10.3" font-weight="700" text-anchor="middle" fill="#701a75">Hypotonia</text>
<text x="710" y="170" font-size="10.3" font-weight="700" text-anchor="middle" fill="#701a75">Cerebral aneurysms</text>
<rect x="20" y="200" width="820" height="25" rx="6" fill="#fef3c7" stroke="#b45309"/>
<text x="430" y="217" font-size="11" font-weight="700" text-anchor="middle" fill="#78350f">Menkes (ATP7A — copper deficiency) vs Wilson (ATP7B — copper excess): same protein family, opposite direction</text>
</svg>
