<svg class="diagram" viewBox="0 0 860 274" xmlns="http://www.w3.org/2000/svg">
<title>The ubiquitin-proteasome pathway</title>
<text x="430.0" y="18" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1f2937" >Tagging a protein for destruction and degrading it</text>
<rect x="20" y="30" width="190" height="90" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<circle cx="42" cy="50" r="14" fill="#2563eb"/>
<text x="42" y="55" font-size="13" font-weight="700" text-anchor="middle" fill="#fff" >1</text>
<text x="130.0" y="55" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1e3a8a" >Target protein</text>
<text x="115.0" y="82" font-size="9.6" font-weight="400" text-anchor="middle" fill="#1f2937" >E1 activates</text>
<text x="115.0" y="100" font-size="9.6" font-weight="400" text-anchor="middle" fill="#1f2937" >ubiquitin (ATP-dependent)</text>
<line x1="210" y1="75" x2="215" y2="75" stroke="#4b5563" stroke-width="2.5"/><polygon points="213,68 213,82 225,75" fill="#4b5563"/>
<rect x="225" y="30" width="190" height="90" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
<circle cx="247" cy="50" r="14" fill="#047857"/>
<text x="247" y="55" font-size="13" font-weight="700" text-anchor="middle" fill="#fff" >2</text>
<text x="335.0" y="55" font-size="11.5" font-weight="700" text-anchor="middle" fill="#065f46" >E2</text>
<text x="320.0" y="82" font-size="9.6" font-weight="400" text-anchor="middle" fill="#1f2937" >transfers ubiquitin</text>
<line x1="415" y1="75" x2="420" y2="75" stroke="#4b5563" stroke-width="2.5"/><polygon points="418,68 418,82 430,75" fill="#4b5563"/>
<rect x="430" y="30" width="190" height="90" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<circle cx="452" cy="50" r="14" fill="#b45309"/>
<text x="452" y="55" font-size="13" font-weight="700" text-anchor="middle" fill="#fff" >3</text>
<text x="540.0" y="55" font-size="11.5" font-weight="700" text-anchor="middle" fill="#92400e" >E3 ligase</text>
<text x="525.0" y="82" font-size="9.6" font-weight="400" text-anchor="middle" fill="#1f2937" >attaches a poly-ubiquitin</text>
<text x="525.0" y="100" font-size="9.6" font-weight="400" text-anchor="middle" fill="#1f2937" >chain to the target</text>
<line x1="620" y1="75" x2="625" y2="75" stroke="#4b5563" stroke-width="2.5"/><polygon points="623,68 623,82 635,75" fill="#4b5563"/>
<rect x="635" y="30" width="190" height="90" rx="8" fill="#fce7f3" stroke="#a21caf" stroke-width="1.5"/>
<circle cx="657" cy="50" r="14" fill="#a21caf"/>
<text x="657" y="55" font-size="13" font-weight="700" text-anchor="middle" fill="#fff" >4</text>
<text x="745.0" y="55" font-size="11.5" font-weight="700" text-anchor="middle" fill="#701a75" >26S proteasome</text>
<text x="730.0" y="82" font-size="9.6" font-weight="400" text-anchor="middle" fill="#1f2937" >recognizes the tag</text>
<text x="730.0" y="100" font-size="9.6" font-weight="400" text-anchor="middle" fill="#1f2937" >and degrades the protein</text>
<rect x="20" y="150" width="820" height="50" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.3"/>
<text x="430.0" y="170" font-size="11" font-weight="400" text-anchor="middle" fill="#1f2937" >Result: fewer cytoskeletal proteins and organelles in the cell → the cell shrinks (atrophy)</text>
<text x="430.0" y="188" font-size="9.6" font-weight="400" text-anchor="middle" fill="#4b5563" >the ubiquitin itself is recycled for reuse</text>
<rect x="20" y="230" width="820" height="34" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
<text x="430.0" y="252" font-size="10.2" font-weight="700" text-anchor="middle" fill="#92400e" >What "moves": the ubiquitin tag itself passes E1→E2→E3 until it "sticks" to the target protein, marking it for destruction</text>
</svg>