<svg class="diagram" viewBox="0 0 860 240" xmlns="http://www.w3.org/2000/svg">
<title>שלבי מחזור התא ונקודות הביקורת</title>
<text x="430" y="24" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1f2937">G1 → S → G2 → M — עם נקודות ביקורת בין השלבים</text>
<rect x="30" y="55" width="170" height="70" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="115" y="82" font-size="13" font-weight="700" text-anchor="middle" fill="#1e3a8a">G1</text>
<text x="115" y="100" font-size="10.5" text-anchor="middle" fill="#1f2937">אורך משתנה מאוד</text>
<text x="115" y="115" font-size="10.5" text-anchor="middle" fill="#1f2937">תלוי גורמי גדילה</text>
<circle cx="215" cy="90" r="14" fill="#fbbf24" stroke="#92400e"/>
<text x="215" y="94" font-size="9" text-anchor="middle" fill="#78350f">בקרה</text>
<rect x="235" y="55" width="150" height="70" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
<text x="310" y="82" font-size="13" font-weight="700" text-anchor="middle" fill="#065f46">S</text>
<text x="310" y="100" font-size="10.5" text-anchor="middle" fill="#1f2937">שכפול DNA</text>
<circle cx="400" cy="90" r="14" fill="#fbbf24" stroke="#92400e"/>
<text x="400" y="94" font-size="9" text-anchor="middle" fill="#78350f">בקרה</text>
<rect x="420" y="55" width="150" height="70" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<text x="495" y="82" font-size="13" font-weight="700" text-anchor="middle" fill="#92400e">G2</text>
<text x="495" y="100" font-size="10.5" text-anchor="middle" fill="#1f2937">הכנה סופית למיטוזה</text>
<circle cx="585" cy="90" r="14" fill="#fbbf24" stroke="#92400e"/>
<text x="585" y="94" font-size="9" text-anchor="middle" fill="#78350f">בקרה</text>
<rect x="605" y="55" width="225" height="70" rx="8" fill="#fce7f3" stroke="#a21caf" stroke-width="1.5"/>
<text x="717" y="78" font-size="13" font-weight="700" text-anchor="middle" fill="#701a75">M — הפאזה הקצרה ביותר</text>
<text x="717" y="98" font-size="10" text-anchor="middle" fill="#1f2937">מיטוזה (פרו-פרומטא-מטא-אנא-טלופאזה)</text>
<text x="717" y="113" font-size="10" text-anchor="middle" fill="#1f2937">+ ציטוקינזיס</text>
<rect x="30" y="150" width="800" height="70" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
<text x="430" y="172" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1f2937">CDK: מבוטא קבוע, לא-פעיל ללא ציקלין • ציקלין: ספציפי-לפאזה, מפעיל CDK כשגורמי גדילה מגרים</text>
<text x="430" y="192" font-size="11.5" text-anchor="middle" fill="#1f2937">קומפלקס ציקלין-CDK מזרחן חלבוני מטרה (כמו Rb) כדי לקדם את התא לפאזה הבאה</text>
<text x="430" y="210" font-size="11" font-weight="700" text-anchor="middle" fill="#4b5563">מ-G0 (מנוחה) התאים חוזרים ל-G1 כשמגורים (סוגי תאים: ראו איור נפרד)</text>
</svg>
