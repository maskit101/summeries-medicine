<svg class="diagram" viewBox="0 0 860 300" xmlns="http://www.w3.org/2000/svg">
<title>Reversible vs irreversible cell injury: the ATP-depletion cascade</title>
<text x="430" y="24" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1f2937">Ischemia / toxin / hypoxia → ↓ATP → point of no return</text>

<rect x="20" y="50" width="380" height="150" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="210" y="72" font-size="13" font-weight="700" text-anchor="middle" fill="#1e3a8a">Reversible injury</text>
<text x="210" y="94" font-size="10.5" text-anchor="middle" fill="#1f2937">↓ATP → ↓Na⁺/K⁺-ATPase &amp; Ca²⁺ pumps</text>
<text x="210" y="112" font-size="10.5" text-anchor="middle" fill="#1f2937">→ cellular swelling (earliest sign)</text>
<text x="210" y="130" font-size="10.5" text-anchor="middle" fill="#1f2937">Ribosomal detachment → ↓protein synthesis</text>
<text x="210" y="148" font-size="10.5" text-anchor="middle" fill="#1f2937">Membrane blebbing, chromatin clumping</text>
<text x="210" y="166" font-size="10.5" text-anchor="middle" fill="#1f2937">Myelin figures; rapid loss of function</text>
<text x="210" y="186" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1e3a8a">Removing the insult now → full recovery</text>

<polygon points="405,125 435,118 435,132" fill="#4b5563"/>

<rect x="440" y="50" width="400" height="150" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="640" y="72" font-size="13" font-weight="700" text-anchor="middle" fill="#7f1d1d">Irreversible injury</text>
<text x="640" y="94" font-size="10.5" text-anchor="middle" fill="#1f2937">Plasma membrane breakdown</text>
<text x="640" y="112" font-size="10.5" text-anchor="middle" fill="#1f2937">→ Ca²⁺ influx → degradative enzymes</text>
<text x="640" y="130" font-size="10.5" text-anchor="middle" fill="#1f2937">Mitochondrial damage → loss of ETC → ↓↓ATP</text>
<text x="640" y="148" font-size="10.5" text-anchor="middle" fill="#1f2937">Lysosome rupture → autolysis</text>
<text x="640" y="166" font-size="10.5" text-anchor="middle" fill="#1f2937">Pyknosis → karyorrhexis → karyolysis</text>
<text x="640" y="186" font-size="10.5" font-weight="700" text-anchor="middle" fill="#7f1d1d">No return → cell death (necrosis)</text>

<polygon points="640,205 640,225 635,215" fill="#4b5563"/>
<rect x="470" y="230" width="340" height="45" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="640" y="250" font-size="11" font-weight="700" text-anchor="middle" fill="#92400e">Ferroptosis (parallel route): lipid peroxidation,</text>
<text x="640" y="266" font-size="10.5" text-anchor="middle" fill="#92400e">iron-dependent — blocked by iron chelators / antioxidants</text>
</svg>
