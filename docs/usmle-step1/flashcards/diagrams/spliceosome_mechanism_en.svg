<svg class="diagram" viewBox="0 0 860 467" xmlns="http://www.w3.org/2000/svg">
<title>The spliceosome mechanism: GU...AG cleavage and lariat formation</title>
<text x="430.0" y="20" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1f2937" >Primary transcript (hnRNA) — note TWO different 5'/3' pairs!</text>
<rect x="40" y="44" width="780" height="50" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
<text x="58" y="66" font-size="9.3" font-weight="700" text-anchor="start" fill="#4b5563" >5' (of the WHOLE transcript)</text>
<rect x="90" y="74" width="110" height="16" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
<text x="145" y="86" font-size="9.6" font-weight="700" text-anchor="middle" fill="#1e3a8a" >Exon 1</text>
<rect x="220" y="52" width="400" height="38" rx="5" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.3"/>
<text x="260" y="66" font-size="11" font-weight="700" text-anchor="middle" fill="#b91c1c" >5'-GU</text>
<text x="420" y="66" font-size="10" font-weight="400" text-anchor="middle" fill="#7f1d1d" >Intron</text>
<circle cx="420" cy="75" r="4" fill="#b91c1c"/>
<text x="420" y="85" font-size="8.6" font-weight="400" text-anchor="middle" fill="#7f1d1d" >▲ branch point (A)</text>
<text x="580" y="66" font-size="11" font-weight="700" text-anchor="middle" fill="#b91c1c" >AG-3'</text>
<rect x="650" y="74" width="110" height="16" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
<text x="705" y="86" font-size="9.6" font-weight="700" text-anchor="middle" fill="#1e3a8a" >Exon 2</text>
<text x="802" y="66" font-size="9.3" font-weight="700" text-anchor="end" fill="#4b5563" >3' (of the WHOLE transcript)</text>
<rect x="230" y="108" width="400" height="30" rx="6" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2"/>
<text x="430" y="128" font-size="9.2" font-weight="700" text-anchor="middle" fill="#92400e" >By contrast: GU = the intron's OWN 5' end, AG = the intron's OWN 3' end — not the whole transcript's!</text>
<line x1="20" y1="152" x2="840" y2="152" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="430.0" y="168" font-size="11" font-weight="700" text-anchor="middle" fill="#1f2937" >Step 1: U1 snRNP binds the 5' splice site; U2 binds the branch point</text>
<text x="430.0" y="194" font-size="11" font-weight="700" text-anchor="middle" fill="#1f2937" >Step 2: first cut at GU — the intron's 5' end bonds to the branch point, forming a lariat loop</text>
<circle cx="420" cy="271" r="42" fill="#fce7f3" stroke="#a21caf" stroke-width="2.5" stroke-dasharray="6,3"/>
<text x="420" y="267" font-size="11" font-weight="700" text-anchor="middle" fill="#701a75" >lariat</text>
<text x="420" y="285" font-size="8.8" font-weight="400" text-anchor="middle" fill="#701a75" >(intron in loop form)</text>
<rect x="90" y="256" width="110" height="30" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
<text x="145" y="275" font-size="10" font-weight="700" text-anchor="middle" fill="#1e3a8a" >Exon 1</text>
<rect x="650" y="256" width="110" height="30" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
<text x="705" y="275" font-size="10" font-weight="700" text-anchor="middle" fill="#1e3a8a" >Exon 2</text>
<text x="430.0" y="333" font-size="11" font-weight="700" text-anchor="middle" fill="#1f2937" >Step 3: second cut at AG — exons are ligated, the lariat is released and degraded</text>
<rect x="90" y="359" width="110" height="30" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
<text x="145" y="379" font-size="10" font-weight="700" text-anchor="middle" fill="#1e3a8a" >Exon 1</text>
<line x1="200" y1="374" x2="650" y2="374" stroke="#2563eb" stroke-width="3"/>
<text x="430" y="368" font-size="10" font-weight="700" text-anchor="middle" fill="#1e3a8a" >mature mRNA</text>
<rect x="650" y="359" width="110" height="30" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
<text x="705" y="379" font-size="10" font-weight="700" text-anchor="middle" fill="#1e3a8a" >Exon 2</text>
<rect x="20" y="413" width="820" height="44" rx="8" fill="#fce7f3" stroke="#a21caf" stroke-width="1.5"/>
<text x="430.0" y="431" font-size="10.6" font-weight="700" text-anchor="middle" fill="#701a75" >↓ SMN protein deficient → faulty snRNP assembly → anterior horn degeneration → SMA ("floppy baby")</text>
<text x="430.0" y="447" font-size="9.6" font-weight="400" text-anchor="middle" fill="#701a75" >Anti-U1 snRNP antibodies: SLE and mixed connective tissue disease</text>
</svg>