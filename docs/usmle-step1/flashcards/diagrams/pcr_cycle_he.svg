<svg class="diagram" viewBox="0 0 860 330" xmlns="http://www.w3.org/2000/svg">
<title>מחזור ה-PCR: דנטורציה, היצמדות, הארכה</title>
<text x="430" y="24" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1f2937">מחזור החום התלת-שלבי של PCR (חוזר 20-40 פעמים)</text>
<rect x="30" y="55" width="245" height="110" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="152" y="80" font-size="12.5" font-weight="700" text-anchor="middle" fill="#7f1d1d">1. דנטורציה</text>
<text x="152" y="98" font-size="10.5" text-anchor="middle" fill="#7f1d1d">~95°C</text>
<text x="152" y="116" font-size="10" text-anchor="middle" fill="#7f1d1d">הפרדת שני גדילי ה-DNA</text>
<text x="152" y="132" font-size="10" text-anchor="middle" fill="#7f1d1d">(שבירת קשרי מימן)</text>
<text x="152" y="150" font-size="9.5" text-anchor="middle" fill="#7f1d1d">תבנית + פריימרים + פולימראז + dNTPs</text>
<polygon points="280,102 310,95 310,109" fill="#4b5563"/>
<rect x="315" y="55" width="245" height="110" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="437" y="80" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1e3a8a">2. היצמדות (Annealing)</text>
<text x="437" y="98" font-size="10.5" text-anchor="middle" fill="#1e3a8a">~50-65°C (קירור)</text>
<text x="437" y="116" font-size="10" text-anchor="middle" fill="#1f2937">פריימרים נצמדים לרצף</text>
<text x="437" y="132" font-size="10" text-anchor="middle" fill="#1f2937">הספציפי המשלים בתבנית</text>
<polygon points="565,102 595,95 595,109" fill="#4b5563"/>
<rect x="600" y="55" width="230" height="110" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
<text x="715" y="80" font-size="12.5" font-weight="700" text-anchor="middle" fill="#065f46">3. הארכה (Elongation)</text>
<text x="715" y="98" font-size="10.5" text-anchor="middle" fill="#065f46">~72°C (חימום)</text>
<text x="715" y="116" font-size="10" text-anchor="middle" fill="#1f2937">DNA פולימראז תרמו-יציב</text>
<text x="715" y="132" font-size="10" text-anchor="middle" fill="#1f2937">מוסיף dNTPs מהפריימר והלאה</text>
<path d="M 715 165 C 715 210, 152 210, 152 165" fill="none" stroke="#4b5563" stroke-width="2" marker-end="url(#arrowPcrHe)"/>
<defs>
  <marker id="arrowPcrHe" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
    <polygon points="0,0 8,3 0,6" fill="#4b5563"/>
  </marker>
</defs>
<text x="430" y="228" font-size="11.5" font-weight="700" text-anchor="middle" fill="#374151">חוזר על עצמו n פעמים — הכפלה אקספוננציאלית (≈2ⁿ עותקים) עד לכמות DNA מספקת</text>
<rect x="30" y="250" width="800" height="60" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
<text x="430" y="273" font-size="11.5" font-weight="700" text-anchor="middle" fill="#92400e">שימוש אבחנתי: זיהוי HIV נאונטלי (לפני שנוגדנים אימהיים מתפוגגים), אנצפליטיס הרפטית (HSV DNA בנוזל השדרה)</text>
<text x="430" y="293" font-size="10.5" text-anchor="middle" fill="#92400e">רגישות גבוהה מאוד — מזהה כמויות DNA/RNA זעירות שאין דרך אחרת לגלותן</text>
</svg>
