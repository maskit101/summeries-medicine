<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg class="diagram" viewBox="0 0 1000 480" xmlns="http://www.w3.org/2000/svg" direction="ltr">
<title>SSSS מול TEN — מנגנון ועומק ההפרדה</title>
<text x="500" y="26" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2937">SSSS מול TEN — אותו ביטוי קליני, עומק הפרדה הפוך</text>
<text x="500" y="45" font-size="10.5" text-anchor="middle" fill="#4b5563">שני פאנלים: תחילה האפידרמיס השלם, לאחר מכן האזור בו מתרחשת ההפרדה</text>

<rect x="55" y="70" width="430" height="20" fill="none"/>
<text x="270" y="88" font-size="12.5" font-weight="700" text-anchor="middle" fill="#9f1239">Staphylococcal Scalded Skin Syndrome</text>

<rect x="80" y="105" width="390" height="32" rx="4" fill="#fde68a" stroke="#92400e" stroke-width="1.5"/>
<text x="275" y="125" font-size="10" text-anchor="middle" fill="#78350f">Stratum Corneum</text>

<rect x="80" y="139" width="390" height="30" rx="4" fill="#fcd34d" stroke="#92400e" stroke-width="1.5"/>
<text x="275" y="157" font-size="10" text-anchor="middle" fill="#78350f">Stratum Lucidum</text>

<rect x="80" y="171" width="390" height="34" rx="4" fill="#dc2626" stroke="#7f1d1d" stroke-width="2.5"/>
<text x="275" y="192" font-size="10.5" font-weight="700" text-anchor="middle" fill="#fff">⚡ הפרדה כאן — Stratum Granulosum</text>

<rect x="80" y="207" width="390" height="30" rx="4" fill="#f59e0b" stroke="#92400e" stroke-width="1.5"/>
<text x="275" y="225" font-size="10" text-anchor="middle" fill="#78350f">Stratum Spinosum</text>

<rect x="80" y="239" width="390" height="34" rx="4" fill="#d97706" stroke="#78350f" stroke-width="1.5"/>
<text x="275" y="259" font-size="10" text-anchor="middle" fill="#fff7ed">Stratum Basale (נשאר שלם)</text>

<rect x="80" y="277" width="390" height="24" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="275" y="293" font-size="9.5" text-anchor="middle" fill="#1e3a8a">דרמיס — ללא מעורבות</text>

<rect x="80" y="310" width="390" height="100" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="275" y="332" font-size="10" font-weight="700" text-anchor="middle" fill="#7f1d1d">מנגנון: אקסוטוקסין (exfoliative toxin)</text>
<text x="275" y="350" font-size="9" text-anchor="middle" fill="#7f1d1d">נקשר ומבקע desmoglein 1</text>
<text x="275" y="366" font-size="9" text-anchor="middle" fill="#7f1d1d">בתוך stratum granulosum בלבד</text>
<text x="275" y="384" font-size="9" font-weight="700" text-anchor="middle" fill="#7f1d1d">הפרדה שטחית — ללא מעורבות רירית</text>
<text x="275" y="400" font-size="9" text-anchor="middle" fill="#7f1d1d">מחלים לחלוטין, Nikolsky חיובי</text>

<rect x="520" y="70" width="420" height="20" fill="none"/>
<text x="730" y="88" font-size="12.5" font-weight="700" text-anchor="middle" fill="#9f1239">Toxic Epidermal Necrolysis (TEN) — להשוואה</text>

<rect x="540" y="105" width="390" height="165" rx="4" fill="#fde68a" stroke="#92400e" stroke-width="1.5"/>
<text x="735" y="190" font-size="10.5" font-weight="700" text-anchor="middle" fill="#78350f">כל האפידרמיס (5 שכבות)</text>
<text x="735" y="208" font-size="9" text-anchor="middle" fill="#78350f">נמק אפופטוטי נרחב של קרטינוציטים</text>
<text x="735" y="224" font-size="9" text-anchor="middle" fill="#78350f">(תגובה חיסונית לתרופה, לא טוקסין חיידקי)</text>

<rect x="540" y="273" width="390" height="38" rx="4" fill="#dc2626" stroke="#7f1d1d" stroke-width="2.5"/>
<text x="735" y="296" font-size="10.5" font-weight="700" text-anchor="middle" fill="#fff">⚡ הפרדה כאן — צומת אפידרמלי-דרמלי</text>

<rect x="540" y="310" width="390" height="100" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="735" y="332" font-size="10" font-weight="700" text-anchor="middle" fill="#7f1d1d">מנגנון: אפופטוזיס חיסוני של קרטינוציטים</text>
<text x="735" y="350" font-size="9" text-anchor="middle" fill="#7f1d1d">(תגובת יתר לתרופה — Stevens-Johnson/TEN spectrum)</text>
<text x="735" y="368" font-size="9" font-weight="700" text-anchor="middle" fill="#7f1d1d">הפרדה עמוקה — כל האפידרמיס מנותק</text>
<text x="735" y="386" font-size="9" text-anchor="middle" fill="#7f1d1d">מעורבות רירית נפוצה, תמותה גבוהה יותר</text>

<rect x="60" y="430" width="880" height="38" rx="8" fill="#111827"/>
<text x="500" y="453" font-size="10.5" font-weight="700" text-anchor="middle" fill="#f9fafb">שני המצבים נראים דומים קלינית (קילוף עור נרחב) — אך SSSS שטחי ומחלים לגמרי, TEN עמוק וקשה הרבה יותר</text>
</svg>