<svg class="diagram" viewBox="0 0 860 240" xmlns="http://www.w3.org/2000/svg">
<title>שלושה סוגי תאים לפי יכולת התחדשות</title>
<text x="430" y="24" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1f2937">Permanent / Stable / Labile — יחס למחזור התא</text>
<rect x="20" y="45" width="260" height="175" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="150" y="70" font-size="13" font-weight="700" text-anchor="middle" fill="#7f1d1d">Permanent (קבועים)</text>
<text x="150" y="92" font-size="10.5" text-anchor="middle" fill="#1f2937">יוצאים ל-G0 ולא חוזרים</text>
<text x="150" y="108" font-size="10.5" text-anchor="middle" fill="#1f2937">מתחדשים רק דרך תאי-גזע</text>
<text x="150" y="132" font-size="10.3" font-weight="700" text-anchor="middle" fill="#7f1d1d">נוירונים</text>
<text x="150" y="150" font-size="10.3" font-weight="700" text-anchor="middle" fill="#7f1d1d">שריר שלד ולב</text>
<text x="150" y="168" font-size="10.3" font-weight="700" text-anchor="middle" fill="#7f1d1d">כדוריות דם אדומות</text>
<text x="150" y="196" font-size="10" text-anchor="middle" fill="#4b5563">רגישות נמוכה לכימותרפיה</text>
<rect x="300" y="45" width="260" height="175" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="430" y="70" font-size="13" font-weight="700" text-anchor="middle" fill="#92400e">Stable (יציבים)</text>
<text x="430" y="92" font-size="10.5" text-anchor="middle" fill="#1f2937">יושבים ב-G0</text>
<text x="430" y="108" font-size="10.5" text-anchor="middle" fill="#1f2937">חוזרים ל-G1 כשמגורים</text>
<text x="430" y="132" font-size="10.3" font-weight="700" text-anchor="middle" fill="#92400e">הפטוציטים</text>
<text x="430" y="150" font-size="10.3" font-weight="700" text-anchor="middle" fill="#92400e">לימפוציטים</text>
<text x="430" y="168" font-size="10.3" font-weight="700" text-anchor="middle" fill="#92400e">PCT, periosteum</text>
<text x="430" y="196" font-size="10" text-anchor="middle" fill="#4b5563">רגישות בינונית לכימותרפיה</text>
<rect x="580" y="45" width="260" height="175" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
<text x="710" y="70" font-size="13" font-weight="700" text-anchor="middle" fill="#065f46">Labile (לביליים)</text>
<text x="710" y="92" font-size="10.5" text-anchor="middle" fill="#1f2937">לעולם לא נכנסים ל-G0</text>
<text x="710" y="108" font-size="10.5" text-anchor="middle" fill="#1f2937">מתחלקים במהירות, G1 קצר</text>
<text x="710" y="132" font-size="10.3" font-weight="700" text-anchor="middle" fill="#065f46">מח עצם</text>
<text x="710" y="150" font-size="10.3" font-weight="700" text-anchor="middle" fill="#065f46">אפיתל מעי, עור</text>
<text x="710" y="168" font-size="10.3" font-weight="700" text-anchor="middle" fill="#065f46">זקיקי שיער, תאי נבט</text>
<text x="710" y="196" font-size="10" font-weight="700" text-anchor="middle" fill="#065f46">הכי פגיעים לכימותרפיה!</text>
</svg>
