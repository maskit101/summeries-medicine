<svg class="diagram" viewBox="0 0 900 340" xmlns="http://www.w3.org/2000/svg" direction="ltr">
<title>The three phases of wound healing over time</title>
<text x="450" y="26" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2937">Wound Healing Timeline — Inflammatory to Remodeling</text>

<line x1="40" y1="70" x2="860" y2="70" stroke="#94a3b8" stroke-width="4"/>
<polygon points="860,70 850,64 850,76" fill="#94a3b8"/>
<text x="40" y="55" font-size="10.5" fill="#4b5563">Time of injury</text>
<text x="860" y="55" font-size="10.5" text-anchor="end" fill="#4b5563">6+ months</text>

<circle cx="150" cy="70" r="6" fill="#b91c1c"/>
<circle cx="420" cy="70" r="6" fill="#047857"/>
<circle cx="700" cy="70" r="6" fill="#2563eb"/>

<rect x="45" y="100" width="280" height="150" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="185" y="122" font-size="12.5" font-weight="700" text-anchor="middle" fill="#7f1d1d">1. Inflammatory</text>
<text x="185" y="140" font-size="10" text-anchor="middle" fill="#7f1d1d">Up to 3 days post-wound</text>
<text x="185" y="160" font-size="9.5" text-anchor="middle" fill="#1f2937">Effector cells: platelets,</text>
<text x="185" y="174" font-size="9.5" text-anchor="middle" fill="#1f2937">neutrophils, macrophages</text>
<text x="185" y="194" font-size="9.5" text-anchor="middle" fill="#1f2937">Clot forms, vessel permeability up,</text>
<text x="185" y="208" font-size="9.5" text-anchor="middle" fill="#1f2937">neutrophil migration into tissue</text>
<text x="185" y="228" font-size="9.5" font-weight="700" text-anchor="middle" fill="#7f1d1d">Macrophages clear debris (~day 2)</text>

<rect x="335" y="100" width="280" height="150" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
<text x="475" y="122" font-size="12.5" font-weight="700" text-anchor="middle" fill="#065f46">2. Proliferative</text>
<text x="475" y="140" font-size="10" text-anchor="middle" fill="#065f46">Day 3 — weeks post-wound</text>
<text x="475" y="160" font-size="9.5" text-anchor="middle" fill="#1f2937">Effector cells: fibroblasts,</text>
<text x="475" y="174" font-size="9.5" text-anchor="middle" fill="#1f2937">myofibroblasts, endothelium, keratinocytes</text>
<text x="475" y="194" font-size="9.5" text-anchor="middle" fill="#1f2937">Granulation tissue + type III collagen,</text>
<text x="475" y="208" font-size="9.5" text-anchor="middle" fill="#1f2937">angiogenesis, wound contraction (myofibroblast)</text>
<text x="475" y="228" font-size="9.5" font-weight="700" text-anchor="middle" fill="#065f46">Delayed by vitamin C / copper deficiency</text>

<rect x="625" y="100" width="230" height="150" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="740" y="122" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1e3a8a">3. Remodeling</text>
<text x="740" y="140" font-size="10" text-anchor="middle" fill="#1e3a8a">Week 1 — 6+ months</text>
<text x="740" y="160" font-size="9.5" text-anchor="middle" fill="#1f2937">Effector cells: fibroblasts</text>
<text x="740" y="182" font-size="9.5" font-weight="700" text-anchor="middle" fill="#1e3a8a">Type III collagen → type I</text>
<text x="740" y="198" font-size="9.5" text-anchor="middle" fill="#1f2937">Zinc-dependent collagenases break down III</text>
<text x="740" y="216" font-size="9.5" text-anchor="middle" fill="#1f2937">Tensile strength up; zinc deficiency delays healing</text>
<text x="740" y="236" font-size="9.5" font-weight="700" text-anchor="middle" fill="#1e3a8a">70-80% strength regained by 3 months</text>

<rect x="45" y="270" width="810" height="55" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
<text x="450" y="292" font-size="11" font-weight="700" text-anchor="middle" fill="#92400e">Mediators across all phases: FGF/VEGF/TGF-β (angiogenesis), PDGF (fibroblast growth),</text>
<text x="450" y="310" font-size="11" font-weight="700" text-anchor="middle" fill="#92400e">metalloproteinases (tissue remodeling), EGF (cell growth via EGFR/ErbB1)</text>
</svg>
