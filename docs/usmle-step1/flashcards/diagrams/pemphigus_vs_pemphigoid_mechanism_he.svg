<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg class="diagram" viewBox="0 0 1000 480" xmlns="http://www.w3.org/2000/svg" direction="ltr">
<title>Pemphigus Vulgaris מול Bullous Pemphigoid — מנגנון ועומק ההפרדה</title>
<text x="500" y="26" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2937">Pemphigus Vulgaris מול Bullous Pemphigoid — אותו ביטוי (בולות), עומק הפרדה הפוך</text>
<text x="500" y="45" font-size="10.5" text-anchor="middle" fill="#4b5563">שני פאנלים: אותם 6 שכבות אפידרמיס/דרמיס, הצבע האדום מסמן היכן בפועל מתרחשת ההפרדה</text>

<rect x="55" y="70" width="430" height="20" fill="none"/>
<text x="270" y="88" font-size="12.5" font-weight="700" text-anchor="middle" fill="#9f1239">Pemphigus Vulgaris</text>

<rect x="80" y="105" width="390" height="30" rx="4" fill="#fde68a" stroke="#92400e" stroke-width="1.5"/>
<text x="275" y="124" font-size="10" text-anchor="middle" fill="#78350f">Stratum Corneum</text>

<rect x="80" y="139" width="390" height="30" rx="4" fill="#fcd34d" stroke="#92400e" stroke-width="1.5"/>
<text x="275" y="158" font-size="10" text-anchor="middle" fill="#78350f">Stratum Lucidum</text>

<rect x="80" y="173" width="390" height="30" rx="4" fill="#f59e0b" stroke="#92400e" stroke-width="1.5"/>
<text x="275" y="192" font-size="10" text-anchor="middle" fill="#78350f">Stratum Granulosum</text>

<rect x="80" y="207" width="390" height="30" rx="4" fill="#dc2626" stroke="#7f1d1d" stroke-width="2.5"/>
<text x="275" y="222" font-size="9.5" font-weight="700" text-anchor="middle" fill="#fff">⚡ הפרדה כאן — Stratum Spinosum</text>
<text x="275" y="233" font-size="8" text-anchor="middle" fill="#fee2e2">(סופרהבזלי, Acantholysis)</text>

<rect x="80" y="241" width="390" height="30" rx="4" fill="#d97706" stroke="#78350f" stroke-width="1.5"/>
<text x="275" y="260" font-size="10" text-anchor="middle" fill="#fff7ed">Stratum Basale (נשאר שלם)</text>

<rect x="80" y="275" width="390" height="30" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="275" y="294" font-size="9.5" text-anchor="middle" fill="#1e3a8a">דרמיס — ללא מעורבות</text>

<rect x="80" y="313" width="390" height="100" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="275" y="332" font-size="10" font-weight="700" text-anchor="middle" fill="#7f1d1d">מנגנון: IgG כנגד Desmoglein 3 (±1)</text>
<text x="275" y="348" font-size="8.5" text-anchor="middle" fill="#7f1d1d">נקשר לדסמוזום בין קרטינוציטים ב-stratum spinosum</text>
<text x="275" y="362" font-size="8.5" text-anchor="middle" fill="#7f1d1d">מבקע חיבורי תא ← Acantholysis ← בולות תוך-אפידרמליות רפויות</text>
<text x="275" y="378" font-size="8.5" font-weight="700" text-anchor="middle" fill="#7f1d1d">Nikolsky חיובי • מעורבות רירית הפה • "Row of tombstones" ב-H&amp;E</text>
<text x="275" y="396" font-size="8.5" text-anchor="middle" fill="#7f1d1d">אימונופלואורסצנציה: דפוס רשתי (reticular) סביב תאי האפידרמיס</text>

<rect x="520" y="70" width="420" height="20" fill="none"/>
<text x="730" y="88" font-size="12.5" font-weight="700" text-anchor="middle" fill="#9f1239">Bullous Pemphigoid — להשוואה</text>

<rect x="540" y="105" width="390" height="30" rx="4" fill="#fde68a" stroke="#92400e" stroke-width="1.5"/>
<text x="735" y="124" font-size="10" text-anchor="middle" fill="#78350f">Stratum Corneum</text>

<rect x="540" y="139" width="390" height="30" rx="4" fill="#fcd34d" stroke="#92400e" stroke-width="1.5"/>
<text x="735" y="158" font-size="10" text-anchor="middle" fill="#78350f">Stratum Lucidum</text>

<rect x="540" y="173" width="390" height="30" rx="4" fill="#f59e0b" stroke="#92400e" stroke-width="1.5"/>
<text x="735" y="192" font-size="10" text-anchor="middle" fill="#78350f">Stratum Granulosum</text>

<rect x="540" y="207" width="390" height="30" rx="4" fill="#fbbf24" stroke="#92400e" stroke-width="1.5"/>
<text x="735" y="226" font-size="10" text-anchor="middle" fill="#78350f">Stratum Spinosum (נשאר שלם)</text>

<rect x="540" y="241" width="390" height="30" rx="4" fill="#d97706" stroke="#78350f" stroke-width="1.5"/>
<text x="735" y="260" font-size="10" text-anchor="middle" fill="#fff7ed">Stratum Basale (נשאר שלם)</text>

<rect x="540" y="275" width="390" height="30" rx="4" fill="#dc2626" stroke="#7f1d1d" stroke-width="2.5"/>
<text x="735" y="290" font-size="9.5" font-weight="700" text-anchor="middle" fill="#fff">⚡ הפרדה כאן — Hemidesmosome</text>
<text x="735" y="301" font-size="8" text-anchor="middle" fill="#fee2e2">(קרום הבסיס, תת-אפידרמלית)</text>

<rect x="540" y="313" width="390" height="100" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="735" y="332" font-size="10" font-weight="700" text-anchor="middle" fill="#7f1d1d">מנגנון: IgG כנגד Hemidesmosome (BPAG1/2)</text>
<text x="735" y="348" font-size="8.5" text-anchor="middle" fill="#7f1d1d">נקשר לחלבונים המחברים קרטינוציט בזאלי לקרום הבסיס</text>
<text x="735" y="362" font-size="8.5" text-anchor="middle" fill="#7f1d1d">מפריד את כל האפידרמיס מהדרמיס ← בולה תת-אפידרמלית מתוחה</text>
<text x="735" y="378" font-size="8.5" font-weight="700" text-anchor="middle" fill="#7f1d1d">Nikolsky שלילי • רירית הפה נשמרת • תוכן הבולה: אאוזינופילים</text>
<text x="735" y="396" font-size="8.5" text-anchor="middle" fill="#7f1d1d">אימונופלואורסצנציה: דפוס ליניארי לאורך הצומת האפידרמלי-דרמלי</text>

<rect x="60" y="430" width="880" height="38" rx="8" fill="#111827"/>
<text x="500" y="450" font-size="10" font-weight="700" text-anchor="middle" fill="#f9fafb">PV: תוך-אפידרמלי/גבוה (סופרהבזלי), פחות יציב, Nikolsky חיובי — BP: תת-אפידרמלי/נמוך, יציב יותר, Nikolsky שלילי</text>
<text x="500" y="462" font-size="8.5" text-anchor="middle" fill="#9ca3af">זכרו: Bullous pemphigoid — נוגדנים "מפילים" (bullow) את האפידרמיס מלמטה; Pemphigus — הידבקות התאים עצמם נהרסת מבפנים</text>
</svg>
