<svg class="diagram" viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg" direction="ltr">
<title>Four steps of leukocyte extravasation across the postcapillary venule wall</title>
<text x="450" y="26" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2937">Neutrophil Extravasation — 4 Steps at the Postcapillary Venule</text>

<rect x="20" y="55" width="860" height="70" fill="#fee2e2" opacity="0.35"/>
<text x="45" y="75" font-size="11" font-weight="700" fill="#7f1d1d">Vessel lumen (blood flow)</text>

<rect x="20" y="125" width="860" height="26" fill="#cbd5e1"/>
<text x="450" y="143" font-size="10.5" text-anchor="middle" fill="#334155" font-weight="700">Endothelium / postcapillary venule wall</text>

<rect x="20" y="151" width="860" height="90" fill="#ecfdf5" opacity="0.5"/>
<text x="45" y="171" font-size="11" font-weight="700" fill="#065f46">Interstitium (site of injury/infection)</text>

<g>
  <circle cx="130" cy="90" r="16" fill="#fbbf24" stroke="#92400e" stroke-width="1.5"/>
  <circle cx="130" cy="90" r="16" fill="none" stroke="#92400e" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="115" y1="151" x2="145" y2="151" stroke="#b45309" stroke-width="3"/>
  <text x="130" y="115" font-size="9" text-anchor="middle" fill="#92400e" font-weight="700">Sialyl Lewis-X</text>
  <text x="130" y="145" font-size="9" text-anchor="middle" fill="#92400e" font-weight="700">E/P-selectin up</text>
</g>
<rect x="30" y="255" width="185" height="115" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="122" y="275" font-size="11.5" font-weight="700" text-anchor="middle" fill="#92400e">1. Margination &amp; rolling</text>
<text x="122" y="292" font-size="9.5" text-anchor="middle" fill="#1f2937">E-selectin (Weibel-Palade,</text>
<text x="122" y="305" font-size="9.5" text-anchor="middle" fill="#1f2937">TNF/IL-1) + P-selectin ↔</text>
<text x="122" y="318" font-size="9.5" text-anchor="middle" fill="#1f2937">leukocyte Sialyl Lewis-X</text>
<text x="122" y="335" font-size="9.5" text-anchor="middle" fill="#1f2937">GlyCAM-1/CD34 ↔ L-selectin</text>
<text x="122" y="354" font-size="9.5" font-weight="700" text-anchor="middle" fill="#b45309">Defect → LAD type 2</text>

<g>
  <circle cx="340" cy="130" r="16" fill="#fbbf24" stroke="#92400e" stroke-width="1.5"/>
  <line x1="325" y1="140" x2="325" y2="151" stroke="#1d4ed8" stroke-width="3"/>
  <line x1="355" y1="140" x2="355" y2="151" stroke="#1d4ed8" stroke-width="3"/>
  <text x="340" y="118" font-size="9" text-anchor="middle" fill="#1e3a8a" font-weight="700">CD11/18</text>
</g>
<rect x="255" y="255" width="185" height="115" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="347" y="275" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1e3a8a">2. Tight binding (adhesion)</text>
<text x="347" y="292" font-size="9.5" text-anchor="middle" fill="#1f2937">ICAM-1 (CD54) ↔ CD11/18</text>
<text x="347" y="305" font-size="9.5" text-anchor="middle" fill="#1f2937">(LFA-1, Mac-1) on leukocyte</text>
<text x="347" y="318" font-size="9.5" text-anchor="middle" fill="#1f2937">VCAM-1 (CD106) ↔ VLA-4</text>
<text x="347" y="335" font-size="9.5" text-anchor="middle" fill="#1f2937">Firm arrest on endothelium</text>
<text x="347" y="354" font-size="9.5" font-weight="700" text-anchor="middle" fill="#1e3a8a">Defect → LAD type 1 (↓CD18)</text>

<g>
  <circle cx="565" cy="150" r="15" fill="#fbbf24" stroke="#92400e" stroke-width="1.3" opacity="0.9"/>
  <circle cx="565" cy="185" r="16" fill="#fbbf24" stroke="#92400e" stroke-width="1.5"/>
  <line x1="565" y1="140" x2="565" y2="195" stroke="#7f1d1d" stroke-width="2" stroke-dasharray="3 2"/>
</g>
<rect x="480" y="255" width="185" height="115" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="572" y="275" font-size="11.5" font-weight="700" text-anchor="middle" fill="#7f1d1d">3. Diapedesis</text>
<text x="572" y="292" font-size="9.5" text-anchor="middle" fill="#1f2937">PECAM-1 (CD31) on both sides</text>
<text x="572" y="309" font-size="9.5" text-anchor="middle" fill="#1f2937">Leukocyte squeezes between</text>
<text x="572" y="322" font-size="9.5" text-anchor="middle" fill="#1f2937">endothelial cells, exits vessel</text>
<text x="572" y="342" font-size="9.5" text-anchor="middle" fill="#7f1d1d">(transmigration)</text>

<g>
  <circle cx="790" cy="220" r="16" fill="#fbbf24" stroke="#92400e" stroke-width="1.5"/>
  <path d="M790,204 C 770,190 760,175 750,160" stroke="#4b5563" stroke-width="1.3" fill="none" stroke-dasharray="3 2" marker-end="url(#arrowh2)"/>
  <circle cx="720" cy="150" r="6" fill="#059669"/>
  <text x="720" y="140" font-size="8" text-anchor="middle" fill="#065f46">infection site</text>
</g>
<rect x="705" y="255" width="175" height="115" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
<text x="792" y="275" font-size="11.5" font-weight="700" text-anchor="middle" fill="#065f46">4. Migration (chemotaxis)</text>
<text x="792" y="292" font-size="9.5" text-anchor="middle" fill="#1f2937">Chemoattractants:</text>
<text x="792" y="308" font-size="9.5" text-anchor="middle" fill="#1f2937">C5a, IL-8, LTB4, 5-HETE,</text>
<text x="792" y="323" font-size="9.5" text-anchor="middle" fill="#1f2937">kallikrein, PAF,</text>
<text x="792" y="338" font-size="9.5" text-anchor="middle" fill="#1f2937">N-formylmethionyl peptides</text>
<text x="792" y="356" font-size="9.5" font-weight="700" text-anchor="middle" fill="#065f46">→ toward injury/infection site</text>

<defs>
  <marker id="arrowh2" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 z" fill="#4b5563"/>
  </marker>
</defs>

<polygon points="220,300 250,300 250,293 250,307" fill="#9ca3af"/>
<polygon points="445,300 475,300 475,293 475,307" fill="#9ca3af"/>
<polygon points="670,300 700,300 700,293 700,307" fill="#9ca3af"/>
</svg>
