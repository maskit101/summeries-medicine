<svg class="diagram" viewBox="0 0 860 210" xmlns="http://www.w3.org/2000/svg">
<title>משאבת Na+/K+-ATPase ומנגנון דיגוקסין</title>
<text x="430" y="24" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937">Na⁺/K⁺-ATPase: 3 Na⁺ החוצה, 2 K⁺ פנימה, לכל ATP</text>
<rect x="30" y="45" width="800" height="10" fill="#e5e7eb"/>
<text x="60" y="42" font-size="10.5" fill="#4b5563">מרחב חוץ-תאי</text>
<rect x="30" y="130" width="800" height="10" fill="#e5e7eb"/>
<text x="60" y="160" font-size="10.5" fill="#4b5563">ציטוזול</text>
<rect x="360" y="55" width="140" height="75" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<text x="430" y="97" font-size="11.5" font-weight="700" text-anchor="middle" fill="#92400e">המשאבה</text>
<polygon points="330,65 300,72 300,58" fill="#065f46"/>
<text x="270" y="66" font-size="11" font-weight="700" text-anchor="middle" fill="#065f46">2K⁺ פנימה</text>
<polygon points="530,72 560,65 560,79" fill="#b91c1c"/>
<text x="620" y="66" font-size="11" font-weight="700" text-anchor="middle" fill="#7f1d1d">3Na⁺ החוצה</text>
<text x="430" y="180" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1f2937">דיגוקסין חוסם ← ↑Na⁺ תוך-תאי ← מחליף Na⁺/Ca²⁺ מואט ← ↑Ca²⁺ ← ↑התכווצות לב</text>
</svg>
