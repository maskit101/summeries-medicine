<svg class="diagram" viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg" direction="ltr">
<title>Granuloma formation mechanism — from antigen presentation to multinucleated giant cell</title>
<text x="450" y="26" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2937">Granuloma Formation Mechanism (Chronic Granulomatous Inflammation)</text>

<rect x="20" y="55" width="185" height="90" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="112" y="76" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1e3a8a">APC presents antigen</text>
<text x="112" y="94" font-size="9.5" text-anchor="middle" fill="#1f2937">Persistent stimulus (e.g. TB)</text>
<text x="112" y="110" font-size="9.5" text-anchor="middle" fill="#1f2937">to CD4+ Th cell</text>
<text x="112" y="128" font-size="9.5" font-weight="700" text-anchor="middle" fill="#1e3a8a">+ secretes IL-12</text>

<polygon points="205,100 235,93 235,107" fill="#4b5563"/>

<rect x="240" y="55" width="185" height="90" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
<text x="332" y="76" font-size="11.5" font-weight="700" text-anchor="middle" fill="#4c1d95">Differentiation to Th1</text>
<text x="332" y="96" font-size="9.5" text-anchor="middle" fill="#1f2937">Driven by IL-12</text>
<text x="332" y="116" font-size="9.5" font-weight="700" text-anchor="middle" fill="#4c1d95">Th1 secretes IFN-γ</text>

<polygon points="425,100 455,93 455,107" fill="#4b5563"/>

<rect x="460" y="55" width="200" height="90" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="560" y="76" font-size="11.5" font-weight="700" text-anchor="middle" fill="#92400e">Macrophage activation</text>
<text x="560" y="96" font-size="9.5" text-anchor="middle" fill="#1f2937">IFN-γ activates macrophages</text>
<text x="560" y="116" font-size="9.5" font-weight="700" text-anchor="middle" fill="#92400e">↑Cytokine secretion (TNF)</text>

<polygon points="665,100 695,93 695,107" fill="#4b5563"/>

<rect x="700" y="55" width="180" height="90" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="790" y="76" font-size="11.5" font-weight="700" text-anchor="middle" fill="#7f1d1d">Epithelioid cells</text>
<text x="790" y="96" font-size="9.5" text-anchor="middle" fill="#1f2937">+ fuse into giant cell</text>
<text x="790" y="116" font-size="9.5" font-weight="700" text-anchor="middle" fill="#7f1d1d">(multinucleated)</text>

<circle cx="180" cy="260" r="95" fill="#fca5a5" opacity="0.35"/>
<circle cx="180" cy="260" r="55" fill="#fecaca" opacity="0.7"/>
<text x="180" y="255" font-size="10" text-anchor="middle" fill="#7f1d1d" font-weight="700">Caseous necrosis</text>
<text x="180" y="270" font-size="9" text-anchor="middle" fill="#7f1d1d">(caseating, e.g. TB)</text>
<circle cx="115" cy="205" r="8" fill="#f59e0b"/><circle cx="245" cy="205" r="8" fill="#f59e0b"/>
<circle cx="105" cy="260" r="8" fill="#f59e0b"/><circle cx="255" cy="260" r="8" fill="#f59e0b"/>
<circle cx="115" cy="315" r="8" fill="#f59e0b"/><circle cx="245" cy="315" r="8" fill="#f59e0b"/>
<circle cx="150" cy="185" r="7" fill="#60a5fa"/><circle cx="210" cy="185" r="7" fill="#60a5fa"/>
<text x="180" y="192" font-size="8" text-anchor="middle" fill="#1e3a8a">Lymphocytes</text>
<ellipse cx="180" cy="330" rx="26" ry="14" fill="#a78bfa"/>
<circle cx="170" cy="326" r="4" fill="#4c1d95"/><circle cx="190" cy="330" r="4" fill="#4c1d95"/><circle cx="180" cy="335" r="4" fill="#4c1d95"/>
<text x="180" y="352" font-size="8.5" text-anchor="middle" fill="#4c1d95" font-weight="700">Multinucleated giant cell</text>
<text x="180" y="365" font-size="8" text-anchor="middle" fill="#4c1d95">(macrophage fusion)</text>

<rect x="330" y="180" width="270" height="190" rx="8" fill="#f8fafc" stroke="#9ca3af" stroke-width="1"/>
<text x="465" y="202" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1f2937">Caseating vs Noncaseating</text>
<text x="465" y="224" font-size="10" font-weight="700" text-anchor="middle" fill="#7f1d1d">Caseating — central necrosis</text>
<text x="465" y="240" font-size="9.5" text-anchor="middle" fill="#1f2937">Infectious: TB, endemic fungi</text>
<text x="465" y="264" font-size="10" font-weight="700" text-anchor="middle" fill="#065f46">Noncaseating — no necrosis</text>
<text x="465" y="280" font-size="9.5" text-anchor="middle" fill="#1f2937">Noninfectious: sarcoidosis, Crohn</text>
<text x="465" y="304" font-size="9.5" font-weight="700" text-anchor="middle" fill="#92400e">Anti-TNF → granuloma breakdown</text>
<text x="465" y="320" font-size="9.5" text-anchor="middle" fill="#1f2937">→ disseminated disease (test latent TB first!)</text>
<text x="465" y="344" font-size="9.5" font-weight="700" text-anchor="middle" fill="#4c1d95">↑1α-hydroxylase in macrophage</text>
<text x="465" y="360" font-size="9.5" text-anchor="middle" fill="#1f2937">→ ↑active vitamin D → hypercalcemia</text>

<rect x="620" y="180" width="260" height="190" rx="8" fill="#f8fafc" stroke="#9ca3af" stroke-width="1"/>
<text x="750" y="202" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1f2937">Main etiologies</text>
<text x="750" y="224" font-size="9.5" text-anchor="middle" fill="#1f2937">Bacterial: TB, leprosy, Bartonella</text>
<text x="750" y="240" font-size="9.5" text-anchor="middle" fill="#1f2937">henselae, Listeria, T. pallidum</text>
<text x="750" y="260" font-size="9.5" text-anchor="middle" fill="#1f2937">Fungal: endemic mycoses</text>
<text x="750" y="276" font-size="9.5" text-anchor="middle" fill="#1f2937">Parasitic: schistosomiasis</text>
<text x="750" y="296" font-size="9.5" text-anchor="middle" fill="#1f2937">Immune: sarcoidosis, Crohn,</text>
<text x="750" y="312" font-size="9.5" text-anchor="middle" fill="#1f2937">1° biliary cholangitis, de Quervain</text>
<text x="750" y="332" font-size="9.5" text-anchor="middle" fill="#1f2937">Vasculitis: GPA, EGPA, GCA,</text>
<text x="750" y="348" font-size="9.5" text-anchor="middle" fill="#1f2937">Takayasu</text>
<text x="750" y="364" font-size="9.5" text-anchor="middle" fill="#1f2937">Foreign body: berylliosis, talcosis</text>
</svg>
