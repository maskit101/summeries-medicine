<svg class="diagram" viewBox="0 0 860 698" xmlns="http://www.w3.org/2000/svg">
<title>מוטציית אתר-שחבור ומוטציית פריימשיפט</title>
<text x="430.0" y="20" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937" >תקין: שחבור נורמלי</text>
<rect x="40" y="40" width="780" height="46" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
<text x="58" y="58" font-size="11" font-weight="700" text-anchor="start" fill="#4b5563" >5'</text>
<rect x="90" y="48" width="130" height="30" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/>
<text x="155" y="68" font-size="11" font-weight="700" text-anchor="middle" fill="#1e3a8a" >אקסון 1</text>
<rect x="230" y="48" width="400" height="30" rx="5" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.3"/>
<text x="275" y="68" font-size="11.5" font-weight="700" text-anchor="middle" fill="#b91c1c" >5'-GU</text>
<text x="430" y="68" font-size="10.3" font-weight="400" text-anchor="middle" fill="#7f1d1d" >אינטרון (נקודת ענף A)</text>
<text x="590" y="68" font-size="11.5" font-weight="700" text-anchor="middle" fill="#b91c1c" >AG-3'</text>
<rect x="650" y="48" width="130" height="30" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/>
<text x="715" y="68" font-size="11" font-weight="700" text-anchor="middle" fill="#1e3a8a" >אקסון 2</text>
<text x="802" y="58" font-size="11" font-weight="700" text-anchor="end" fill="#4b5563" >3'</text>
<text x="430.0" y="104" font-size="10" font-weight="700" text-anchor="middle" fill="#92400e" >שימו לב: ה-5'/3' של כל התעתוק (קצוות אפורים) שונים מה-5'/3' של האינטרון עצמו (GU/AG בתיבה האדומה)!</text>
<circle cx="193" cy="158" r="26" fill="#fce7f3" stroke="#a21caf" stroke-width="2.2" stroke-dasharray="5,3"/>
<text x="193" y="162" font-size="10" font-weight="700" text-anchor="middle" fill="#701a75" >לריאט</text>
<text x="193" y="216" font-size="9.3" font-weight="400" text-anchor="middle" fill="#701a75" >האינטרון לולא -</text>
<text x="193" y="228" font-size="9.3" font-weight="400" text-anchor="middle" fill="#701a75" >צורת לריאט ומוסר</text>
<text x="430" y="156" font-size="11" font-weight="700" text-anchor="middle" fill="#1f2937" >הספליציאוזום (snRNP) חותך תחילה ב-GU, ואז ב-AG</text>
<text x="430" y="176" font-size="10.3" font-weight="400" text-anchor="middle" fill="#4b5563" >האינטרון יוצא כלריאט; שני האקסונים מתחברים</text>
<line x1="155" y1="234" x2="155" y2="246" stroke="#4b5563" stroke-width="2.5"/><polygon points="148,244 162,244 155,256" fill="#4b5563"/>
<rect x="90" y="264" width="130" height="30" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/>
