<text x="430.0" y="328" font-size="13" font-weight="700" text-anchor="middle" fill="#7f1d1d" >מוטציה באתר השחבור: GU→GC בקצה 5' של האינטרון</text>
<rect x="40" y="346" width="780" height="46" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.3"/>
<rect x="90" y="354" width="130" height="30" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/>
