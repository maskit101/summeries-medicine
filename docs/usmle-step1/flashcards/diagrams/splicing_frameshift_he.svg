<rect x="650" y="264" width="130" height="30" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/>
<text x="715" y="284" font-size="11" font-weight="700" text-anchor="middle" fill="#1e3a8a" >אקסון 2</text>
