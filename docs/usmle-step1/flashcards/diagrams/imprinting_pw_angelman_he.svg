<svg class="diagram" viewBox="0 0 860 380" xmlns="http://www.w3.org/2000/svg" direction="ltr">
<title>הטבעה גנומית: תסמונת פראדר-ווילי מול תסמונת אנג'למן</title>
<text x="430" y="24" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1f2937">כרומוזום 15q11-13: עותק הורי אחד מושתק באופן תקין ע"י מתילציה</text>

<rect x="30" y="48" width="800" height="80" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
<text x="430" y="68" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1f2937">אדם תקין &#8212; שני העותקים ההוריים קיימים, אזור אחד מוטבע</text>
<rect x="230" y="78" width="110" height="34" rx="6" fill="#eff6ff" stroke="#2563eb"/>
<text x="285" y="99" font-size="11" font-weight="700" text-anchor="middle" fill="#1e3a8a">P (אבהי)</text>
<text x="285" y="122" font-size="9" text-anchor="middle" fill="#4b5563">פעיל (רוב הגנים)</text>
<rect x="520" y="78" width="110" height="34" rx="6" fill="#fce7f3" stroke="#be185d"/>
<text x="575" y="99" font-size="11" font-weight="700" text-anchor="middle" fill="#831843">M (אמהי)</text>
<text x="575" y="122" font-size="9" text-anchor="middle" fill="#4b5563">פעיל (UBE3A)</text>

<path d="M 210 148 L 210 168" stroke="#4b5563" stroke-width="2" marker-end="url(#impArrHe1)"/>
<path d="M 650 148 L 650 168" stroke="#4b5563" stroke-width="2" marker-end="url(#impArrHe1)"/>
<defs><marker id="impArrHe1" markerWidth="10" markerHeight="10" refX="5" refY="8" orient="auto"><polygon points="0,0 5,9 10,0" fill="#4b5563"/></marker></defs>
<text x="210" y="145" font-size="10" text-anchor="middle" fill="#7f1d1d">האלל האבהי נמחק/מוטציה</text>
<text x="650" y="145" font-size="10" text-anchor="middle" fill="#7f1d1d">האלל האמהי נמחק/מוטציה</text>

<rect x="45" y="172" width="330" height="185" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="210" y="195" font-size="12.5" font-weight="700" text-anchor="middle" fill="#7f1d1d">תסמונת פראדר-ווילי</text>
<rect x="130" y="205" width="65" height="30" rx="5" fill="#e5e7eb" stroke="#6b7280"/>
<text x="162" y="225" font-size="9.5" text-anchor="middle" fill="#374151">P: נמחק/מוטציה</text>
<rect x="225" y="205" width="65" height="30" rx="5" fill="#fce7f3" stroke="#be185d"/>
<text x="257" y="225" font-size="9.5" text-anchor="middle" fill="#831843">M: מושתק</text>
<text x="210" y="256" font-size="10" text-anchor="middle" fill="#7f1d1d">הגנים האמהיים מושתקים באופן תקין &#8592;</text>
<text x="210" y="272" font-size="10" font-weight="700" text-anchor="middle" fill="#7f1d1d">אין עותק פעיל כלל</text>
<text x="210" y="294" font-size="9.5" text-anchor="middle" fill="#7f1d1d">היפרפגיה, השמנה, פיגור שכלי,</text>
<text x="210" y="309" font-size="9.5" text-anchor="middle" fill="#7f1d1d">היפוגונדיזם, היפוטוניה</text>
<text x="210" y="330" font-size="9.5" font-weight="700" text-anchor="middle" fill="#7f1d1d">25% מהמקרים = UPD אמהי</text>
<text x="210" y="347" font-size="9" text-anchor="middle" fill="#7f1d1d">"POP": Paternal allele deleted, Obesity, Prader-Willi</text>

<rect x="485" y="172" width="330" height="185" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
<text x="650" y="195" font-size="12.5" font-weight="700" text-anchor="middle" fill="#065f46">תסמונת אנג'למן</text>
<rect x="570" y="205" width="65" height="30" rx="5" fill="#eff6ff" stroke="#2563eb"/>
<text x="602" y="225" font-size="9.5" text-anchor="middle" fill="#1e3a8a">P: מושתק (UBE3A)</text>
<rect x="665" y="205" width="65" height="30" rx="5" fill="#e5e7eb" stroke="#6b7280"/>
<text x="697" y="225" font-size="9.5" text-anchor="middle" fill="#374151">M: נמחק/מוטציה</text>
<text x="650" y="256" font-size="10" text-anchor="middle" fill="#065f46">UBE3A האבהי מושתק באופן תקין &#8592;</text>
<text x="650" y="272" font-size="10" font-weight="700" text-anchor="middle" fill="#065f46">אין עותק UBE3A פעיל</text>
<text x="650" y="294" font-size="9.5" text-anchor="middle" fill="#065f46">HAILS: ניפנוף ידיים, אטקסיה,</text>
<text x="650" y="309" font-size="9.5" text-anchor="middle" fill="#065f46">פיגור שכלי, צחוק בלתי-הולם, פרכוסים</text>
<text x="650" y="330" font-size="9.5" font-weight="700" text-anchor="middle" fill="#065f46">5% מהמקרים = UPD אבהי</text>
<text x="650" y="347" font-size="9" text-anchor="middle" fill="#065f46">"MAMAS": Maternal allele deleted, Angelman</text>
</svg>
