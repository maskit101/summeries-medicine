<svg class="diagram" viewBox="0 0 860 230" xmlns="http://www.w3.org/2000/svg">
<title>Three cytoskeletal filament families</title>
<text x="430" y="24" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1f2937">Three cytoskeletal families — function and examples</text>
<rect x="20" y="45" width="260" height="165" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="150" y="70" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1e3a8a">Microfilaments</text>
<text x="150" y="92" font-size="10.5" text-anchor="middle" fill="#1f2937">Muscle contraction</text>
<text x="150" y="108" font-size="10.5" text-anchor="middle" fill="#1f2937">Cytokinesis, phagocytosis</text>
<text x="150" y="140" font-size="10.3" font-weight="700" text-anchor="middle" fill="#1e3a8a">Actin</text>
<text x="150" y="158" font-size="10.3" font-weight="700" text-anchor="middle" fill="#1e3a8a">Microvilli</text>
<rect x="300" y="45" width="260" height="165" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
<text x="430" y="70" font-size="12.5" font-weight="700" text-anchor="middle" fill="#065f46">Intermediate filaments</text>
<text x="430" y="92" font-size="10.5" text-anchor="middle" fill="#1f2937">Maintain cell structure</text>
<text x="430" y="108" font-size="10.5" text-anchor="middle" fill="#1f2937">(not movement)</text>
<text x="430" y="132" font-size="9.8" font-weight="700" text-anchor="middle" fill="#065f46">Vimentin, desmin</text>
<text x="430" y="150" font-size="9.8" font-weight="700" text-anchor="middle" fill="#065f46">Cytokeratin, lamins</text>
<text x="430" y="168" font-size="9.8" font-weight="700" text-anchor="middle" fill="#065f46">GFAP, neurofilaments</text>
<rect x="580" y="45" width="260" height="165" rx="10" fill="#fce7f3" stroke="#a21caf" stroke-width="1.5"/>
<text x="710" y="70" font-size="12.5" font-weight="700" text-anchor="middle" fill="#701a75">Microtubules</text>
<text x="710" y="92" font-size="10.5" text-anchor="middle" fill="#1f2937">Movement and cell division</text>
<text x="710" y="132" font-size="9.8" font-weight="700" text-anchor="middle" fill="#701a75">Cilia, flagella</text>
<text x="710" y="150" font-size="9.8" font-weight="700" text-anchor="middle" fill="#701a75">Mitotic spindle, axonal transport</text>
<text x="710" y="168" font-size="9.8" font-weight="700" text-anchor="middle" fill="#701a75">Centrioles</text>
</svg>
