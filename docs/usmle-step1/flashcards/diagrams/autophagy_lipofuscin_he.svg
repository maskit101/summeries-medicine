<svg class="diagram" viewBox="0 0 860 290" xmlns="http://www.w3.org/2000/svg">
<title>אוטופאגיה ומקור פיגמנט הליפופוסצין</title>
<text x="430.0" y="20" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937" >שלבי האוטופאגיה</text>
<rect x="20" y="46" width="145" height="90" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
<text x="92.5" y="84" font-size="9.8" font-weight="700" text-anchor="middle" fill="#1f2937" >אברון פגום/מיותר</text>
<text x="92.5" y="102" font-size="9.8" font-weight="700" text-anchor="middle" fill="#1f2937" >(מיטוכונדריה ישנה)</text>
<line x1="165" y1="91" x2="167" y2="91" stroke="#4b5563" stroke-width="2.5"/><polygon points="165,84 165,98 177,91" fill="#4b5563"/>
<rect x="177" y="46" width="145" height="90" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="249.5" y="84" font-size="9.8" font-weight="700" text-anchor="middle" fill="#1e3a8a" >ואקואולה אוטופגית</text>
<text x="249.5" y="102" font-size="9.8" font-weight="700" text-anchor="middle" fill="#1e3a8a" >בולעת את האברון</text>
<line x1="322" y1="91" x2="324" y2="91" stroke="#4b5563" stroke-width="2.5"/><polygon points="322,84 322,98 334,91" fill="#4b5563"/>
<rect x="334" y="46" width="145" height="90" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
<text x="406.5" y="84" font-size="9.8" font-weight="700" text-anchor="middle" fill="#065f46" >מיזוג עם ליזוזום</text>
<text x="406.5" y="102" font-size="9.8" font-weight="700" text-anchor="middle" fill="#065f46" >(אוטופגוליזוזום)</text>
<line x1="479" y1="91" x2="481" y2="91" stroke="#4b5563" stroke-width="2.5"/><polygon points="479,84 479,98 491,91" fill="#4b5563"/>
<rect x="491" y="46" width="145" height="90" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="563.5" y="84" font-size="9.8" font-weight="700" text-anchor="middle" fill="#92400e" >עיכול אנזימטי</text>
<text x="563.5" y="102" font-size="9.8" font-weight="700" text-anchor="middle" fill="#92400e" >של התוכן</text>
<line x1="636" y1="91" x2="638" y2="91" stroke="#4b5563" stroke-width="2.5"/><polygon points="636,84 636,98 648,91" fill="#4b5563"/>
<rect x="648" y="46" width="145" height="90" rx="8" fill="#fce7f3" stroke="#a21caf" stroke-width="1.5"/>
<text x="720.5" y="84" font-size="9.8" font-weight="700" text-anchor="middle" fill="#701a75" >שארית בלתי-מתעכלת</text>
<text x="720.5" y="102" font-size="9.8" font-weight="700" text-anchor="middle" fill="#701a75" >= ליפופוסצין</text>
<rect x="20" y="166" width="820" height="50" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.3"/>
<text x="430.0" y="186" font-size="11" font-weight="700" text-anchor="middle" fill="#1f2937" >ליפופוסצין = "פיגמנט ההזדקנות" — גרגירים חום-צהובים המצטברים בציטופלזמה</text>
<text x="430.0" y="204" font-size="9.8" font-weight="400" text-anchor="middle" fill="#4b5563" >בולט במיוחד בתאים ארוכי-חיים שלא מתחלקים: נוירונים, שריר לב</text>
<rect x="20" y="246" width="820" height="34" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
<text x="430.0" y="268" font-size="10" font-weight="700" text-anchor="middle" fill="#92400e" >מה "זז": האברון הפגום עצמו נבלע ונע לתוך ואקואולה שמתמזגת עם ליזוזום — מה שנשאר אחרי העיכול הוא הפיגמנט</text>
</svg>