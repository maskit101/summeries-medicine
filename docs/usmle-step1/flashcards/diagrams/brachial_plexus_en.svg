<svg class="diagram" viewBox="0 0 1000 660" xmlns="http://www.w3.org/2000/svg" direction="ltr">
<title>Brachial plexus — hierarchy from roots to branches</title>
<text x="500" y="26" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2937">Brachial plexus — five levels: Roots → Trunks → Divisions → Cords → Branches</text>

<text x="500" y="65" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1e3a8a">Roots</text>
<g>
<rect x="95" y="80" width="150" height="45" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="170" y="107" font-size="12" font-weight="700" text-anchor="middle" fill="#1e3a8a">C5</text>
<rect x="260" y="80" width="150" height="45" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="335" y="107" font-size="12" font-weight="700" text-anchor="middle" fill="#1e3a8a">C6</text>
<rect x="425" y="80" width="150" height="45" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="500" y="107" font-size="12" font-weight="700" text-anchor="middle" fill="#1e3a8a">C7</text>
<rect x="590" y="80" width="150" height="45" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="665" y="107" font-size="12" font-weight="700" text-anchor="middle" fill="#1e3a8a">C8</text>
<rect x="755" y="80" width="150" height="45" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="830" y="107" font-size="12" font-weight="700" text-anchor="middle" fill="#1e3a8a">T1</text>
</g>

<text x="500" y="150" font-size="11.5" font-weight="700" text-anchor="middle" fill="#92400e">Trunks</text>
<g>
<rect x="90" y="165" width="260" height="45" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="220" y="192" font-size="12" font-weight="700" text-anchor="middle" fill="#92400e">Upper (C5-C6)</text>
<rect x="370" y="165" width="260" height="45" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="500" y="192" font-size="12" font-weight="700" text-anchor="middle" fill="#92400e">Middle (C7)</text>
<rect x="650" y="165" width="260" height="45" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="780" y="192" font-size="12" font-weight="700" text-anchor="middle" fill="#92400e">Lower (C8-T1)</text>
</g>

<text x="500" y="235" font-size="11.5" font-weight="700" text-anchor="middle" fill="#7f1d1d">Divisions</text>
<g>
<rect x="30" y="250" width="460" height="45" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="260" y="277" font-size="12" font-weight="700" text-anchor="middle" fill="#7f1d1d">Anterior divisions (×3)</text>
<rect x="510" y="250" width="460" height="45" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="740" y="277" font-size="12" font-weight="700" text-anchor="middle" fill="#7f1d1d">Posterior divisions (×3)</text>
</g>

<text x="500" y="320" font-size="11.5" font-weight="700" text-anchor="middle" fill="#065f46">Cords</text>
<g>
<rect x="90" y="335" width="260" height="45" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
<text x="220" y="362" font-size="12" font-weight="700" text-anchor="middle" fill="#065f46">Lateral</text>
<rect x="370" y="335" width="260" height="45" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
<text x="500" y="362" font-size="12" font-weight="700" text-anchor="middle" fill="#065f46">Posterior</text>
<rect x="650" y="335" width="260" height="45" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
<text x="780" y="362" font-size="12" font-weight="700" text-anchor="middle" fill="#065f46">Medial</text>
</g>

<text x="500" y="405" font-size="11.5" font-weight="700" text-anchor="middle" fill="#4c1d95">Branches (5 terminal nerves)</text>
<g>
<rect x="95" y="420" width="150" height="45" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
<text x="170" y="443" font-size="10" font-weight="700" text-anchor="middle" fill="#4c1d95">Musculo-</text>
<text x="170" y="456" font-size="10" font-weight="700" text-anchor="middle" fill="#4c1d95">cutaneous</text>
<rect x="260" y="420" width="150" height="45" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
<text x="335" y="447" font-size="11" font-weight="700" text-anchor="middle" fill="#4c1d95">Axillary</text>
<rect x="425" y="420" width="150" height="45" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
<text x="500" y="447" font-size="11" font-weight="700" text-anchor="middle" fill="#4c1d95">Radial</text>
<rect x="590" y="420" width="150" height="45" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
<text x="665" y="447" font-size="11" font-weight="700" text-anchor="middle" fill="#4c1d95">Median</text>
<rect x="755" y="420" width="150" height="45" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
<text x="830" y="447" font-size="11" font-weight="700" text-anchor="middle" fill="#4c1d95">Ulnar</text>
</g>

<rect x="20" y="485" width="960" height="55" rx="8" fill="#f8fafc" stroke="#9ca3af" stroke-width="1"/>
<text x="500" y="507" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1f2937">The long thoracic nerve arises directly from the roots (C5-C7) — bypasses trunks/cords; innervates serratus anterior</text>
<text x="500" y="525" font-size="9.5" text-anchor="middle" fill="#1f2937">Roots + subclavian artery pass between anterior and middle scalene muscles; subclavian vein passes anteromedial to the scalene triangle</text>

<rect x="20" y="555" width="960" height="85" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
<text x="500" y="580" font-size="12.5" font-weight="700" text-anchor="middle" fill="#065f46">Mnemonic: "Remember To Drink Cold Beer"</text>
<text x="500" y="602" font-size="10.5" text-anchor="middle" fill="#065f46">Remember=Roots ← To=Trunks ← Drink=Divisions ← Cold=Cords ← Beer=Branches</text>
<text x="500" y="622" font-size="9.5" text-anchor="middle" fill="#065f46">The five words map exactly to the five levels, in order from roots to terminal branches</text>
</svg>
