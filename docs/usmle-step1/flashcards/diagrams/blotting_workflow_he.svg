<svg class="diagram" viewBox="0 0 860 300" xmlns="http://www.w3.org/2000/svg">
<title>שלבי הבלוטינג: אלקטרופורזה, העברה, גשש/נוגדן, זיהוי</title>
<text x="430" y="24" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1f2937">ארבעת שלבי הבלוטינג (Southern/Northern/Western)</text>
<rect x="20" y="55" width="195" height="110" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="117" y="78" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1e3a8a">1. אלקטרופורזת ג'ל</text>
<text x="117" y="98" font-size="9.8" text-anchor="middle" fill="#1f2937">הדגימה (DNA/RNA/חלבון)</text>
<text x="117" y="114" font-size="9.8" text-anchor="middle" fill="#1f2937">מופרדת לפי גודל</text>
<text x="117" y="130" font-size="9.8" text-anchor="middle" fill="#1f2937">בשדה חשמלי</text>
<text x="117" y="150" font-size="9" font-weight="700" text-anchor="middle" fill="#1e3a8a">(חתיכות DNA / RNA שלם / חלבון מפורק)</text>
<polygon points="220,102 248,95 248,109" fill="#4b5563"/>
<rect x="253" y="55" width="195" height="110" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="350" y="78" font-size="11.5" font-weight="700" text-anchor="middle" fill="#92400e">2. העברה (Transfer)</text>
<text x="350" y="98" font-size="9.8" text-anchor="middle" fill="#1f2937">הדגימה המופרדת</text>
<text x="350" y="114" font-size="9.8" text-anchor="middle" fill="#1f2937">"מוטבעת" מהג'ל</text>
<text x="350" y="130" font-size="9.8" text-anchor="middle" fill="#1f2937">לממברנה מוצקה</text>
<polygon points="453,102 481,95 481,109" fill="#4b5563"/>
<rect x="486" y="55" width="195" height="110" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
<text x="583" y="78" font-size="11.5" font-weight="700" text-anchor="middle" fill="#4c1d95">3. גשש / נוגדן מסומן</text>
<text x="583" y="98" font-size="9.8" text-anchor="middle" fill="#1f2937">Southern/Northern: גשש</text>
<text x="583" y="114" font-size="9.8" text-anchor="middle" fill="#1f2937">DNA משלים ומסומן</text>
<text x="583" y="130" font-size="9.8" text-anchor="middle" fill="#1f2937">Western: נוגדן ספציפי לחלבון</text>
<polygon points="686,102 714,95 714,109" fill="#4b5563"/>
<rect x="719" y="55" width="120" height="110" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
<text x="779" y="78" font-size="11.5" font-weight="700" text-anchor="middle" fill="#065f46">4. זיהוי</text>
<text x="779" y="98" font-size="9.5" text-anchor="middle" fill="#1f2937">אות מוצג</text>
<text x="779" y="114" font-size="9.5" text-anchor="middle" fill="#1f2937">על פילם /</text>
<text x="779" y="130" font-size="9.5" text-anchor="middle" fill="#1f2937">דימות דיגיטלי</text>
<rect x="20" y="185" width="820" height="100" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
<text x="430" y="208" font-size="12" font-weight="700" text-anchor="middle" fill="#1f2937">מנמוניקה: SNoW DRoP</text>
<text x="150" y="232" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1e3a8a">Southern = DNA</text>
<text x="150" y="248" font-size="9.5" text-anchor="middle" fill="#1f2937">היפוזיגוטיות, חזרות CGG ב-FMR1 (X שביר)</text>
<text x="430" y="232" font-size="10.5" font-weight="700" text-anchor="middle" fill="#065f46">Northern = RNA</text>
<text x="430" y="248" font-size="9.5" text-anchor="middle" fill="#1f2937">רמת ביטוי mRNA, שגיאות שחבור</text>
<text x="705" y="232" font-size="10.5" font-weight="700" text-anchor="middle" fill="#7f1d1d">Western = Protein</text>
<text x="705" y="248" font-size="9.5" text-anchor="middle" fill="#1f2937">זיהוי וכימות חלבון ספציפי</text>
<text x="430" y="270" font-size="9.5" text-anchor="middle" fill="#374151">Southwestern = חלבון "נבדק" ע"י dsDNA מסומן — מזהה חלבונים קושרי-DNA (גורמי תעתוק)</text>
</svg>
