<svg class="diagram" viewBox="0 0 860 370" xmlns="http://www.w3.org/2000/svg">
<title>בעיית קצה השכפול ומנגנון הטלומראז</title>
<text x="430.0" y="20" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1f2937" >הבעיה: גדיל מפגר לא יכול להשלים את קצה הכרומוזום</text>
<rect x="40" y="44" width="780" height="50" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.3"/>
<text x="430.0" y="64" font-size="10.6" font-weight="400" text-anchor="middle" fill="#1f2937" >לאחר הסרת פריימר ה-RNA האחרון בגדיל המפגר, אין 3'-OH במעלה ליצירת פריימר חדש</text>
<text x="430.0" y="82" font-size="10.3" font-weight="700" text-anchor="middle" fill="#7f1d1d" >→ כל חלוקת תא מקצרת את קצה הכרומוזום ב-50-100bp</text>
<line x1="20" y1="110" x2="840" y2="110" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="430.0" y="124" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1f2937" >הפתרון: טלומראז — reverse transcriptase עם תבנית RNA משלו</text>
<line x1="60" y1="170" x2="400" y2="170" stroke="#2563eb" stroke-width="4"/>
<text x="410" y="174" font-size="11" font-weight="700" text-anchor="start" fill="#1e3a8a" >3'</text>
<text x="150" y="158" font-size="9.6" font-weight="400" text-anchor="middle" fill="#1e3a8a" >קצה כרומוזום (חד-גדילי, TTAGGG חוזר)</text>
<rect x="430" y="150" width="180" height="44" rx="8" fill="#fce7f3" stroke="#a21caf" stroke-width="1.5"/>
<text x="520" y="168" font-size="11.5" font-weight="700" text-anchor="middle" fill="#701a75" >טלומראז</text>
<text x="520" y="185" font-size="8.8" font-weight="400" text-anchor="middle" fill="#701a75" >נושא תבנית RNA (עם רצף AAUCCC)</text>
<line x1="520" y1="204" x2="520" y2="220" stroke="#4b5563" stroke-width="2.5"/><polygon points="513,218 527,218 520,230" fill="#4b5563"/>
<text x="650" y="216" font-size="10" font-weight="400" text-anchor="start" fill="#1f2937" >→ נקשר לקצה 3' ומשלים חזרות TTAGGG חדשות (reverse transcription)</text>
<line x1="60" y1="264" x2="480" y2="264" stroke="#2563eb" stroke-width="4"/>
<line x1="480" y1="264" x2="620" y2="264" stroke="#a21caf" stroke-width="4" stroke-dasharray="6,3"/>
<text x="550" y="252" font-size="9.6" font-weight="400" text-anchor="middle" fill="#701a75" >חזרות TTAGGG חדשות</text>
<text x="630" y="268" font-size="11" font-weight="700" text-anchor="start" fill="#701a75" >3'</text>
<text x="430.0" y="284" font-size="10.3" font-weight="400" text-anchor="middle" fill="#1f2937" >כעת יש מקום ל-primase/פולימראז להשלים את הגדיל המפגר בלי לאבד רצף מקודד</text>
<rect x="40" y="314" width="780" height="44" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.3"/>
<text x="430.0" y="332" font-size="10.3" font-weight="700" text-anchor="middle" fill="#92400e" >פעילות גבוהה: תאי גזע, תאי נבט, ורוב (~90%) גידולים סרטניים ← אלמותיות תאית</text>
<text x="430.0" y="348" font-size="9.6" font-weight="400" text-anchor="middle" fill="#92400e" >פעילות נמוכה בתאים סומטיים בוגרים ← קיצור טלומרים תורם להזדקנות/סנסנס</text>
</svg>