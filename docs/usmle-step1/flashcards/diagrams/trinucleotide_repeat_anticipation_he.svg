<svg class="diagram" viewBox="0 0 860 300" xmlns="http://www.w3.org/2000/svg" direction="ltr">
<title>הרחבת חזרות תלת-נוקלאוטידיות ואנטיסיפציה גנטית</title>
<text x="430" y="24" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1f2937">אנטיסיפציה: חזרות מתרחבות מדור לדור &#8592; הופעה מוקדמת יותר, חומרה גוברת</text>

<rect x="30" y="48" width="180" height="150" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
<text x="120" y="70" font-size="11.5" font-weight="700" text-anchor="middle" fill="#065f46">דור 1</text>
<rect x="55" y="82" width="130" height="24" fill="#fff" stroke="#047857"/>
<text x="120" y="99" font-size="9.5" text-anchor="middle" fill="#065f46">(CGG)&#8319;&#8309; תקין</text>
<text x="120" y="125" font-size="9.5" text-anchor="middle" fill="#1f2937">מעט חזרות</text>
<text x="120" y="143" font-size="10" font-weight="700" text-anchor="middle" fill="#065f46">בריא</text>
<text x="120" y="165" font-size="9" text-anchor="middle" fill="#4b5563">החזרות עלולות "להחליק"</text>
<text x="120" y="180" font-size="9" text-anchor="middle" fill="#4b5563">ולהתרחב בשכפול (בעיקר</text>
<text x="120" y="193" font-size="9" text-anchor="middle" fill="#4b5563">באוגנזה עבור FMR1)</text>

<polygon points="215,120 245,113 245,127" fill="#4b5563"/>

<rect x="255" y="48" width="180" height="150" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="345" y="70" font-size="11.5" font-weight="700" text-anchor="middle" fill="#92400e">דור 2</text>
<rect x="270" y="82" width="150" height="24" fill="#fff" stroke="#b45309"/>
<text x="345" y="99" font-size="9.5" text-anchor="middle" fill="#92400e">(CGG)&#8319;&#8309;&#8319;&#8309; פרה-מוטציה</text>
<text x="345" y="125" font-size="9.5" text-anchor="middle" fill="#1f2937">50&#8211;200 חזרות</text>
<text x="345" y="143" font-size="10" font-weight="700" text-anchor="middle" fill="#92400e">תסמינים קלים/מאוחרים</text>
<text x="345" y="165" font-size="9" text-anchor="middle" fill="#4b5563">למשל, פרה-מוטציית X שביר:</text>
<text x="345" y="180" font-size="9" text-anchor="middle" fill="#4b5563">רעד, אטקסיה, אי-ספיקה</text>
<text x="345" y="193" font-size="9" text-anchor="middle" fill="#4b5563">שחלתית</text>

<polygon points="440,120 470,113 470,127" fill="#4b5563"/>

<rect x="480" y="48" width="200" height="150" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="580" y="70" font-size="11.5" font-weight="700" text-anchor="middle" fill="#7f1d1d">דור 3</text>
<rect x="495" y="82" width="170" height="24" fill="#fff" stroke="#b91c1c"/>
<text x="580" y="99" font-size="9.5" text-anchor="middle" fill="#7f1d1d">(CGG)&gt;&#8322;&#8320;&#8320; מוטציה מלאה</text>
<text x="580" y="125" font-size="9.5" text-anchor="middle" fill="#1f2937">מעל 200 חזרות</text>
<text x="580" y="143" font-size="10" font-weight="700" text-anchor="middle" fill="#7f1d1d">מחלה מוקדמת וחמורה</text>
<text x="580" y="165" font-size="9" text-anchor="middle" fill="#4b5563">היפר-מתילציה &#8592; השתקת הגן</text>
<text x="580" y="180" font-size="9" text-anchor="middle" fill="#4b5563">&#8592; פיגור שכלי, מקרואורכידיזם,</text>
<text x="580" y="193" font-size="9" text-anchor="middle" fill="#4b5563">פנים מוארכות, אוזניים גדולות</text>

<rect x="700" y="48" width="130" height="150" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
<text x="765" y="70" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1f2937">חזרה / מחלה /</text>
<text x="765" y="84" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1f2937">תורשה</text>
<text x="765" y="104" font-size="8.5" text-anchor="middle" fill="#1f2937">הנטינגטון (CAG)n &#8212; AD</text>
<text x="765" y="122" font-size="8.5" text-anchor="middle" fill="#1f2937">דיסטרופיה מיוטונית</text>
<text x="765" y="135" font-size="8.5" text-anchor="middle" fill="#1f2937">(CTG)n &#8212; AD</text>
<text x="765" y="153" font-size="8.5" text-anchor="middle" fill="#1f2937">X שביר (CGG)n &#8212; XD</text>
<text x="765" y="171" font-size="8.5" text-anchor="middle" fill="#1f2937">אטקסיית פרידרייך</text>
<text x="765" y="184" font-size="8.5" text-anchor="middle" fill="#1f2937">(GAA)n &#8212; AR</text>

<rect x="30" y="215" width="800" height="65" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
<text x="430" y="238" font-size="11.5" font-weight="700" text-anchor="middle" fill="#4c1d95">אנטיסיפציה גנטית = חומרת המחלה &#8593; וגיל ההופעה &#8595; בדורות עוקבים</text>
<text x="430" y="257" font-size="10" text-anchor="middle" fill="#4c1d95">מנגנון: "החלקה" של DNA פולימראז בשכפול &#8592; רצף החזרות מתארך בכל העברה</text>
<text x="430" y="273" font-size="9" text-anchor="middle" fill="#4c1d95">מנמוניקה: "Caudate has &#8595;ACh and &#8595;GABA" (הנטינגטון) &#8226; "Chin, Giant Gonads" (X שביר) &#8226; "Ataxic GAAit" (פרידרייך)</text>
</svg>
