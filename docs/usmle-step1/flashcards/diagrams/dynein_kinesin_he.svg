<svg class="diagram" viewBox="0 0 860 230" xmlns="http://www.w3.org/2000/svg">
<title>דיניין מול קינזין: כיווני תנועה על המיקרוטובול</title>
<text x="430" y="24" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937">מוטורים מולקולריים על מסילת המיקרוטובול</text>
<text x="120" y="55" font-size="12" font-weight="700" text-anchor="middle" fill="#4b5563">קצה (−) — קרוב לגרעין</text>
<text x="740" y="55" font-size="12" font-weight="700" text-anchor="middle" fill="#4b5563">קצה (+) — לכיוון הפריפריה</text>
<line x1="60" y1="90" x2="800" y2="90" stroke="#94a3b8" stroke-width="6"/>
<rect x="200" y="105" width="130" height="40" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="265" y="130" font-size="12" font-weight="700" text-anchor="middle" fill="#1e3a8a">דיניין ←</text>
<text x="265" y="163" font-size="10.5" text-anchor="middle" fill="#1f2937">רטרוגרד (+→−)</text>
<text x="265" y="179" font-size="10" text-anchor="middle" fill="#1f2937">טטנוס, פוליו, כלבת, HSV</text>
<rect x="530" y="105" width="130" height="40" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
<text x="595" y="130" font-size="12" font-weight="700" text-anchor="middle" fill="#065f46">→ קינזין</text>
<text x="595" y="163" font-size="10.5" text-anchor="middle" fill="#1f2937">אנטרוגרד (−→+)</text>
<text x="595" y="179" font-size="10" text-anchor="middle" fill="#1f2937">הפעלה מחדש של HSV</text>
<rect x="30" y="200" width="800" height="26" rx="6" fill="#fffbeb" stroke="#fcd34d"/>
<text x="430" y="218" font-size="10.8" font-weight="700" text-anchor="middle" fill="#92400e">שתי המולקולות "צועדות" על טובולין תוך צריכת ATP וגרירת מטען (שלפוחיות/אברונים)</text>
</svg>
