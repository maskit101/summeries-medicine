<svg class="diagram" viewBox="0 0 860 240" xmlns="http://www.w3.org/2000/svg">
<title>שלושת מנגנוני התיקון החד-גדילי: NER, BER, MMR</title>
<text x="430.0" y="18" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1f2937" >איזה סוג פגם מתקן כל מנגנון, ואיך</text>
<rect x="15" y="38" width="260" height="190" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="145.0" y="63" font-size="14" font-weight="700" text-anchor="middle" fill="#1e3a8a" >NER</text>
<text x="145.0" y="85" font-size="11" font-weight="400" text-anchor="middle" fill="#1f2937" >פגם מעוות-סליל</text>
<text x="145.0" y="103" font-size="10.3" font-weight="400" text-anchor="middle" fill="#1f2937" >(דימר פירימידין, UV)</text>
<text x="145.0" y="130" font-size="9.8" font-weight="400" text-anchor="middle" fill="#1f2937" >חיתוך אוליגונוקלאוטיד שלם סביב הפגם</text>
<text x="145.0" y="155" font-size="10.6" font-weight="700" text-anchor="middle" fill="#1e3a8a" >פאזת G1</text>
<text x="145.0" y="205" font-size="10" font-weight="700" text-anchor="middle" fill="#b91c1c" >פגום: קסרודרמה פיגמנטוזה</text>
<rect x="290" y="38" width="260" height="190" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
<text x="420.0" y="63" font-size="14" font-weight="700" text-anchor="middle" fill="#065f46" >BER</text>
<text x="420.0" y="85" font-size="11" font-weight="400" text-anchor="middle" fill="#1f2937" >בסיס בודד פגום</text>
<text x="420.0" y="103" font-size="10.3" font-weight="400" text-anchor="middle" fill="#1f2937" >(דה-אמינציה, חמצון)</text>
<text x="420.0" y="130" font-size="9.8" font-weight="400" text-anchor="middle" fill="#1f2937" >גליקוזילאז→אנדונוקלאז/ליאז→פול' β→ליגאז</text>
<text x="420.0" y="155" font-size="10.6" font-weight="700" text-anchor="middle" fill="#065f46" >כל מחזור התא</text>
<text x="420.0" y="205" font-size="10" font-weight="700" text-anchor="middle" fill="#b91c1c" >"GEL Please"</text>
<rect x="565" y="38" width="260" height="190" rx="10" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
<text x="695.0" y="63" font-size="14" font-weight="700" text-anchor="middle" fill="#4c1d95" >MMR</text>
<text x="695.0" y="85" font-size="11" font-weight="400" text-anchor="middle" fill="#1f2937" >חוסר-התאמה שלאחר שכפול</text>
<text x="695.0" y="103" font-size="10.3" font-weight="400" text-anchor="middle" fill="#1f2937" >בגדיל החדש</text>
<text x="695.0" y="130" font-size="9.8" font-weight="400" text-anchor="middle" fill="#1f2937" >מסלקת נוקלאוטידים לא-מותאמים ומתקנת</text>
<text x="695.0" y="155" font-size="10.6" font-weight="700" text-anchor="middle" fill="#4c1d95" >פאזת S</text>
<text x="695.0" y="205" font-size="10" font-weight="700" text-anchor="middle" fill="#b91c1c" >פגום: תסמונת לינץ' (HNPCC)</text>
</svg>