<svg class="diagram" viewBox="0 0 860 400" xmlns="http://www.w3.org/2000/svg">
<title>CRISPR/Cas9 mechanism: recognition, cutting, and repair</title>
<text x="430" y="24" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1f2937">CRISPR/Cas9: from "gRNA + Cas9" to "Knock-out" or "Knock-in"</text>
<rect x="30" y="55" width="230" height="80" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
<text x="145" y="80" font-size="12" font-weight="700" text-anchor="middle" fill="#4c1d95">gRNA + Cas9</text>
<text x="145" y="98" font-size="10" text-anchor="middle" fill="#4c1d95">gRNA complementary to target</text>
<text x="145" y="114" font-size="10" text-anchor="middle" fill="#4c1d95">Cas9 = endonuclease</text>
<polygon points="265,90 295,83 295,97" fill="#4b5563"/>
<rect x="300" y="55" width="245" height="80" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="422" y="80" font-size="12" font-weight="700" text-anchor="middle" fill="#1e3a8a">Target DNA recognition</text>
<text x="422" y="98" font-size="10" text-anchor="middle" fill="#1f2937">gRNA binds the complementary</text>
<text x="422" y="114" font-size="10" text-anchor="middle" fill="#1f2937">genomic sequence</text>
<polygon points="550,90 580,83 580,97" fill="#4b5563"/>
<rect x="585" y="55" width="245" height="80" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="707" y="80" font-size="12" font-weight="700" text-anchor="middle" fill="#7f1d1d">Cas9 cuts</text>
<text x="707" y="98" font-size="10" text-anchor="middle" fill="#7f1d1d">Single- or double-strand break</text>
<text x="707" y="114" font-size="10" text-anchor="middle" fill="#7f1d1d">at the target site (DSB)</text>
<path d="M 430 135 L 430 165" stroke="#4b5563" stroke-width="2.5" marker-end="url(#arrCr1En)"/>
<defs><marker id="arrCr1En" markerWidth="10" markerHeight="10" refX="5" refY="8" orient="auto"><polygon points="0,0 5,9 10,0" fill="#4b5563"/></marker></defs>
<rect x="255" y="170" width="350" height="55" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="430" y="193" font-size="12" font-weight="700" text-anchor="middle" fill="#92400e">Repair of the break — two possible pathways</text>
<text x="430" y="211" font-size="10" text-anchor="middle" fill="#92400e">Cell "chooses" based on donor DNA availability</text>
<path d="M 350 225 C 300 245, 220 250, 190 260" fill="none" stroke="#4b5563" stroke-width="2" marker-end="url(#arrCr2En)"/>
<path d="M 510 225 C 560 245, 640 250, 670 260" fill="none" stroke="#4b5563" stroke-width="2" marker-end="url(#arrCr2En)"/>
<defs><marker id="arrCr2En" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#4b5563"/></marker></defs>
<rect x="45" y="265" width="330" height="120" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="210" y="288" font-size="12" font-weight="700" text-anchor="middle" fill="#7f1d1d">NHEJ (no donor template)</text>
<text x="210" y="306" font-size="10" text-anchor="middle" fill="#7f1d1d">"Sloppy" end-joining → errors</text>
<text x="210" y="322" font-size="10" text-anchor="middle" fill="#7f1d1d">Frameshift / gene inactivation</text>
<text x="210" y="341" font-size="11" font-weight="700" text-anchor="middle" fill="#7f1d1d">= "Knock-out"</text>
<text x="210" y="362" font-size="9.5" text-anchor="middle" fill="#7f1d1d">e.g. removing virulence</text>
<text x="210" y="377" font-size="9.5" text-anchor="middle" fill="#7f1d1d">factors from pathogens; targeting tumor cells</text>
<rect x="485" y="265" width="330" height="120" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
<text x="650" y="288" font-size="12" font-weight="700" text-anchor="middle" fill="#065f46">HDR (with donor DNA)</text>
<text x="650" y="306" font-size="10" text-anchor="middle" fill="#065f46">Precise repair via homologous template</text>
<text x="650" y="322" font-size="10" text-anchor="middle" fill="#065f46">Insertion/editing of desired sequence</text>
<text x="650" y="341" font-size="11" font-weight="700" text-anchor="middle" fill="#065f46">= "Knock-in"</text>
<text x="650" y="362" font-size="9.5" text-anchor="middle" fill="#065f46">e.g. correcting the sickle</text>
<text x="650" y="377" font-size="9.5" text-anchor="middle" fill="#065f46">cell disease allele</text>
</svg>
