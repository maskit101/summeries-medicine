<svg class="diagram" viewBox="0 0 860 380" xmlns="http://www.w3.org/2000/svg">
<title>Apoptosis: intrinsic, extrinsic, and perforin/granzyme B pathways</title>
<text x="430" y="24" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1f2937">Three activation routes converge on executioner caspases</text>

<rect x="20" y="50" width="260" height="140" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="150" y="72" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1e3a8a">Intrinsic (mitochondrial)</text>
<text x="150" y="92" font-size="10" text-anchor="middle" fill="#1f2937">DNA damage, ROS, toxins,</text>
<text x="150" y="106" font-size="10" text-anchor="middle" fill="#1f2937">hypoxia, growth-factor withdrawal</text>
<text x="150" y="126" font-size="10.5" text-anchor="middle" fill="#1f2937">p53 activation → Bax/Bak ↑</text>
<text x="150" y="144" font-size="10.5" text-anchor="middle" fill="#1f2937">(Bcl-2/Bcl-xL normally block this)</text>
<text x="150" y="164" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1e3a8a">Bax/Bak pore → cytochrome c release</text>

<rect x="300" y="50" width="260" height="140" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="430" y="72" font-size="12.5" font-weight="700" text-anchor="middle" fill="#7f1d1d">Extrinsic (death receptor)</text>
<text x="430" y="92" font-size="10" text-anchor="middle" fill="#1f2937">FasL binds Fas (CD95)</text>
<text x="430" y="108" font-size="10" text-anchor="middle" fill="#1f2937">TNF-α binds TNFR</text>
<text x="430" y="130" font-size="10" text-anchor="middle" fill="#1f2937">Fas-FasL: thymic negative selection</text>
<text x="430" y="148" font-size="10" text-anchor="middle" fill="#1f2937">Defective Fas-FasL → ALPS</text>
<text x="430" y="166" font-size="10" text-anchor="middle" fill="#1f2937">(autoimmune lymphoproliferative synd.)</text>

<rect x="580" y="50" width="260" height="140" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
<text x="710" y="72" font-size="12.5" font-weight="700" text-anchor="middle" fill="#4c1d95">Perforin / granzyme B</text>
<text x="710" y="92" font-size="10" text-anchor="middle" fill="#1f2937">Cytotoxic T cell / NK cell</text>
<text x="710" y="112" font-size="10" text-anchor="middle" fill="#1f2937">releases granule contents</text>
<text x="710" y="132" font-size="10" text-anchor="middle" fill="#1f2937">Perforin forms a pore in target</text>
<text x="710" y="150" font-size="10" text-anchor="middle" fill="#1f2937">membrane → granzyme B enters</text>
<text x="710" y="168" font-size="10" text-anchor="middle" fill="#1f2937">→ directly activates caspases</text>

<polygon points="150,190 150,210 145,200" fill="#4b5563"/>
<polygon points="430,190 430,210 425,200" fill="#4b5563"/>
<polygon points="710,190 710,210 705,200" fill="#4b5563"/>
<path d="M150,210 L430,240" stroke="#4b5563" stroke-width="2" fill="none"/>
<path d="M710,210 L430,240" stroke="#4b5563" stroke-width="2" fill="none"/>
<path d="M430,210 L430,240" stroke="#4b5563" stroke-width="2" fill="none"/>

<rect x="300" y="245" width="260" height="55" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="430" y="268" font-size="12" font-weight="700" text-anchor="middle" fill="#92400e">Executioner caspases activated</text>
<text x="430" y="286" font-size="10" text-anchor="middle" fill="#92400e">(cytosolic proteases)</text>

<polygon points="430,300 430,320 425,310" fill="#4b5563"/>

<rect x="230" y="325" width="400" height="45" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
<text x="430" y="352" font-size="11.5" font-weight="700" text-anchor="middle" fill="#065f46">Cell shrinkage, chromatin condensation, membrane blebbing → apoptotic bodies → phagocytosed (no inflammation)</text>
</svg>
