<svg class="diagram" viewBox="0 0 860 300" xmlns="http://www.w3.org/2000/svg">
<title>Blotting steps: electrophoresis, transfer, probe/antibody, detection</title>
<text x="430" y="24" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1f2937">The four steps of blotting (Southern/Northern/Western)</text>
<rect x="20" y="55" width="195" height="110" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="117" y="78" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1e3a8a">1. Gel electrophoresis</text>
<text x="117" y="98" font-size="9.8" text-anchor="middle" fill="#1f2937">Sample (DNA/RNA/protein)</text>
<text x="117" y="114" font-size="9.8" text-anchor="middle" fill="#1f2937">separated by size</text>
<text x="117" y="130" font-size="9.8" text-anchor="middle" fill="#1f2937">in an electric field</text>
<text x="117" y="150" font-size="9" font-weight="700" text-anchor="middle" fill="#1e3a8a">(cleaved DNA / whole RNA / digested protein)</text>
<polygon points="220,102 248,95 248,109" fill="#4b5563"/>
<rect x="253" y="55" width="195" height="110" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="350" y="78" font-size="11.5" font-weight="700" text-anchor="middle" fill="#92400e">2. Transfer</text>
<text x="350" y="98" font-size="9.8" text-anchor="middle" fill="#1f2937">Separated sample</text>
<text x="350" y="114" font-size="9.8" text-anchor="middle" fill="#1f2937">is blotted from gel</text>
<text x="350" y="130" font-size="9.8" text-anchor="middle" fill="#1f2937">onto a solid membrane</text>
<polygon points="453,102 481,95 481,109" fill="#4b5563"/>
<rect x="486" y="55" width="195" height="110" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
<text x="583" y="78" font-size="11.5" font-weight="700" text-anchor="middle" fill="#4c1d95">3. Labeled probe/antibody</text>
<text x="583" y="98" font-size="9.8" text-anchor="middle" fill="#1f2937">Southern/Northern: labeled</text>
<text x="583" y="114" font-size="9.8" text-anchor="middle" fill="#1f2937">complementary DNA probe</text>
<text x="583" y="130" font-size="9.8" text-anchor="middle" fill="#1f2937">Western: protein-specific antibody</text>
<polygon points="686,102 714,95 714,109" fill="#4b5563"/>
<rect x="719" y="55" width="120" height="110" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
<text x="779" y="78" font-size="11.5" font-weight="700" text-anchor="middle" fill="#065f46">4. Detection</text>
<text x="779" y="98" font-size="9.5" text-anchor="middle" fill="#1f2937">Signal shown</text>
<text x="779" y="114" font-size="9.5" text-anchor="middle" fill="#1f2937">on film /</text>
<text x="779" y="130" font-size="9.5" text-anchor="middle" fill="#1f2937">digital imager</text>
<rect x="20" y="185" width="820" height="100" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
<text x="430" y="208" font-size="12" font-weight="700" text-anchor="middle" fill="#1f2937">Mnemonic: SNoW DRoP</text>
<text x="150" y="232" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1e3a8a">Southern = DNA</text>
<text x="150" y="248" font-size="9.5" text-anchor="middle" fill="#1f2937">heterozygosity, FMR1 CGG repeats (fragile X)</text>
<text x="430" y="232" font-size="10.5" font-weight="700" text-anchor="middle" fill="#065f46">Northern = RNA</text>
<text x="430" y="248" font-size="9.5" text-anchor="middle" fill="#1f2937">mRNA expression level, splicing errors</text>
<text x="705" y="232" font-size="10.5" font-weight="700" text-anchor="middle" fill="#7f1d1d">Western = Protein</text>
<text x="705" y="248" font-size="9.5" text-anchor="middle" fill="#1f2937">identifies and quantifies a specific protein</text>
<text x="430" y="270" font-size="9.5" text-anchor="middle" fill="#374151">Southwestern = protein "probed" with labeled dsDNA — detects DNA-binding proteins (transcription factors)</text>
</svg>
