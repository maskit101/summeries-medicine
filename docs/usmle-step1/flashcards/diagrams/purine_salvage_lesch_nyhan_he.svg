<svg class="diagram" viewBox="0 0 860 402" xmlns="http://www.w3.org/2000/svg">
<title>מסלול ההצלה של פורינים ומחסור ב-HGPRT (לש-ניהאן)</title>
<text x="430.0" y="20" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937" >תקין: מסלול ההצלה (Salvage pathway)</text>
<rect x="40" y="44" width="220" height="46" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.3"/>
<text x="150" y="64" font-size="10.6" font-weight="700" text-anchor="middle" fill="#1f2937" >היפוקסנתין / גואנין</text>
<text x="150" y="80" font-size="9" font-weight="400" text-anchor="middle" fill="#4b5563" >(מפירוק בסיסים ישן)</text>
<line x1="270" y1="67" x2="370" y2="67" stroke="#4b5563" stroke-width="2.5"/><polygon points="368,60 368,74 380,67" fill="#4b5563"/>
<text x="325" y="57" font-size="10.5" font-weight="700" text-anchor="middle" fill="#047857" >HGPRT</text>
<text x="325" y="85" font-size="9" font-weight="400" text-anchor="middle" fill="#4b5563" >+PRPP</text>
<rect x="390" y="44" width="220" height="46" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.3"/>
<text x="500" y="64" font-size="11.5" font-weight="700" text-anchor="middle" fill="#065f46" >IMP / GMP</text>
<text x="500" y="80" font-size="9" font-weight="400" text-anchor="middle" fill="#065f46" >ממוחזר לבניית נוקלאוטידים חדשים</text>
<line x1="620" y1="67" x2="720" y2="67" stroke="#4b5563" stroke-width="2.5"/><polygon points="718,60 718,74 730,67" fill="#4b5563"/>
<rect x="730" y="44" width="100" height="46" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/>
<text x="780" y="72" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1e3a8a" >DNA/RNA</text>
<line x1="20" y1="110" x2="840" y2="110" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="430.0" y="130" font-size="13" font-weight="700" text-anchor="middle" fill="#7f1d1d" >במחסור ב-HGPRT (תסמונת לש-ניהאן, קשור X)</text>
<rect x="40" y="154" width="220" height="46" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.3"/>
<text x="150" y="174" font-size="10.6" font-weight="700" text-anchor="middle" fill="#1f2937" >היפוקסנתין / גואנין</text>
<text x="150" y="190" font-size="9" font-weight="400" text-anchor="middle" fill="#7f1d1d" >מצטברים - לא ממוחזרים</text>
<line x1="270" y1="177" x2="350" y2="177" stroke="#9ca3af" stroke-width="3"/>
<line x1="345" y1="164" x2="365" y2="190" stroke="#b91c1c" stroke-width="3"/>
<line x1="365" y1="164" x2="345" y2="190" stroke="#b91c1c" stroke-width="3"/>
<text x="355" y="150" font-size="10" font-weight="700" text-anchor="middle" fill="#b91c1c" >✗ HGPRT חסר</text>
<line x1="150" y1="200" x2="150" y2="224" stroke="#4b5563" stroke-width="2.5"/><polygon points="143,222 157,222 150,234" fill="#4b5563"/>
<text x="150" y="246" font-size="9.5" font-weight="700" text-anchor="middle" fill="#92400e" >PRPP עודף מוזרם</text>
<text x="150" y="260" font-size="9" font-weight="400" text-anchor="middle" fill="#4b5563" >לסינתזה דה-נובו מוגברת</text>
<text x="430" y="170" font-size="10" font-weight="400" text-anchor="middle" fill="#4b5563" >↓ (מסלול פירוק חלופי)</text>
<line x1="150" y1="266" x2="150" y2="284" stroke="#4b5563" stroke-width="2.5"/><polygon points="143,282 157,282 150,294" fill="#4b5563"/>
<rect x="70" y="294" width="200" height="40" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="1.3"/>
<text x="170" y="312" font-size="10.5" font-weight="700" text-anchor="middle" fill="#92400e" >קסנטין אוקסידאז</text>
<text x="170" y="328" font-size="8.6" font-weight="400" text-anchor="middle" fill="#92400e" >(מעוכב ע"י אלופורינול)</text>
<line x1="280" y1="314" x2="390" y2="314" stroke="#4b5563" stroke-width="2.5"/><polygon points="388,307 388,321 400,314" fill="#4b5563"/>
<rect x="400" y="294" width="200" height="40" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.3"/>
<text x="500" y="312" font-size="10.8" font-weight="700" text-anchor="middle" fill="#7f1d1d" >חומצת שתן עודפת</text>
<text x="500" y="328" font-size="8.6" font-weight="400" text-anchor="middle" fill="#7f1d1d" >גבישים אדומים-כתומים בשתן, גאוט</text>
<line x1="610" y1="314" x2="690" y2="314" stroke="#4b5563" stroke-width="2.5"/><polygon points="688,307 688,321 700,314" fill="#4b5563"/>
<rect x="700" y="294" width="130" height="40" rx="6" fill="#fce7f3" stroke="#a21caf" stroke-width="1.3"/>
<text x="765" y="312" font-size="9.3" font-weight="700" text-anchor="middle" fill="#701a75" >נשיכה עצמית,</text>
<text x="765" y="328" font-size="9.3" font-weight="400" text-anchor="middle" fill="#701a75" >דיסטוניה, פיגור</text>
<rect x="20" y="358" width="820" height="34" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
<text x="430.0" y="380" font-size="10.2" font-weight="700" text-anchor="middle" fill="#92400e" >מה "זז": בלי HGPRT, בסיסי פורין לא חוזרים למאגר הנוקלאוטידים — הם "נשפכים" למסלול הפירוק ומצטברים כחומצת שתן</text>
</svg>