<svg class="diagram" viewBox="0 0 860 380" xmlns="http://www.w3.org/2000/svg" direction="ltr">
<title>CFTR &#916;F508 mechanism: from misfolded protein to thick mucus</title>
<text x="430" y="24" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1f2937">Cystic fibrosis: how a single deleted amino acid (Phe508) causes thick secretions</text>

<rect x="30" y="48" width="380" height="130" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
<text x="220" y="70" font-size="12" font-weight="700" text-anchor="middle" fill="#065f46">Normal CFTR</text>
<rect x="60" y="82" width="90" height="34" rx="6" fill="#fff" stroke="#047857"/>
<text x="105" y="103" font-size="9.5" text-anchor="middle" fill="#065f46">correct folding</text>
<polygon points="155,99 180,92 180,106" fill="#4b5563"/>
<rect x="185" y="82" width="90" height="34" rx="6" fill="#fff" stroke="#047857"/>
<text x="230" y="103" font-size="9.5" text-anchor="middle" fill="#065f46">ER &#8594; Golgi &#8594; membrane</text>
<polygon points="280,99 305,92 305,106" fill="#4b5563"/>
<rect x="310" y="82" width="90" height="34" rx="6" fill="#fff" stroke="#047857"/>
<text x="355" y="98" font-size="9" text-anchor="middle" fill="#065f46">Cl&#8315; channel</text>
<text x="355" y="111" font-size="9" text-anchor="middle" fill="#065f46">at cell surface</text>
<text x="220" y="140" font-size="10" text-anchor="middle" fill="#065f46">Cl&#8315; secreted (lung/GI); Cl&#8315; reabsorbed (sweat gland)</text>
<text x="220" y="158" font-size="10" text-anchor="middle" fill="#065f46">H&#8322;O follows Cl&#8315; &#8594; normal, thin mucus</text>

<rect x="450" y="48" width="380" height="130" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="640" y="70" font-size="12" font-weight="700" text-anchor="middle" fill="#7f1d1d">&#916;F508 mutant CFTR</text>
<rect x="480" y="82" width="90" height="34" rx="6" fill="#fff" stroke="#b91c1c"/>
<text x="525" y="98" font-size="9" text-anchor="middle" fill="#7f1d1d">Phe508 deleted</text>
<text x="525" y="111" font-size="9" text-anchor="middle" fill="#7f1d1d">&#8594; misfolded</text>
<polygon points="575,99 600,92 600,106" fill="#4b5563"/>
<rect x="605" y="82" width="90" height="34" rx="6" fill="#fff" stroke="#b91c1c"/>
<text x="650" y="98" font-size="9" text-anchor="middle" fill="#7f1d1d">stuck in ER &#8594;</text>
<text x="650" y="111" font-size="9" text-anchor="middle" fill="#7f1d1d">degraded</text>
<polygon points="700,99 725,92 725,106" fill="#4b5563"/>
<rect x="730" y="82" width="90" height="34" rx="6" fill="#fff" stroke="#b91c1c"/>
<text x="775" y="98" font-size="9" text-anchor="middle" fill="#7f1d1d">absent from</text>
<text x="775" y="111" font-size="9" text-anchor="middle" fill="#7f1d1d">cell membrane</text>
<text x="640" y="140" font-size="10" font-weight="700" text-anchor="middle" fill="#7f1d1d">&#8595;Cl&#8315; (and H&#8322;O, HCO&#8323;&#8315;) secretion</text>
<text x="640" y="158" font-size="10" text-anchor="middle" fill="#7f1d1d">compensatory &#8593;Na&#8314; reabsorption via ENaC</text>

<path d="M 430 178 L 430 205" stroke="#4b5563" stroke-width="2.5" marker-end="url(#cftrArrEn)"/>
<defs><marker id="cftrArrEn" markerWidth="10" markerHeight="10" refX="5" refY="8" orient="auto"><polygon points="0,0 5,9 10,0" fill="#4b5563"/></marker></defs>

<rect x="130" y="210" width="600" height="60" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="430" y="233" font-size="11.5" font-weight="700" text-anchor="middle" fill="#92400e">&#8593;Na&#8314; reabsorption &#8594; &#8593;H&#8322;O reabsorption &#8594; abnormally thick, dehydrated mucus</text>
<text x="430" y="252" font-size="10" text-anchor="middle" fill="#92400e">secreted into lungs, GI tract, pancreatic ducts, vas deferens</text>

<rect x="30" y="285" width="380" height="80" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="220" y="307" font-size="11" font-weight="700" text-anchor="middle" fill="#1e3a8a">Sweat gland: opposite direction</text>
<text x="220" y="325" font-size="10" text-anchor="middle" fill="#1f2937">CFTR normally REABSORBS Cl&#8315; in ducts</text>
<text x="220" y="343" font-size="10" font-weight="700" text-anchor="middle" fill="#1e3a8a">Loss of CFTR &#8594; &#8593;Cl&#8315; stays in sweat</text>
<text x="220" y="358" font-size="9.5" text-anchor="middle" fill="#1f2937">&#8594; diagnostic: &#8593; sweat chloride test</text>

<rect x="450" y="285" width="380" height="80" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
<text x="640" y="307" font-size="11" font-weight="700" text-anchor="middle" fill="#4c1d95">CFTR modulator drugs</text>
<text x="640" y="325" font-size="10" text-anchor="middle" fill="#1f2937">Potentiators (ivacaftor): hold channel gate open</text>
<text x="640" y="343" font-size="10" text-anchor="middle" fill="#1f2937">Correctors (lumacaftor/tezacaftor): fix 3-D folding</text>
<text x="640" y="358" font-size="9.5" text-anchor="middle" fill="#1f2937">so the protein can traffic to the membrane</text>
</svg>
