<svg class="diagram" viewBox="0 0 860 240" xmlns="http://www.w3.org/2000/svg">
<title>המסלול הפנימי (מיטוכונדריאלי) של אפופטוזיס</title>
<text x="430" y="24" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937">איזון BCL-2/BAX על ממברנת המיטוכונדריה</text>
<rect x="30" y="50" width="230" height="70" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
<text x="145" y="76" font-size="12" font-weight="700" text-anchor="middle" fill="#065f46">BCL-2 / BCL-XL</text>
<text x="145" y="94" font-size="10.5" text-anchor="middle" fill="#065f46">"שומרים" — מעכבים BAX/BAK</text>
<text x="145" y="110" font-size="10.5" text-anchor="middle" fill="#065f46">מצב תקין: תא שורד</text>
<polygon points="270,85 300,78 300,92" fill="#4b5563"/>
<text x="285" y="70" font-size="10" text-anchor="middle" fill="#4b5563">p53 / סטרס</text>
<rect x="305" y="50" width="230" height="70" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="420" y="76" font-size="12" font-weight="700" text-anchor="middle" fill="#7f1d1d">BAX / BAK משתחררים</text>
<text x="420" y="94" font-size="10.5" text-anchor="middle" fill="#7f1d1d">יוצרים נקבוביות בממברנה</text>
<text x="420" y="110" font-size="10.5" text-anchor="middle" fill="#7f1d1d">המיטוכונדריאלית</text>
<polygon points="545,85 575,78 575,92" fill="#4b5563"/>
<rect x="580" y="50" width="240" height="70" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="700" y="76" font-size="12" font-weight="700" text-anchor="middle" fill="#92400e">שחרור Cytochrome c</text>
<text x="700" y="94" font-size="10.5" text-anchor="middle" fill="#92400e">→ הפעלת קספאזות</text>
<text x="700" y="110" font-size="10.5" text-anchor="middle" fill="#92400e">→ פירוק מבוקר של התא</text>
<rect x="30" y="150" width="380" height="65" rx="8" fill="#fce7f3" stroke="#a21caf" stroke-width="1.3"/>
<text x="220" y="173" font-size="12" font-weight="700" text-anchor="middle" fill="#701a75">לי-פראומני (p53 לא-תפקודי)</text>
<text x="220" y="191" font-size="10.5" text-anchor="middle" fill="#701a75">אין מי שיפעיל BAX/BAK כשצריך</text>
<text x="220" y="207" font-size="10.5" text-anchor="middle" fill="#701a75">→ תאים פגומים ממשיכים לשרוד</text>
<rect x="450" y="150" width="380" height="65" rx="8" fill="#fce7f3" stroke="#a21caf" stroke-width="1.3"/>
<text x="640" y="173" font-size="12" font-weight="700" text-anchor="middle" fill="#701a75">HPV — חלבון E6</text>
<text x="640" y="191" font-size="10.5" text-anchor="middle" fill="#701a75">מקדם פירוק p53 (במנגנון אחר)</text>
<text x="640" y="207" font-size="10.5" text-anchor="middle" fill="#701a75">→ אותה תוצאה סופית</text>
</svg>
