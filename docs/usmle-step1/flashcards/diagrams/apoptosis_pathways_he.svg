<svg class="diagram" viewBox="0 0 860 380" xmlns="http://www.w3.org/2000/svg">
<title>אפופטוזיס: מסלול פנימי, חיצוני, ופרפורין/גרנזים B</title>
<text x="430" y="24" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1f2937">שלושה מסלולי הפעלה מתכנסים להפעלת caspases אקזקוטוריים</text>

<rect x="20" y="50" width="260" height="140" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="150" y="72" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1e3a8a">מסלול פנימי (מיטוכונדריאלי)</text>
<text x="150" y="92" font-size="10" text-anchor="middle" fill="#1f2937">נזק ל-DNA, ROS, רעלנים,</text>
<text x="150" y="106" font-size="10" text-anchor="middle" fill="#1f2937">היפוקסיה, הפסקת גורמי גדילה</text>
<text x="150" y="126" font-size="10.5" text-anchor="middle" fill="#1f2937">הפעלת p53 ← ↑Bax/Bak</text>
<text x="150" y="144" font-size="10.5" text-anchor="middle" fill="#1f2937">(Bcl-2/Bcl-xL חוסמים בדרך כלל)</text>
<text x="150" y="164" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1e3a8a">נקבוביות Bax/Bak ← שחרור cytochrome c</text>

<rect x="300" y="50" width="260" height="140" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="430" y="72" font-size="12.5" font-weight="700" text-anchor="middle" fill="#7f1d1d">מסלול חיצוני (רצפטור מוות)</text>
<text x="430" y="92" font-size="10" text-anchor="middle" fill="#1f2937">FasL נקשר ל-Fas (CD95)</text>
<text x="430" y="108" font-size="10" text-anchor="middle" fill="#1f2937">TNF-α נקשר ל-TNFR</text>
<text x="430" y="130" font-size="10" text-anchor="middle" fill="#1f2937">Fas-FasL: סלקציה שלילית תימית</text>
<text x="430" y="148" font-size="10" text-anchor="middle" fill="#1f2937">פגם ב-Fas-FasL ← ALPS</text>
<text x="430" y="166" font-size="10" text-anchor="middle" fill="#1f2937">(תסמונת לימפופרוליפרטיבית אוטואימונית)</text>

<rect x="580" y="50" width="260" height="140" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
<text x="710" y="72" font-size="12.5" font-weight="700" text-anchor="middle" fill="#4c1d95">פרפורין / גרנזים B</text>
<text x="710" y="92" font-size="10" text-anchor="middle" fill="#1f2937">תא T ציטוטוקסי / תא NK</text>
<text x="710" y="112" font-size="10" text-anchor="middle" fill="#1f2937">משחררים תוכן גרנולות</text>
<text x="710" y="132" font-size="10" text-anchor="middle" fill="#1f2937">פרפורין יוצר נקבובית בממברנת המטרה</text>
<text x="710" y="150" font-size="10" text-anchor="middle" fill="#1f2937">← גרנזים B חודר פנימה</text>
<text x="710" y="168" font-size="10" text-anchor="middle" fill="#1f2937">← מפעיל caspases ישירות</text>

<polygon points="150,190 150,210 145,200" fill="#4b5563"/>
<polygon points="430,190 430,210 425,200" fill="#4b5563"/>
<polygon points="710,190 710,210 705,200" fill="#4b5563"/>
<path d="M150,210 L430,240" stroke="#4b5563" stroke-width="2" fill="none"/>
<path d="M710,210 L430,240" stroke="#4b5563" stroke-width="2" fill="none"/>
<path d="M430,210 L430,240" stroke="#4b5563" stroke-width="2" fill="none"/>

<rect x="300" y="245" width="260" height="55" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="430" y="268" font-size="12" font-weight="700" text-anchor="middle" fill="#92400e">הפעלת caspases אקזקוטוריים</text>
<text x="430" y="286" font-size="10" text-anchor="middle" fill="#92400e">(פרוטאזות ציטוזוליות)</text>

<polygon points="430,300 430,320 425,310" fill="#4b5563"/>

<rect x="230" y="325" width="400" height="45" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
<text x="430" y="352" font-size="11.5" font-weight="700" text-anchor="middle" fill="#065f46">התכווצות התא, קונדנסציית כרומטין, בלבבינג ← גופיפים אפופטוטיים ← פגוציטוזה (ללא דלקת)</text>
</svg>
