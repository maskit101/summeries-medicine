<svg class="diagram" viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg" direction="ltr">
<title>מנגנון היווצרות גרנולומה — מהצגת אנטיגן ועד תא ענק רב-גרעיני</title>
<text x="450" y="26" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2937">מנגנון היווצרות גרנולומה (דלקת גרנולומטית כרונית)</text>

<rect x="20" y="55" width="185" height="90" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="112" y="76" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1e3a8a">APC מציג אנטיגן</text>
<text x="112" y="94" font-size="9.5" text-anchor="middle" fill="#1f2937">גירוי עמיד (למשל TB)</text>
<text x="112" y="110" font-size="9.5" text-anchor="middle" fill="#1f2937">ל-CD4+ Th cell</text>
<text x="112" y="128" font-size="9.5" font-weight="700" text-anchor="middle" fill="#1e3a8a">+ מפריש IL-12</text>

<polygon points="205,100 235,93 235,107" fill="#4b5563"/>

<rect x="240" y="55" width="185" height="90" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
<text x="332" y="76" font-size="11.5" font-weight="700" text-anchor="middle" fill="#4c1d95">התמיינות ל-Th1</text>
<text x="332" y="96" font-size="9.5" text-anchor="middle" fill="#1f2937">בהשפעת IL-12</text>
<text x="332" y="116" font-size="9.5" font-weight="700" text-anchor="middle" fill="#4c1d95">Th1 מפריש IFN-γ</text>

<polygon points="425,100 455,93 455,107" fill="#4b5563"/>

<rect x="460" y="55" width="200" height="90" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="560" y="76" font-size="11.5" font-weight="700" text-anchor="middle" fill="#92400e">הפעלת מקרופאג</text>
<text x="560" y="96" font-size="9.5" text-anchor="middle" fill="#1f2937">IFN-γ מפעיל מקרופאגים</text>
<text x="560" y="116" font-size="9.5" font-weight="700" text-anchor="middle" fill="#92400e">↑הפרשת ציטוקינים (TNF)</text>

<polygon points="665,100 695,93 695,107" fill="#4b5563"/>

<rect x="700" y="55" width="180" height="90" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="790" y="76" font-size="11.5" font-weight="700" text-anchor="middle" fill="#7f1d1d">תאים אפיתלואידים</text>
<text x="790" y="96" font-size="9.5" text-anchor="middle" fill="#1f2937">+ היתוך לתא ענק</text>
<text x="790" y="116" font-size="9.5" font-weight="700" text-anchor="middle" fill="#7f1d1d">רב-גרעיני</text>

<!-- granuloma cross-section illustration -->
<circle cx="180" cy="260" r="95" fill="#fca5a5" opacity="0.35"/>
<circle cx="180" cy="260" r="55" fill="#fecaca" opacity="0.7"/>
<text x="180" y="255" font-size="10" text-anchor="middle" fill="#7f1d1d" font-weight="700">נמק גבינתי</text>
<text x="180" y="270" font-size="9" text-anchor="middle" fill="#7f1d1d">(caseating, למשל TB)</text>
<circle cx="115" cy="205" r="8" fill="#f59e0b"/><circle cx="245" cy="205" r="8" fill="#f59e0b"/>
<circle cx="105" cy="260" r="8" fill="#f59e0b"/><circle cx="255" cy="260" r="8" fill="#f59e0b"/>
<circle cx="115" cy="315" r="8" fill="#f59e0b"/><circle cx="245" cy="315" r="8" fill="#f59e0b"/>
<circle cx="150" cy="185" r="7" fill="#60a5fa"/><circle cx="210" cy="185" r="7" fill="#60a5fa"/>
<text x="180" y="192" font-size="8" text-anchor="middle" fill="#1e3a8a">לימפוציטים</text>
<ellipse cx="180" cy="330" rx="26" ry="14" fill="#a78bfa"/>
<circle cx="170" cy="326" r="4" fill="#4c1d95"/><circle cx="190" cy="330" r="4" fill="#4c1d95"/><circle cx="180" cy="335" r="4" fill="#4c1d95"/>
<text x="180" y="352" font-size="8.5" text-anchor="middle" fill="#4c1d95" font-weight="700">תא ענק רב-גרעיני</text>
<text x="180" y="365" font-size="8" text-anchor="middle" fill="#4c1d95">(היתוך מקרופאגים)</text>

<rect x="330" y="180" width="270" height="190" rx="8" fill="#f8fafc" stroke="#9ca3af" stroke-width="1"/>
<text x="465" y="202" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1f2937">Caseating מול Noncaseating</text>
<text x="465" y="224" font-size="10" font-weight="700" text-anchor="middle" fill="#7f1d1d">Caseating — עם נמק מרכזי</text>
<text x="465" y="240" font-size="9.5" text-anchor="middle" fill="#1f2937">זיהומי: TB, פטריות אנדמיות</text>
<text x="465" y="264" font-size="10" font-weight="700" text-anchor="middle" fill="#065f46">Noncaseating — ללא נמק</text>
<text x="465" y="280" font-size="9.5" text-anchor="middle" fill="#1f2937">לא-זיהומי: סרקואידוזיס, קרוהן</text>
<text x="465" y="304" font-size="9.5" font-weight="700" text-anchor="middle" fill="#92400e">אנטי-TNF → פירוק גרנולומה</text>
<text x="465" y="320" font-size="9.5" text-anchor="middle" fill="#1f2937">→ הפצת מחלה (בדיקת TB סמויה לפני!)</text>
<text x="465" y="344" font-size="9.5" font-weight="700" text-anchor="middle" fill="#4c1d95">↑1α-hydroxylase במקרופאג</text>
<text x="465" y="360" font-size="9.5" text-anchor="middle" fill="#1f2937">→ ↑ויטמין D פעיל → היפרקלצמיה</text>

<rect x="620" y="180" width="260" height="190" rx="8" fill="#f8fafc" stroke="#9ca3af" stroke-width="1"/>
<text x="750" y="202" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1f2937">אטיולוגיות עיקריות</text>
<text x="750" y="224" font-size="9.5" text-anchor="middle" fill="#1f2937">חיידקיות: TB, צרעת, Bartonella</text>
<text x="750" y="240" font-size="9.5" text-anchor="middle" fill="#1f2937">henselae, Listeria, T. pallidum</text>
<text x="750" y="260" font-size="9.5" text-anchor="middle" fill="#1f2937">פטרייתיות: היסטופלזמוזיס</text>
<text x="750" y="276" font-size="9.5" text-anchor="middle" fill="#1f2937">טפיליות: שיסטוזומיאזיס</text>
<text x="750" y="296" font-size="9.5" text-anchor="middle" fill="#1f2937">אימונית: סרקואידוזיס, קרוהן,</text>
<text x="750" y="312" font-size="9.5" text-anchor="middle" fill="#1f2937">צירוזיס ביליארי ראשוני, דה-קרוון</text>
<text x="750" y="332" font-size="9.5" text-anchor="middle" fill="#1f2937">וסקוליטיס: GPA, EGPA, ענק-תאי,</text>
<text x="750" y="348" font-size="9.5" text-anchor="middle" fill="#1f2937">טקאיאסו</text>
<text x="750" y="364" font-size="9.5" text-anchor="middle" fill="#1f2937">גוף זר: בריליוזיס, טלקוזיס</text>
</svg>
