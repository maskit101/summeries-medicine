<svg class="diagram" viewBox="0 0 860 340" xmlns="http://www.w3.org/2000/svg" direction="ltr">
<title>עקרון הרדי-ויינברג: שכיחות אללים ושכיחות גנוטיפים</title>
<text x="430" y="24" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1f2937">שיווי משקל הרדי-ויינברג: p + q = 1, ולכן p&#178; + 2pq + q&#178; = 1</text>

<rect x="30" y="50" width="330" height="180" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="195" y="72" font-size="12" font-weight="700" text-anchor="middle" fill="#1e3a8a">לוגיקת ריבוע פנט</text>
<rect x="130" y="90" width="70" height="34" fill="#f3f4f6" stroke="#9ca3af"/>
<text x="165" y="112" font-size="12" text-anchor="middle" fill="#1f2937">A (p)</text>
<rect x="200" y="90" width="70" height="34" fill="#f3f4f6" stroke="#9ca3af"/>
<text x="235" y="112" font-size="12" text-anchor="middle" fill="#1f2937">a (q)</text>
<rect x="60" y="124" width="70" height="34" fill="#f3f4f6" stroke="#9ca3af"/>
<text x="95" y="146" font-size="12" text-anchor="middle" fill="#1f2937">A (p)</text>
<rect x="130" y="124" width="70" height="34" fill="#ecfdf5" stroke="#047857"/>
<text x="165" y="146" font-size="12" font-weight="700" text-anchor="middle" fill="#065f46">AA (p&#178;)</text>
<rect x="200" y="124" width="70" height="34" fill="#fffbeb" stroke="#b45309"/>
<text x="235" y="146" font-size="12" font-weight="700" text-anchor="middle" fill="#92400e">Aa (pq)</text>
<rect x="60" y="158" width="70" height="34" fill="#f3f4f6" stroke="#9ca3af"/>
<text x="95" y="180" font-size="12" text-anchor="middle" fill="#1f2937">a (q)</text>
<rect x="130" y="158" width="70" height="34" fill="#fffbeb" stroke="#b45309"/>
<text x="165" y="180" font-size="12" font-weight="700" text-anchor="middle" fill="#92400e">Aa (pq)</text>
<rect x="200" y="158" width="70" height="34" fill="#fef2f2" stroke="#b91c1c"/>
<text x="235" y="180" font-size="12" font-weight="700" text-anchor="middle" fill="#7f1d1d">aa (q&#178;)</text>
<text x="195" y="212" font-size="10.5" text-anchor="middle" fill="#374151">הומוזיגוט AA (p&#178;) + הטרוזיגוט Aa (2pq) + הומוזיגוט aa (q&#178;) = 1</text>

<rect x="390" y="50" width="440" height="180" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
<text x="610" y="72" font-size="12" font-weight="700" text-anchor="middle" fill="#4c1d95">דוגמה מחושבת: סיסטיק פיברוזיס (AR)</text>
<text x="810" y="95" font-size="10.5" text-anchor="end" fill="#1f2937">שכיחות המחלה (aa) &#8776; 1/3200 &#8592; q&#178; = 1/3200</text>
<text x="810" y="114" font-size="10.5" text-anchor="end" fill="#1f2937">q = &#8730;(1/3200) &#8776; 0.017 (1.7% מהאללים)</text>
<text x="810" y="133" font-size="10.5" text-anchor="end" fill="#1f2937">p = 1 &#8722; q &#8776; 0.982 (מחלה נדירה, לכן p &#8776; 1)</text>
<text x="810" y="152" font-size="10.5" font-weight="700" text-anchor="end" fill="#4c1d95">שכיחות נשאים = 2pq &#8776; 0.035 &#8592; 3.5% מהאוכלוסייה</text>
<text x="810" y="178" font-size="10" text-anchor="end" fill="#4b5563">מחלה נסגרת ל-X: שכיחות בזכרים = q, בנקבות = q&#178;</text>
<text x="810" y="196" font-size="10" text-anchor="end" fill="#4b5563">(זכרים המיזיגוטים &#8212; X אחד בלבד)</text>

<rect x="30" y="245" width="800" height="75" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
<text x="430" y="268" font-size="11.5" font-weight="700" text-anchor="middle" fill="#92400e">הנחות: אין מוטציה, אין ברירה טבעית, זיווג אקראי, אין הגירה, אוכלוסייה גדולה</text>
<text x="430" y="288" font-size="10.5" text-anchor="middle" fill="#92400e">הפרת הנחה (bottleneck, founder effect, זיווג לא-אקראי) &#8592; שינוי בשכיחות האללים = סחף גנטי</text>
<text x="430" y="306" font-size="9.5" text-anchor="middle" fill="#92400e">בשיווי משקל, p ו-q נשארים קבועים מדור לדור</text>
</svg>
