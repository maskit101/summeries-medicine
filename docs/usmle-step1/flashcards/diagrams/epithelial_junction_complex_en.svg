<svg class="diagram" viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg" direction="ltr">
<title>Epithelial cell junction complex — apical to basal</title>
<text x="500" y="26" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2937">Epithelial Cell Junctions — Apical (top) to Basal (bottom)</text>
<text x="500" y="45" font-size="10.5" text-anchor="middle" fill="#4b5563">Two adjacent epithelial cells; apical lumen above, basement membrane below</text>

<line x1="330" y1="70" x2="330" y2="560" stroke="#9ca3af" stroke-width="3"/>
<line x1="670" y1="70" x2="670" y2="560" stroke="#9ca3af" stroke-width="3"/>
<text x="150" y="95" font-size="10.5" font-weight="700" fill="#4b5563">Cell A</text>
<text x="850" y="95" font-size="10.5" font-weight="700" fill="#4b5563">Cell B</text>
<text x="500" y="63" font-size="10" text-anchor="middle" fill="#4b5563">↑ Lumen (apical)</text>

<rect x="270" y="80" width="460" height="70" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<rect x="300" y="95" width="60" height="14" fill="#1e3a8a"/>
<rect x="640" y="95" width="60" height="14" fill="#1e3a8a"/>
<text x="500" y="105" font-size="12" font-weight="700" text-anchor="middle" fill="#1e3a8a">Tight Junction (Zonula Occludens)</text>
<text x="500" y="122" font-size="9.5" text-anchor="middle" fill="#1e3a8a">Most apical — blocks paracellular solute movement; claudins + occludins</text>
<text x="500" y="138" font-size="9" text-anchor="middle" fill="#1e3a8a">(prevents free passage of solutes between cells)</text>

<rect x="270" y="165" width="460" height="70" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
<rect x="300" y="180" width="60" height="14" fill="#065f46"/>
<rect x="640" y="180" width="60" height="14" fill="#065f46"/>
<text x="500" y="190" font-size="12" font-weight="700" text-anchor="middle" fill="#065f46">Adherens Junction (Zonula Adherens, Belt Desmosome)</text>
<text x="500" y="207" font-size="9.5" text-anchor="middle" fill="#065f46">"Belt" connecting actin cytoskeletons via cadherins (Ca²⁺-dependent)</text>
<text x="500" y="223" font-size="9" text-anchor="middle" fill="#065f46">Loss of E-cadherin promotes metastasis</text>

<rect x="270" y="250" width="460" height="70" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
<circle cx="330" cy="285" r="12" fill="#4c1d95"/>
<circle cx="670" cy="285" r="12" fill="#4c1d95"/>
<text x="500" y="273" font-size="12" font-weight="700" text-anchor="middle" fill="#4c1d95">Desmosome (Spot Desmosome, Macula Adherens)</text>
<text x="500" y="290" font-size="9.5" text-anchor="middle" fill="#4c1d95">Structural support via intermediate filament (keratin) interactions</text>
<text x="500" y="306" font-size="9" text-anchor="middle" fill="#4c1d95">Autoantibodies to desmoglein 3 (±1) → Pemphigus vulgaris</text>

<rect x="270" y="335" width="460" height="65" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
<rect x="310" y="358" width="20" height="20" fill="#7f1d1d"/>
<rect x="670" y="358" width="20" height="20" fill="#7f1d1d"/>
<line x1="330" y1="368" x2="670" y2="368" stroke="#7f1d1d" stroke-width="4"/>
<text x="500" y="352" font-size="12" font-weight="700" text-anchor="middle" fill="#7f1d1d">Gap Junction</text>
<text x="500" y="390" font-size="9.5" text-anchor="middle" fill="#7f1d1d">Connexon channels allow direct electrical/chemical cell-cell communication</text>

<text x="500" y="422" font-size="11" font-weight="700" text-anchor="middle" fill="#1f2937">↓ Basal side — attachment to basement membrane</text>

<rect x="270" y="435" width="460" height="90" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
<circle cx="360" cy="470" r="11" fill="#92400e"/>
<circle cx="500" cy="470" r="11" fill="#92400e"/>
<circle cx="640" cy="470" r="11" fill="#92400e"/>
<text x="500" y="453" font-size="12" font-weight="700" text-anchor="middle" fill="#92400e">Hemidesmosome + Integrins</text>
<text x="500" y="495" font-size="9.5" text-anchor="middle" fill="#78350f">Hemidesmosome: connects keratin in basal cells to basement membrane</text>
<text x="500" y="510" font-size="8.5" text-anchor="middle" fill="#78350f">Autoantibodies → Bullous pemphigoid ("down bullow")</text>

<rect x="270" y="530" width="460" height="30" rx="6" fill="#d97706"/>
<text x="500" y="550" font-size="9.5" font-weight="700" text-anchor="middle" fill="#fff7ed">Basement Membrane / ECM — collagen, laminin, fibronectin (bound by Integrins)</text>

<rect x="40" y="578" width="920" height="55" rx="8" fill="#111827"/>
<text x="500" y="600" font-size="10" font-weight="700" text-anchor="middle" fill="#f9fafb">Plastic surgery relevance: desmosome/hemidesmosome pathology = blistering under a dressing or flap</text>
<text x="500" y="618" font-size="9.5" text-anchor="middle" fill="#f9fafb">Pemphigus vulgaris (intraepidermal, Nikolsky positive) vs Bullous pemphigoid (subepidermal, more stable)</text>
</svg>
