<svg class="diagram" viewBox="0 0 860 240" xmlns="http://www.w3.org/2000/svg">
<title>Three cell types by regenerative capacity</title>
<text x="430" y="24" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1f2937">Permanent / Stable / Labile — relation to the cell cycle</text>
<rect x="20" y="45" width="260" height="175" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="150" y="70" font-size="13" font-weight="700" text-anchor="middle" fill="#7f1d1d">Permanent</text>
<text x="150" y="92" font-size="10.5" text-anchor="middle" fill="#1f2937">Exit to G0, never return</text>
<text x="150" y="108" font-size="10.5" text-anchor="middle" fill="#1f2937">Regenerate only via stem cells</text>
<text x="150" y="132" font-size="10.3" font-weight="700" text-anchor="middle" fill="#7f1d1d">Neurons</text>
<text x="150" y="150" font-size="10.3" font-weight="700" text-anchor="middle" fill="#7f1d1d">Skeletal and cardiac muscle</text>
<text x="150" y="168" font-size="10.3" font-weight="700" text-anchor="middle" fill="#7f1d1d">Red blood cells</text>
<text x="150" y="196" font-size="10" text-anchor="middle" fill="#4b5563">Low chemo sensitivity</text>
<rect x="300" y="45" width="260" height="175" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="430" y="70" font-size="13" font-weight="700" text-anchor="middle" fill="#92400e">Stable (quiescent)</text>
<text x="430" y="92" font-size="10.5" text-anchor="middle" fill="#1f2937">Sit in G0</text>
<text x="430" y="108" font-size="10.5" text-anchor="middle" fill="#1f2937">Re-enter G1 when stimulated</text>
<text x="430" y="132" font-size="10.3" font-weight="700" text-anchor="middle" fill="#92400e">Hepatocytes</text>
<text x="430" y="150" font-size="10.3" font-weight="700" text-anchor="middle" fill="#92400e">Lymphocytes</text>
<text x="430" y="168" font-size="10.3" font-weight="700" text-anchor="middle" fill="#92400e">PCT, periosteal cells</text>
<text x="430" y="196" font-size="10" text-anchor="middle" fill="#4b5563">Intermediate chemo sensitivity</text>
<rect x="580" y="45" width="260" height="175" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
<text x="710" y="70" font-size="13" font-weight="700" text-anchor="middle" fill="#065f46">Labile</text>
<text x="710" y="92" font-size="10.5" text-anchor="middle" fill="#1f2937">Never enter G0</text>
<text x="710" y="108" font-size="10.5" text-anchor="middle" fill="#1f2937">Divide rapidly, short G1</text>
<text x="710" y="132" font-size="10.3" font-weight="700" text-anchor="middle" fill="#065f46">Bone marrow</text>
<text x="710" y="150" font-size="10.3" font-weight="700" text-anchor="middle" fill="#065f46">Gut epithelium, skin</text>
<text x="710" y="168" font-size="10.3" font-weight="700" text-anchor="middle" fill="#065f46">Hair follicles, germ cells</text>
<text x="710" y="196" font-size="10" font-weight="700" text-anchor="middle" fill="#065f46">Most affected by chemotherapy!</text>
</svg>
