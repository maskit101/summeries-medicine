<svg class="diagram" viewBox="0 0 860 698" xmlns="http://www.w3.org/2000/svg">
<title>Splice-site mutation and frameshift mutation</title>
<text x="430.0" y="20" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937" >Normal: correct splicing</text>
<rect x="40" y="40" width="780" height="46" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
<text x="58" y="58" font-size="11" font-weight="700" text-anchor="start" fill="#4b5563" >5'</text>
<rect x="90" y="48" width="130" height="30" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/>
<text x="155" y="68" font-size="11" font-weight="700" text-anchor="middle" fill="#1e3a8a" >Exon 1</text>
<rect x="230" y="48" width="400" height="30" rx="5" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.3"/>
<text x="275" y="68" font-size="11.5" font-weight="700" text-anchor="middle" fill="#b91c1c" >5'-GU</text>
<text x="430" y="68" font-size="10.3" font-weight="400" text-anchor="middle" fill="#7f1d1d" >Intron (branch-point A)</text>
<text x="590" y="68" font-size="11.5" font-weight="700" text-anchor="middle" fill="#b91c1c" >AG-3'</text>
<rect x="650" y="48" width="130" height="30" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/>
<text x="715" y="68" font-size="11" font-weight="700" text-anchor="middle" fill="#1e3a8a" >Exon 2</text>
<text x="802" y="58" font-size="11" font-weight="700" text-anchor="end" fill="#4b5563" >3'</text>
<text x="430.0" y="104" font-size="10" font-weight="700" text-anchor="middle" fill="#92400e" >Note: the 5'/3' of the WHOLE transcript (gray ends) differ from the 5'/3' of the INTRON itself (GU/AG in the red box)!</text>
<circle cx="193" cy="158" r="26" fill="#fce7f3" stroke="#a21caf" stroke-width="2.2" stroke-dasharray="5,3"/>
<text x="193" y="162" font-size="10" font-weight="700" text-anchor="middle" fill="#701a75" >lariat</text>
<text x="193" y="216" font-size="9.3" font-weight="400" text-anchor="middle" fill="#701a75" >intron loops -</text>
<text x="193" y="228" font-size="9.3" font-weight="400" text-anchor="middle" fill="#701a75" >lariat shape, discarded</text>
<text x="430" y="156" font-size="11" font-weight="700" text-anchor="middle" fill="#1f2937" >The spliceosome (snRNP) cuts first at GU, then at AG</text>
<text x="430" y="176" font-size="10.3" font-weight="400" text-anchor="middle" fill="#4b5563" >the intron exits as a lariat; the two exons are joined</text>
<line x1="155" y1="234" x2="155" y2="246" stroke="#4b5563" stroke-width="2.5"/><polygon points="148,244 162,244 155,256" fill="#4b5563"/>
<rect x="90" y="264" width="130" height="30" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/>
<text x="155" y="284" font-size="11" font-weight="700" text-anchor="middle" fill="#1e3a8a" >Exon 1</text>
<rect x="650" y="264" width="130" height="30" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/>
<text x="715" y="284" font-size="11" font-weight="700" text-anchor="middle" fill="#1e3a8a" >Exon 2</text>
<line x1="220" y1="279" x2="650" y2="279" stroke="#2563eb" stroke-width="3"/>
<text x="430" y="274" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1e3a8a" >mature mRNA — exons joined</text>
<line x1="20" y1="314" x2="840" y2="314" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="430.0" y="328" font-size="13" font-weight="700" text-anchor="middle" fill="#7f1d1d" >Splice-site mutation: GU→GC at the intron's 5' end</text>
<rect x="40" y="346" width="780" height="46" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.3"/>
<rect x="90" y="354" width="130" height="30" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/>
<text x="155" y="374" font-size="11" font-weight="700" text-anchor="middle" fill="#1e3a8a" >Exon 1</text>
<text x="275" y="374" font-size="11.5" font-weight="700" text-anchor="middle" fill="#7f1d1d" >5'-GC</text>
<line x1="255" y1="379" x2="295" y2="379" stroke="#7f1d1d" stroke-width="2"/>
<text x="440" y="374" font-size="10" font-weight="400" text-anchor="middle" fill="#7f1d1d" >intron — spliceosome fails to recognize the site</text>
<text x="590" y="374" font-size="11.5" font-weight="700" text-anchor="middle" fill="#7f1d1d" >AG-3'</text>
<rect x="650" y="354" width="130" height="30" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/>
<text x="715" y="374" font-size="11" font-weight="700" text-anchor="middle" fill="#1e3a8a" >Exon 2</text>
<line x1="430" y1="398" x2="430" y2="404" stroke="#4b5563" stroke-width="2.5"/><polygon points="423,402 437,402 430,414" fill="#4b5563"/>
<rect x="160" y="422" width="540" height="34" rx="6" fill="#fce7f3" stroke="#a21caf" stroke-width="1.3"/>
<text x="430" y="444" font-size="10.8" font-weight="700" text-anchor="middle" fill="#701a75" >Result: intron retained in mRNA (or exon skipped) → defective protein</text>
<line x1="20" y1="472" x2="840" y2="472" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="430.0" y="486" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937" >Separately: frameshift mutation — same bases, different reading frame</text>
<text x="60" y="533" font-size="10.5" font-weight="700" text-anchor="start" fill="#1f2937" >normal:</text>
<rect x="100" y="512" width="42" height="30" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
<text x="121.0" y="532" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937" >A</text>
<rect x="146" y="512" width="42" height="30" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
<text x="167.0" y="532" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937" >U</text>
<rect x="192" y="512" width="42" height="30" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
<text x="213.0" y="532" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937" >G</text>
<rect x="238" y="512" width="42" height="30" rx="4" fill="#ecfdf5" stroke="#047857" stroke-width="1.2"/>
<text x="259.0" y="532" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937" >C</text>
<rect x="284" y="512" width="42" height="30" rx="4" fill="#ecfdf5" stroke="#047857" stroke-width="1.2"/>
<text x="305.0" y="532" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937" >C</text>
<rect x="330" y="512" width="42" height="30" rx="4" fill="#ecfdf5" stroke="#047857" stroke-width="1.2"/>
<text x="351.0" y="532" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937" >U</text>
<rect x="376" y="512" width="42" height="30" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
<text x="397.0" y="532" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937" >A</text>
<rect x="422" y="512" width="42" height="30" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
<text x="443.0" y="532" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937" >C</text>
<rect x="468" y="512" width="42" height="30" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
<text x="489.0" y="532" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937" >G</text>
<rect x="514" y="512" width="42" height="30" rx="4" fill="#ecfdf5" stroke="#047857" stroke-width="1.2"/>
<text x="535.0" y="532" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937" >G</text>
<rect x="560" y="512" width="42" height="30" rx="4" fill="#ecfdf5" stroke="#047857" stroke-width="1.2"/>
<text x="581.0" y="532" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937" >A</text>
<text x="100" y="550" font-size="9.8" font-weight="400" text-anchor="start" fill="#4b5563" >codons: AUG | CCU | ACG | GA..</text>
<line x1="102" y1="570" x2="102" y2="582" stroke="#4b5563" stroke-width="2.5"/><polygon points="95,580 109,580 102,592" fill="#4b5563"/>
<text x="130" y="586" font-size="10" font-weight="700" text-anchor="start" fill="#b91c1c" >← single-base insertion (X): not a multiple of 3</text>
<text x="60" y="621" font-size="10.5" font-weight="700" text-anchor="start" fill="#1f2937" >shifted:</text>
<rect x="100" y="600" width="40" height="30" rx="4" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/>
<text x="120.0" y="620" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937" >A</text>
<rect x="142" y="600" width="40" height="30" rx="4" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/>
<text x="162.0" y="620" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937" >U</text>
<rect x="184" y="600" width="40" height="30" rx="4" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/>
<text x="204.0" y="620" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937" >G</text>
<rect x="226" y="600" width="40" height="30" rx="4" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/>
<text x="246.0" y="620" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937" >X</text>
<rect x="268" y="600" width="40" height="30" rx="4" fill="#fce7f3" stroke="#a21caf" stroke-width="1.2"/>
<text x="288.0" y="620" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937" >C</text>
<rect x="310" y="600" width="40" height="30" rx="4" fill="#fce7f3" stroke="#a21caf" stroke-width="1.2"/>
<text x="330.0" y="620" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937" >C</text>
<rect x="352" y="600" width="40" height="30" rx="4" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/>
<text x="372.0" y="620" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937" >U</text>
<rect x="394" y="600" width="40" height="30" rx="4" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/>
<text x="414.0" y="620" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937" >A</text>
<rect x="436" y="600" width="40" height="30" rx="4" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/>
<text x="456.0" y="620" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937" >C</text>
<rect x="478" y="600" width="40" height="30" rx="4" fill="#fce7f3" stroke="#a21caf" stroke-width="1.2"/>
<text x="498.0" y="620" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937" >G</text>
<rect x="520" y="600" width="40" height="30" rx="4" fill="#fce7f3" stroke="#a21caf" stroke-width="1.2"/>
<text x="540.0" y="620" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937" >G</text>
<rect x="562" y="600" width="40" height="30" rx="4" fill="#fce7f3" stroke="#a21caf" stroke-width="1.2"/>
<text x="582.0" y="620" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937" >A</text>
<rect x="20" y="646" width="820" height="42" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
<text x="430.0" y="664" font-size="10.6" font-weight="700" text-anchor="middle" fill="#92400e" >What "shifts": from the insertion point on, every codon (3-3-3) boundary moves by 1</text>
<text x="430.0" y="680" font-size="10" font-weight="400" text-anchor="middle" fill="#92400e" >the exact same bases now translate into completely different amino acids from this point on</text>
</svg>