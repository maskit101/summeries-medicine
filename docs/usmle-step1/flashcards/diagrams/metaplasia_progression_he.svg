<svg class="diagram" viewBox="0 0 860 316" xmlns="http://www.w3.org/2000/svg">
<title>מגירוי כרוני להתמרה ממאירה: מטאפלזיה → דיספלזיה → קרצינומה</title>
<text x="430.0" y="20" font-size="12" font-weight="700" text-anchor="middle" fill="#1f2937" >גירוי כרוני מתמשך = לחץ סלקטיבי מתמיד על תאי הגזע</text>
<rect x="30" y="50" width="240" height="90" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/>
<text x="150.0" y="76" font-size="13.5" font-weight="700" text-anchor="middle" fill="#065f46" >מטאפלזיה</text>
<text x="150.0" y="100" font-size="9.8" font-weight="400" text-anchor="middle" fill="#1f2937" >תאים מותמרים, מאורגנים, עדיין תקינים</text>
<text x="150.0" y="124" font-size="10.6" font-weight="700" text-anchor="middle" fill="#065f46" >הפיך</text>
<line x1="270" y1="95" x2="290" y2="95" stroke="#4b5563" stroke-width="2.5"/><polygon points="288,88 288,102 300,95" fill="#4b5563"/>
<rect x="300" y="50" width="240" height="90" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.6"/>
<text x="420.0" y="76" font-size="13.5" font-weight="700" text-anchor="middle" fill="#92400e" >דיספלזיה</text>
<text x="420.0" y="100" font-size="9.8" font-weight="400" text-anchor="middle" fill="#1f2937" >חוסר-ארגון תאי, עדיין בתוך קרום הבסיס</text>
<text x="420.0" y="124" font-size="10.6" font-weight="700" text-anchor="middle" fill="#92400e" >הפיך</text>
<line x1="540" y1="95" x2="560" y2="95" stroke="#4b5563" stroke-width="2.5"/><polygon points="558,88 558,102 570,95" fill="#4b5563"/>
<rect x="570" y="50" width="240" height="90" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.6"/>
<text x="690.0" y="76" font-size="13.5" font-weight="700" text-anchor="middle" fill="#7f1d1d" >קרצינומה פולשנית</text>
<text x="690.0" y="100" font-size="9.8" font-weight="400" text-anchor="middle" fill="#1f2937" >פריצת קרום הבסיס — בלתי-הפיך</text>
<text x="690.0" y="124" font-size="10.6" font-weight="700" text-anchor="middle" fill="#7f1d1d" >בלתי-הפיך</text>
<line x1="30" y1="168" x2="540" y2="168" stroke="#4b5563" stroke-width="4"/>
<text x="285.0" y="158" font-size="9.3" font-weight="400" text-anchor="middle" fill="#4b5563" >קרום הבסיס שלם</text>
<line x1="570" y1="168" x2="650" y2="168" stroke="#4b5563" stroke-width="4" stroke-dasharray="6,5"/>
<line x1="670" y1="168" x2="810" y2="168" stroke="#4b5563" stroke-width="4" stroke-dasharray="6,5"/>
<text x="660" y="158" font-size="9.3" font-weight="700" text-anchor="middle" fill="#b91c1c" >פרוץ</text>
<rect x="20" y="198" width="820" height="44" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.3"/>
<text x="430.0" y="216" font-size="10.6" font-weight="700" text-anchor="middle" fill="#1f2937" >דוגמה: ריפלוקס כרוני (GERD) → ושט בארט (מטאפלזיה) → דיספלזיה → אדנוקרצינומה של הוושט</text>
<text x="430.0" y="232" font-size="9.6" font-weight="400" text-anchor="middle" fill="#4b5563" >הסרת הגירוי בשלב מטאפלזיה/דיספלזיה עדיין יכולה להיעצר/להיסוג</text>
<rect x="20" y="272" width="820" height="34" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
<text x="430.0" y="294" font-size="10.3" font-weight="700" text-anchor="middle" fill="#92400e" >מה "זז": קו הגבול הקריטי הוא קרום הבסיס — כל עוד תאי הגידול לא חצו אותו, המצב הפיך</text>
</svg>