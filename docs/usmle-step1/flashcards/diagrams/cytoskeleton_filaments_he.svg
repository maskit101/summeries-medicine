<svg class="diagram" viewBox="0 0 860 230" xmlns="http://www.w3.org/2000/svg">
<title>שלוש משפחות סיבי שלד התא</title>
<text x="430" y="24" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1f2937">שלוש משפחות שלד התא — תפקיד ודוגמאות</text>
<rect x="20" y="45" width="260" height="165" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="150" y="70" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1e3a8a">מיקרופילמנטים</text>
<text x="150" y="92" font-size="10.5" text-anchor="middle" fill="#1f2937">התכווצות שריר</text>
<text x="150" y="108" font-size="10.5" text-anchor="middle" fill="#1f2937">ציטוקינזיס, פגוציטוזה</text>
<text x="150" y="140" font-size="10.3" font-weight="700" text-anchor="middle" fill="#1e3a8a">אקטין</text>
<text x="150" y="158" font-size="10.3" font-weight="700" text-anchor="middle" fill="#1e3a8a">מיקרווילי</text>
