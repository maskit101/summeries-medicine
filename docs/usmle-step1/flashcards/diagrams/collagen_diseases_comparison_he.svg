<text x="430" y="217" font-size="11" font-weight="700" text-anchor="middle" fill="#78350f">מנקס (ATP7A — חסר נחושת) מול וילסון (ATP7B — עודף נחושת): אותה משפחת חלבון, כיוון הפוך</text>
