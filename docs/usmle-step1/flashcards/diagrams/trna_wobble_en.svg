<svg class="diagram" viewBox="0 0 860 320" xmlns="http://www.w3.org/2000/svg">
<title>Codon-anticodon pairing and the wobble effect at the third position</title>
<text x="430" y="24" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2937">Which base actually "moves"/is flexible in codon-anticodon pairing</text>

<text x="90" y="70" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1e3a8a">mRNA (codon, 5'→3')</text>
<rect x="60" y="85" width="60" height="46" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="90" y="113" font-size="16" font-weight="700" text-anchor="middle" fill="#1e3a8a">5'-C</text>
<rect x="130" y="85" width="60" height="46" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="160" y="113" font-size="16" font-weight="700" text-anchor="middle" fill="#1e3a8a">U</text>
<rect x="200" y="85" width="60" height="46" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="2.5"/>
<text x="230" y="113" font-size="16" font-weight="700" text-anchor="middle" fill="#b91c1c">A-3'</text>
<text x="230" y="150" font-size="11" font-weight="700" text-anchor="middle" fill="#b91c1c">3rd base — "flexible"</text>

<line x1="90" y1="131" x2="90" y2="175" stroke="#4b5563" stroke-width="2"/>
<line x1="160" y1="131" x2="160" y2="175" stroke="#4b5563" stroke-width="2"/>
<line x1="230" y1="131" x2="230" y2="175" stroke="#b91c1c" stroke-width="2" stroke-dasharray="5,4"/>

<rect x="60" y="176" width="60" height="46" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
<text x="90" y="204" font-size="16" font-weight="700" text-anchor="middle" fill="#065f46">3'-G</text>
<rect x="130" y="176" width="60" height="46" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
<text x="160" y="204" font-size="16" font-weight="700" text-anchor="middle" fill="#065f46">A</text>
<rect x="200" y="176" width="60" height="46" rx="6" fill="#fce7f3" stroke="#a21caf" stroke-width="2.5"/>
<text x="230" y="204" font-size="16" font-weight="700" text-anchor="middle" fill="#701a75">I-5'</text>
<text x="230" y="245" font-size="11" font-weight="700" text-anchor="middle" fill="#701a75">the tRNA anticodon's wobble position</text>
<text x="160" y="260" font-size="12" text-anchor="middle" fill="#4b5563">tRNA anticodon</text>

<g>
  <text x="480" y="180" font-size="12.5" font-weight="700" fill="#701a75">Inosine (I) at the wobble position can pair with:</text>
  <rect x="480" y="195" width="70" height="40" rx="6" fill="#fee2e2" stroke="#b91c1c"/>
  <text x="515" y="220" font-size="15" font-weight="700" text-anchor="middle" fill="#b91c1c">U</text>
  <rect x="565" y="195" width="70" height="40" rx="6" fill="#fef3c7" stroke="#b45309"/>
  <text x="600" y="220" font-size="15" font-weight="700" text-anchor="middle" fill="#92400e">C</text>
  <rect x="650" y="195" width="70" height="40" rx="6" fill="#eff6ff" stroke="#2563eb"/>
  <text x="685" y="220" font-size="15" font-weight="700" text-anchor="middle" fill="#1e3a8a">A</text>
  <text x="600" y="255" font-size="11" text-anchor="middle" fill="#4b5563">(three different codons at the 3rd position — all translated to the same amino acid)</text>
  <line x1="260" y1="199" x2="480" y2="199" stroke="#701a75" stroke-width="1.5" stroke-dasharray="3,3"/>
</g>

<rect x="30" y="278" width="800" height="34" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
<text x="430" y="300" font-size="12" font-weight="700" text-anchor="middle" fill="#92400e">What moves: only the 3rd codon base (= the 5' anticodon base) relaxes normal pairing rules — the other two bases still require exact pairing</text>
</svg>
