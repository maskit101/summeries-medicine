<svg class="diagram" viewBox="0 0 860 394" xmlns="http://www.w3.org/2000/svg">
<title>אזורי הערמונית: אזור מעברי (BPH) מול אזור היקפי (סרטן)</title>
<text x="430.0" y="20" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937" >חתך רוחב סכמטי של הערמונית</text>
<circle cx="300" cy="190" r="130" fill="#fce7f3" stroke="#a21caf" stroke-width="2"/>
<text x="300" y="50" font-size="11" font-weight="700" text-anchor="middle" fill="#701a75" >אזור היקפי (peripheral zone)</text>
<circle cx="300" cy="190" r="55" fill="#dbeafe" stroke="#2563eb" stroke-width="2.2"/>
<text x="300" y="170" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1e3a8a" >אזור מעברי</text>
<text x="300" y="184" font-size="9" font-weight="400" text-anchor="middle" fill="#1e3a8a" >(periurethral)</text>
<line x1="300" y1="55" x2="300" y2="325" stroke="#4b5563" stroke-width="6"/>
<text x="370" y="314" font-size="9.5" font-weight="400" text-anchor="middle" fill="#4b5563" >שופכה</text>
<rect x="560" y="50" width="260" height="120" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="690" y="72" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1e3a8a" >BPH — אזור מעברי</text>
<text x="690" y="94" font-size="9.8" font-weight="400" text-anchor="middle" fill="#1f2937" >נגרמת מהצטברות</text>
<text x="690" y="110" font-size="9.8" font-weight="700" text-anchor="middle" fill="#1e3a8a" >דיהידרוטסטוסטרון (DHT)</text>
<text x="690" y="132" font-size="9.8" font-weight="400" text-anchor="middle" fill="#1f2937" >לוחצת על השופכה</text>
<text x="690" y="150" font-size="9.8" font-weight="700" text-anchor="middle" fill="#1e3a8a" >→ קושי במתן שתן</text>
<rect x="560" y="185" width="260" height="120" rx="8" fill="#fce7f3" stroke="#a21caf" stroke-width="1.5"/>
<text x="690" y="207" font-size="11.3" font-weight="700" text-anchor="middle" fill="#701a75" >סרטן ערמונית — אזור היקפי</text>
<text x="690" y="229" font-size="9.8" font-weight="400" text-anchor="middle" fill="#1f2937" >מסלול נפרד לגמרי מ-BPH</text>
<text x="690" y="249" font-size="9.5" font-weight="400" text-anchor="middle" fill="#1f2937" >נבדק במישוש רקטלי (DRE) —</text>
<text x="690" y="267" font-size="9.5" font-weight="400" text-anchor="middle" fill="#1f2937" >קרוב לדופן הרקטום האחורית</text>
<text x="690" y="288" font-size="9.8" font-weight="700" text-anchor="middle" fill="#701a75" >→ אינו מעלה סיכון ל-BPH ולהפך</text>
<rect x="20" y="350" width="820" height="34" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
<text x="430.0" y="372" font-size="10.4" font-weight="700" text-anchor="middle" fill="#92400e" >מה "נמצא איפה": המיקום האנטומי בתוך הערמונית קובע גם מנגנון וגם ביטוי קליני שונים לחלוטין</text>
</svg>