<svg class="diagram" viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg" direction="ltr">
<title>קומפלקס חיבורי התא האפיתליאלי — מאפיקלי לבזאלי</title>
<text x="500" y="26" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2937">חיבורי תא אפיתליאלי — מאפיקלי (עליון) לבזאלי (תחתון)</text>
<text x="500" y="45" font-size="10.5" text-anchor="middle" fill="#4b5563">שני תאים אפיתליאליים סמוכים; ה-lumen האפיקלי למעלה, קרום הבסיס למטה</text>

<!-- two adjacent cell membranes as vertical lines -->
<line x1="330" y1="70" x2="330" y2="560" stroke="#9ca3af" stroke-width="3"/>
<line x1="670" y1="70" x2="670" y2="560" stroke="#9ca3af" stroke-width="3"/>
<text x="150" y="95" font-size="10.5" font-weight="700" fill="#4b5563">תא A</text>
<text x="850" y="95" font-size="10.5" font-weight="700" fill="#4b5563">תא B</text>
<text x="500" y="63" font-size="10" text-anchor="middle" fill="#4b5563">↑ Lumen (אפיקלי)</text>

<!-- Tight junction -->
<rect x="270" y="80" width="460" height="70" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<rect x="300" y="95" width="60" height="14" fill="#1e3a8a"/>
<rect x="640" y="95" width="60" height="14" fill="#1e3a8a"/>
<text x="500" y="105" font-size="12" font-weight="700" text-anchor="middle" fill="#1e3a8a">Tight Junction (Zonula Occludens)</text>
<text x="500" y="122" font-size="9.5" text-anchor="middle" fill="#1e3a8a">הכי אפיקלי — חוסם תנועה פארא-תאית; מורכב מ-claudins ו-occludins</text>
<text x="500" y="138" font-size="9" text-anchor="middle" fill="#1e3a8a">(מעכב מעבר חופשי של מומסים בין התאים)</text>

<!-- Adherens junction -->
<rect x="270" y="165" width="460" height="70" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
<rect x="300" y="180" width="60" height="14" fill="#065f46"/>
<rect x="640" y="180" width="60" height="14" fill="#065f46"/>
<text x="500" y="190" font-size="12" font-weight="700" text-anchor="middle" fill="#065f46">Adherens Junction (Zonula Adherens, Belt Desmosome)</text>
<text x="500" y="207" font-size="9.5" text-anchor="middle" fill="#065f46">"חגורה" המחברת שלד אקטין בין תאים דרך cadherins (תלויי Ca²⁺)</text>
<text x="500" y="223" font-size="9" text-anchor="middle" fill="#065f46">אובדן E-cadherin ← מקדם גרורות (metastasis)</text>

<!-- Desmosome -->
<rect x="270" y="250" width="460" height="70" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
<circle cx="330" cy="285" r="12" fill="#4c1d95"/>
<circle cx="670" cy="285" r="12" fill="#4c1d95"/>
<text x="500" y="273" font-size="12" font-weight="700" text-anchor="middle" fill="#4c1d95">Desmosome (Spot Desmosome, Macula Adherens)</text>
<text x="500" y="290" font-size="9.5" text-anchor="middle" fill="#4c1d95">תמיכה מבנית דרך אינטראקציית פילמנטים ביניימיים (keratin)</text>
<text x="500" y="306" font-size="9" text-anchor="middle" fill="#4c1d95">אוטואנטיגוף ל-desmoglein 3 (±1) ← Pemphigus vulgaris</text>

<!-- Gap junction -->
<rect x="270" y="335" width="460" height="65" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
<rect x="310" y="358" width="20" height="20" fill="#7f1d1d"/>
<rect x="670" y="358" width="20" height="20" fill="#7f1d1d"/>
<line x1="330" y1="368" x2="670" y2="368" stroke="#7f1d1d" stroke-width="4"/>
<text x="500" y="352" font-size="12" font-weight="700" text-anchor="middle" fill="#7f1d1d">Gap Junction</text>
<text x="500" y="390" font-size="9.5" text-anchor="middle" fill="#7f1d1d">תעלות קונקסון מאפשרות תקשורת חשמלית וכימית ישירה בין תאים</text>

<!-- Basal side label -->
<text x="500" y="422" font-size="11" font-weight="700" text-anchor="middle" fill="#1f2937">↓ צד בזאלי — חיבור לקרום הבסיס</text>

<!-- Hemidesmosome + Integrin -->
<rect x="270" y="435" width="460" height="90" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
<circle cx="360" cy="470" r="11" fill="#92400e"/>
<circle cx="500" cy="470" r="11" fill="#92400e"/>
<circle cx="640" cy="470" r="11" fill="#92400e"/>
<text x="500" y="453" font-size="12" font-weight="700" text-anchor="middle" fill="#92400e">Hemidesmosome + Integrins</text>
<text x="500" y="495" font-size="9.5" text-anchor="middle" fill="#78350f">Hemidesmosome: קושר קרטין בתא בזאלי לקרום הבסיס</text>
<text x="500" y="510" font-size="8.5" text-anchor="middle" fill="#78350f">אוטואנטיגוף ← Bullous pemphigoid ("down bullow")</text>

<!-- ECM / basement membrane strip -->
<rect x="270" y="530" width="460" height="30" rx="6" fill="#d97706"/>
<text x="500" y="550" font-size="9.5" font-weight="700" text-anchor="middle" fill="#fff7ed">Basement Membrane / ECM — קולגן, למינין, פיברונקטין (נקשר ע"י Integrins)</text>

<rect x="40" y="578" width="920" height="55" rx="8" fill="#111827"/>
<text x="500" y="600" font-size="10" font-weight="700" text-anchor="middle" fill="#f9fafb">רלוונטיות לכירורגיה פלסטית: פגיעה בדסמוזום/המידסמוזום = בלות ("blistering") מתחת לתחבושת/פלאפ</text>
<text x="500" y="618" font-size="9.5" text-anchor="middle" fill="#f9fafb">Pemphigus vulgaris (תוך-אפידרמלי, Nikolsky חיובי) לעומת Bullous pemphigoid (תת-אפידרמלי, יציב יותר)</text>
</svg>
