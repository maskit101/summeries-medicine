<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg class="diagram" viewBox="0 0 1000 420" xmlns="http://www.w3.org/2000/svg" direction="ltr">
<title>עומק זיהומי עור/רקמה רכה</title>
<text x="500" y="26" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2937">עומק זיהומי עור ורקמה רכה — מהשטחי לעמוק</text>
<text x="500" y="45" font-size="10.5" text-anchor="middle" fill="#4b5563">כל שכבה נחתכת ברוחב מלא כדי להמחיש את העומק האנטומי של כל אבחנה</text>

<rect x="60" y="65" width="880" height="38" rx="4" fill="#fef9c3" stroke="#a16207" stroke-width="1.5"/>
<text x="500" y="89" font-size="11.5" font-weight="700" text-anchor="middle" fill="#713f12">אפידרמיס — Impetigo (קרוסטה דבשית, S aureus/S pyogenes)</text>

<rect x="60" y="107" width="880" height="42" rx="4" fill="#fed7aa" stroke="#9a3412" stroke-width="1.5"/>
<text x="500" y="133" font-size="11.5" font-weight="700" text-anchor="middle" fill="#7c2d12">דרמיס עליון + לימפטיקה שטחית — Erysipelas (תיחום חד, S pyogenes)</text>

<rect x="60" y="153" width="880" height="48" rx="4" fill="#fdba74" stroke="#9a3412" stroke-width="1.5"/>
<text x="500" y="182" font-size="11.5" font-weight="700" text-anchor="middle" fill="#7c2d12">דרמיס עמוק + תת-עור — Cellulitis (מתפשט, S pyogenes/S aureus)</text>

<rect x="60" y="205" width="880" height="48" rx="4" fill="#fb923c" stroke="#9a3412" stroke-width="1.5"/>
<text x="500" y="234" font-size="11.5" font-weight="700" text-anchor="middle" fill="#fff7ed">שכבות עמוקות, מוקף-קפסולה — Abscess (מוגלה, S aureus)</text>

<rect x="60" y="257" width="880" height="56" rx="4" fill="#7f1d1d" stroke="#450a0a" stroke-width="1.5"/>
<text x="500" y="283" font-size="11.5" font-weight="700" text-anchor="middle" fill="#fef2f2">פציה — Necrotizing Fasciitis (כאב מוגזם, קרפיטוס, חירום כירורגי)</text>
<text x="500" y="300" font-size="9" text-anchor="middle" fill="#fecaca">אנאירוביים / S pyogenes / S aureus (MRSA) — "flesh-eating bacteria"</text>

<rect x="60" y="328" width="880" height="72" rx="8" fill="#f8fafc" stroke="#9ca3af" stroke-width="1"/>
<text x="500" y="350" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1f2937">חוק אצבע: עומק הזיהום ↑ ← חומרה ↑ ← דחיפות התערבות כירורגית ↑</text>
<text x="500" y="370" font-size="9.5" text-anchor="middle" fill="#1f2937">כאב "מוגזם ביחס לבדיקה הגופנית" הוא הדגל האדום הקלאסי ל-necrotizing fasciitis</text>
<text x="500" y="388" font-size="9.5" text-anchor="middle" fill="#1f2937">(העצבים נהרסים לפני שהעור נראה חריג — ייתכן מראה חיצוני מטעה)</text>
</svg>