<svg class="diagram" viewBox="0 0 860 380" xmlns="http://www.w3.org/2000/svg" direction="ltr">
<title>Genomic imprinting: Prader-Willi vs Angelman syndrome</title>
<text x="430" y="24" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1f2937">Chromosome 15q11-13: one parental copy is normally silenced by methylation</text>

<rect x="30" y="48" width="800" height="80" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
<text x="430" y="68" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1f2937">Normal individual &#8212; both parental chromosomes present, one region imprinted</text>
<rect x="230" y="78" width="110" height="34" rx="6" fill="#eff6ff" stroke="#2563eb"/>
<text x="285" y="99" font-size="11" font-weight="700" text-anchor="middle" fill="#1e3a8a">P (paternal)</text>
<text x="285" y="122" font-size="9" text-anchor="middle" fill="#4b5563">active (most genes)</text>
<rect x="520" y="78" width="110" height="34" rx="6" fill="#fce7f3" stroke="#be185d"/>
<text x="575" y="99" font-size="11" font-weight="700" text-anchor="middle" fill="#831843">M (maternal)</text>
<text x="575" y="122" font-size="9" text-anchor="middle" fill="#4b5563">active (UBE3A)</text>

<path d="M 210 148 L 210 168" stroke="#4b5563" stroke-width="2" marker-end="url(#impArrEn1)"/>
<path d="M 650 148 L 650 168" stroke="#4b5563" stroke-width="2" marker-end="url(#impArrEn1)"/>
<defs><marker id="impArrEn1" markerWidth="10" markerHeight="10" refX="5" refY="8" orient="auto"><polygon points="0,0 5,9 10,0" fill="#4b5563"/></marker></defs>
<text x="210" y="145" font-size="10" text-anchor="middle" fill="#7f1d1d">paternal allele lost/mutated</text>
<text x="650" y="145" font-size="10" text-anchor="middle" fill="#7f1d1d">maternal allele lost/mutated</text>

<rect x="45" y="172" width="330" height="185" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="210" y="195" font-size="12.5" font-weight="700" text-anchor="middle" fill="#7f1d1d">Prader-Willi syndrome</text>
<rect x="130" y="205" width="65" height="30" rx="5" fill="#e5e7eb" stroke="#6b7280"/>
<text x="162" y="225" font-size="10" text-anchor="middle" fill="#374151">P: deleted/mutated</text>
<rect x="225" y="205" width="65" height="30" rx="5" fill="#fce7f3" stroke="#be185d"/>
<text x="257" y="225" font-size="9.5" text-anchor="middle" fill="#831843">M: silenced</text>
<text x="210" y="256" font-size="10" text-anchor="middle" fill="#7f1d1d">maternal genes normally silenced &#8594;</text>
<text x="210" y="272" font-size="10" font-weight="700" text-anchor="middle" fill="#7f1d1d">no active copy at all</text>
<text x="210" y="294" font-size="9.5" text-anchor="middle" fill="#7f1d1d">Hyperphagia, obesity, intellectual</text>
<text x="210" y="309" font-size="9.5" text-anchor="middle" fill="#7f1d1d">disability, hypogonadism, hypotonia</text>
<text x="210" y="330" font-size="9.5" font-weight="700" text-anchor="middle" fill="#7f1d1d">25% = maternal uniparental disomy</text>
<text x="210" y="347" font-size="9" text-anchor="middle" fill="#7f1d1d">"POP": Paternal allele deleted &#8594; Obesity, Prader-willi</text>

<rect x="485" y="172" width="330" height="185" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
<text x="650" y="195" font-size="12.5" font-weight="700" text-anchor="middle" fill="#065f46">Angelman syndrome</text>
<rect x="570" y="205" width="65" height="30" rx="5" fill="#eff6ff" stroke="#2563eb"/>
<text x="602" y="225" font-size="9.5" text-anchor="middle" fill="#1e3a8a">P: silenced (UBE3A)</text>
<rect x="665" y="205" width="65" height="30" rx="5" fill="#e5e7eb" stroke="#6b7280"/>
<text x="697" y="225" font-size="10" text-anchor="middle" fill="#374151">M: deleted/mutated</text>
<text x="650" y="256" font-size="10" text-anchor="middle" fill="#065f46">paternal UBE3A normally silenced &#8594;</text>
<text x="650" y="272" font-size="10" font-weight="700" text-anchor="middle" fill="#065f46">no active UBE3A copy</text>
<text x="650" y="294" font-size="9.5" text-anchor="middle" fill="#065f46">HAILS: Hand-flapping, Ataxia,</text>
<text x="650" y="309" font-size="9.5" text-anchor="middle" fill="#065f46">Intellectual disability, Laughter, Seizures</text>
<text x="650" y="330" font-size="9.5" font-weight="700" text-anchor="middle" fill="#065f46">5% = paternal uniparental disomy</text>
<text x="650" y="347" font-size="9" text-anchor="middle" fill="#065f46">"MAMAS": Maternal allele deleted, Angelman</text>
</svg>
