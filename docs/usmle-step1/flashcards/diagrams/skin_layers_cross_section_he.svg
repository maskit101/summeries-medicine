<svg class="diagram" viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" direction="ltr">
<title>שכבות העור — אפידרמיס, דרמיס, תת-עור</title>
<text x="500" y="26" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2937">שכבות העור — אפידרמיס (5 שכבות), דרמיס, תת-עור (היפודרמיס)</text>
<text x="500" y="45" font-size="10.5" text-anchor="middle" fill="#4b5563">מנמוניקה (שטחי→עמוק): "Come, Let's Get Sun Burned"</text>

<!-- Epidermis block: 5 sublayers, superficial (top) to deep (bottom) -->
<rect x="60" y="65" width="430" height="330" rx="8" fill="#fff7ed" stroke="#9a3412" stroke-width="1.5"/>
<text x="275" y="88" font-size="12.5" font-weight="700" text-anchor="middle" fill="#7c2d12">אפידרמיס (Epidermis)</text>

<rect x="80" y="100" width="390" height="48" rx="6" fill="#fde68a" stroke="#92400e" stroke-width="1.5"/>
<text x="275" y="120" font-size="11.5" font-weight="700" text-anchor="middle" fill="#78350f">Stratum Corneum</text>
<text x="275" y="136" font-size="9" text-anchor="middle" fill="#78350f">תאים מתים, קרטין — מחסום מים/חיידקים ("Come")</text>

<rect x="80" y="152" width="390" height="40" rx="6" fill="#fcd34d" stroke="#92400e" stroke-width="1.5"/>
<text x="275" y="170" font-size="11" font-weight="700" text-anchor="middle" fill="#78350f">Stratum Lucidum</text>
<text x="275" y="184" font-size="8.5" text-anchor="middle" fill="#78350f">רק בעור עבה (כף יד/רגל) ("Let's")</text>

<rect x="80" y="196" width="390" height="44" rx="6" fill="#fbbf24" stroke="#92400e" stroke-width="1.5"/>
<text x="275" y="216" font-size="11" font-weight="700" text-anchor="middle" fill="#78350f">Stratum Granulosum</text>
<text x="275" y="231" font-size="8.5" text-anchor="middle" fill="#78350f">גרגירי קרטוהיאלין — התחלת קרטיניזציה ("Get")</text>

<rect x="80" y="244" width="390" height="48" rx="6" fill="#f59e0b" stroke="#92400e" stroke-width="1.5"/>
<text x="275" y="264" font-size="11" font-weight="700" text-anchor="middle" fill="#78350f">Stratum Spinosum</text>
<text x="275" y="280" font-size="8.5" text-anchor="middle" fill="#78350f">דסמוזומים ("קוצים") מחברים קרטינוציטים ("Sun")</text>

<rect x="80" y="296" width="390" height="60" rx="6" fill="#d97706" stroke="#78350f" stroke-width="1.5"/>
<text x="275" y="318" font-size="11.5" font-weight="700" text-anchor="middle" fill="#fff7ed">Stratum Basale</text>
<text x="275" y="335" font-size="8.5" text-anchor="middle" fill="#fff7ed">שכבה גרמינטיבית — תאי גזע מתחלקים,</text>
<text x="275" y="348" font-size="8.5" text-anchor="middle" fill="#fff7ed">מקור לגריפט עור מפוצל (split-thickness)</text>

<rect x="80" y="362" width="390" height="26" rx="4" fill="#fed7aa" stroke="#9a3412" stroke-width="1"/>
<text x="275" y="379" font-size="9" font-weight="700" text-anchor="middle" fill="#7c2d12">קרום בסיס (Basement Membrane) ↓ חיבור להמידסמוזומים</text>

<!-- Dermis + subcutaneous -->
<rect x="520" y="65" width="420" height="170" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="730" y="90" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1e3a8a">דרמיס (Dermis)</text>
<text x="730" y="112" font-size="9.5" text-anchor="middle" fill="#1e3a8a">קולגן (I&gt;III) + אלסטין + כלי דם/עצבים</text>
<text x="730" y="130" font-size="9.5" text-anchor="middle" fill="#1e3a8a">זקיקי שיער, בלוטות זיעה/חלב</text>
<text x="730" y="152" font-size="9.5" font-weight="700" text-anchor="middle" fill="#1e3a8a">בגריפט עור מלא (full-thickness)</text>
<text x="730" y="168" font-size="9.5" font-weight="700" text-anchor="middle" fill="#1e3a8a">נלקחת האפידרמיס + כל הדרמיס</text>
<text x="730" y="190" font-size="9" text-anchor="middle" fill="#1e3a8a">סקלרודרמה: פיברוזיס/עיבוי הדרמיס</text>
<text x="730" y="208" font-size="9" text-anchor="middle" fill="#1e3a8a">→ עור מתוח, נוקשה, ללא קמטים</text>

<rect x="520" y="245" width="420" height="150" rx="8" fill="#fef9c3" stroke="#a16207" stroke-width="1.5"/>
<text x="730" y="270" font-size="12.5" font-weight="700" text-anchor="middle" fill="#713f12">תת-עור / היפודרמיס (Hypodermis, Subcutis)</text>
<text x="730" y="292" font-size="9.5" text-anchor="middle" fill="#713f12">רקמת שומן — בידוד תרמי, אגירת אנרגיה,</text>
<text x="730" y="308" font-size="9.5" text-anchor="middle" fill="#713f12">ריפוד מכני</text>
<text x="730" y="330" font-size="9.5" font-weight="700" text-anchor="middle" fill="#713f12">רלוונטי לתכנון פלאפים (fasciocutaneous/</text>
<text x="730" y="346" font-size="9.5" font-weight="700" text-anchor="middle" fill="#713f12">adipofascial) ולעובי הרקמה בסגירת פצע</text>

<!-- Graft-depth legend -->
<rect x="520" y="410" width="420" height="90" rx="8" fill="#f8fafc" stroke="#9ca3af" stroke-width="1"/>
<text x="730" y="432" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1f2937">עומק גריפט עור — הבסיס האנטומי לניתוח פלסטי</text>
<text x="730" y="452" font-size="9" text-anchor="middle" fill="#1f2937">Split-thickness graft: אפידרמיס + חלק מהדרמיס</text>
<text x="730" y="468" font-size="9" text-anchor="middle" fill="#1f2937">(משאיר stratum basale במקור לריפוי ספונטני)</text>
<text x="730" y="486" font-size="9" text-anchor="middle" fill="#1f2937">Full-thickness graft: אפידרמיס + כל הדרמיס (ללא ריפוי מקור)</text>

<rect x="60" y="410" width="430" height="90" rx="8" fill="#f8fafc" stroke="#9ca3af" stroke-width="1"/>
<text x="275" y="432" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1f2937">3 שכבות העור בסך הכל</text>
<text x="275" y="452" font-size="9" text-anchor="middle" fill="#1f2937">1. אפידרמיס (5 תת-שכבות) → 2. דרמיס → </text>
<text x="275" y="468" font-size="9" text-anchor="middle" fill="#1f2937">3. תת-עור (היפודרמיס/סאבקוטיס)</text>
<text x="275" y="486" font-size="9" text-anchor="middle" fill="#1f2937">stratum basale = מקור אבחיה, קובע "graft take"</text>

<rect x="60" y="515" width="880" height="35" rx="8" fill="#111827"/>
<text x="500" y="538" font-size="10.5" font-weight="700" text-anchor="middle" fill="#f9fafb">חשוב לכירורגיה פלסטית: גבול אפידרמיס-דרמיס הוא בדיוק קו החיתוך שמגדיר עומק כל גריפט עור</text>
</svg>
