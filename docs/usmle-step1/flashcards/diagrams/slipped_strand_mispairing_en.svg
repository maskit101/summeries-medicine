<text x="430.0" y="136" font-size="11" font-weight="700" text-anchor="middle" fill="#b45309" >during replication, the new strand "slips" and repairs at the wrong repeat unit</text>
<rect x="265.0" y="160" width="49" height="30" rx="4" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/>
<text x="289.5" y="180" font-size="11.5" font-weight="700" text-anchor="middle" fill="#92400e" >CAG</text>
