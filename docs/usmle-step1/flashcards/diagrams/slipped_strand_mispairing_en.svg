<text x="150.0" y="285" font-size="12" font-weight="700" text-anchor="middle" fill="#2563eb" >Parent: CAG×20</text>
<line x1="270" y1="280" x2="290" y2="280" stroke="#4b5563" stroke-width="2.5"/><polygon points="288,273 288,287 300,280" fill="#4b5563"/>
<rect x="300" y="260" width="240" height="40" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="420.0" y="285" font-size="12" font-weight="700" text-anchor="middle" fill="#b45309" >Child: CAG×35</text>
<line x1="540" y1="280" x2="560" y2="280" stroke="#4b5563" stroke-width="2.5"/><polygon points="558,273 558,287 570,280" fill="#4b5563"/>
<rect x="570" y="260" width="240" height="40" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="690.0" y="285" font-size="12" font-weight="700" text-anchor="middle" fill="#b91c1c" >Grandchild: CAG×55</text>
<text x="430.0" y="316" font-size="10.6" font-weight="700" text-anchor="middle" fill="#7f1d1d" >more repeats ⇒ Huntington disease presents earlier and more severely each generation</text>
<rect x="20" y="342" width="820" height="34" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
<text x="430.0" y="364" font-size="10.2" font-weight="700" text-anchor="middle" fill="#92400e" >What "moves": the newly made strand slips back/forward on the template because repeat units are internally homologous, adding/deleting a whole unit</text>
</svg>