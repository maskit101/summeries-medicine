<circle cx="454.5" cy="138" r="20" fill="#fee2e2" stroke="#b91c1c" stroke-width="2" stroke-dasharray="4,3"/>
<text x="454.5" y="142" font-size="9" font-weight="700" text-anchor="middle" fill="#b91c1c" >CAG</text>
<text x="454.5" y="118" font-size="8.8" font-weight="400" text-anchor="middle" fill="#b91c1c" >extra loop — one extra repeat</text>
<rect x="485.0" y="160" width="49" height="30" rx="4" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/>
