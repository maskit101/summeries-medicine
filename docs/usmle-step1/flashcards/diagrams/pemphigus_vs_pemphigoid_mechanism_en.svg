<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg class="diagram" viewBox="0 0 1000 480" xmlns="http://www.w3.org/2000/svg" direction="ltr">
<title>Pemphigus Vulgaris vs Bullous Pemphigoid — mechanism and depth of split</title>
<text x="500" y="26" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2937">Pemphigus Vulgaris vs Bullous Pemphigoid — same presentation (blisters), opposite depth</text>
<text x="500" y="45" font-size="10.5" text-anchor="middle" fill="#4b5563">Two panels: the same 6 epidermis/dermis layers; red marks where the split actually occurs</text>

<rect x="55" y="70" width="430" height="20" fill="none"/>
<text x="270" y="88" font-size="12.5" font-weight="700" text-anchor="middle" fill="#9f1239">Pemphigus Vulgaris</text>

<rect x="80" y="105" width="390" height="30" rx="4" fill="#fde68a" stroke="#92400e" stroke-width="1.5"/>
<text x="275" y="124" font-size="10" text-anchor="middle" fill="#78350f">Stratum Corneum</text>

<rect x="80" y="139" width="390" height="30" rx="4" fill="#fcd34d" stroke="#92400e" stroke-width="1.5"/>
<text x="275" y="158" font-size="10" text-anchor="middle" fill="#78350f">Stratum Lucidum</text>

<rect x="80" y="173" width="390" height="30" rx="4" fill="#f59e0b" stroke="#92400e" stroke-width="1.5"/>
<text x="275" y="192" font-size="10" text-anchor="middle" fill="#78350f">Stratum Granulosum</text>

<rect x="80" y="207" width="390" height="30" rx="4" fill="#dc2626" stroke="#7f1d1d" stroke-width="2.5"/>
<text x="275" y="222" font-size="9.5" font-weight="700" text-anchor="middle" fill="#fff">⚡ SPLIT HERE — Stratum Spinosum</text>
<text x="275" y="233" font-size="8" text-anchor="middle" fill="#fee2e2">(suprabasal, acantholysis)</text>

<rect x="80" y="241" width="390" height="30" rx="4" fill="#d97706" stroke="#78350f" stroke-width="1.5"/>
<text x="275" y="260" font-size="10" text-anchor="middle" fill="#fff7ed">Stratum Basale (intact)</text>

<rect x="80" y="275" width="390" height="30" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="275" y="294" font-size="9.5" text-anchor="middle" fill="#1e3a8a">Dermis — not involved</text>

<rect x="80" y="313" width="390" height="100" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="275" y="332" font-size="10" font-weight="700" text-anchor="middle" fill="#7f1d1d">Mechanism: IgG against Desmoglein 3 (±1)</text>
<text x="275" y="348" font-size="8.5" text-anchor="middle" fill="#7f1d1d">Binds desmosomes linking keratinocytes in the stratum spinosum</text>
<text x="275" y="362" font-size="8.5" text-anchor="middle" fill="#7f1d1d">Disrupts cell-cell adhesion → acantholysis → flaccid intraepidermal bullae</text>
<text x="275" y="378" font-size="8.5" font-weight="700" text-anchor="middle" fill="#7f1d1d">Nikolsky (+) • oral mucosa involved • "row of tombstones" on H&amp;E</text>
<text x="275" y="396" font-size="8.5" text-anchor="middle" fill="#7f1d1d">Immunofluorescence: reticular ("chicken-wire") pattern around epidermal cells</text>

<rect x="520" y="70" width="420" height="20" fill="none"/>
<text x="730" y="88" font-size="12.5" font-weight="700" text-anchor="middle" fill="#9f1239">Bullous Pemphigoid — for comparison</text>

<rect x="540" y="105" width="390" height="30" rx="4" fill="#fde68a" stroke="#92400e" stroke-width="1.5"/>
<text x="735" y="124" font-size="10" text-anchor="middle" fill="#78350f">Stratum Corneum</text>

<rect x="540" y="139" width="390" height="30" rx="4" fill="#fcd34d" stroke="#92400e" stroke-width="1.5"/>
<text x="735" y="158" font-size="10" text-anchor="middle" fill="#78350f">Stratum Lucidum</text>

<rect x="540" y="173" width="390" height="30" rx="4" fill="#f59e0b" stroke="#92400e" stroke-width="1.5"/>
<text x="735" y="192" font-size="10" text-anchor="middle" fill="#78350f">Stratum Granulosum</text>

<rect x="540" y="207" width="390" height="30" rx="4" fill="#fbbf24" stroke="#92400e" stroke-width="1.5"/>
<text x="735" y="226" font-size="10" text-anchor="middle" fill="#78350f">Stratum Spinosum (intact)</text>

<rect x="540" y="241" width="390" height="30" rx="4" fill="#d97706" stroke="#78350f" stroke-width="1.5"/>
<text x="735" y="260" font-size="10" text-anchor="middle" fill="#fff7ed">Stratum Basale (intact)</text>

<rect x="540" y="275" width="390" height="30" rx="4" fill="#dc2626" stroke="#7f1d1d" stroke-width="2.5"/>
<text x="735" y="290" font-size="9.5" font-weight="700" text-anchor="middle" fill="#fff">⚡ SPLIT HERE — Hemidesmosome</text>
<text x="735" y="301" font-size="8" text-anchor="middle" fill="#fee2e2">(basement membrane, subepidermal)</text>

<rect x="540" y="313" width="390" height="100" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="735" y="332" font-size="10" font-weight="700" text-anchor="middle" fill="#7f1d1d">Mechanism: IgG against hemidesmosomes (BPAG1/2)</text>
<text x="735" y="348" font-size="8.5" text-anchor="middle" fill="#7f1d1d">Binds proteins anchoring basal keratinocytes to the basement membrane</text>
<text x="735" y="362" font-size="8.5" text-anchor="middle" fill="#7f1d1d">Separates the entire epidermis from the dermis → tense subepidermal bulla</text>
<text x="735" y="378" font-size="8.5" font-weight="700" text-anchor="middle" fill="#7f1d1d">Nikolsky (−) • oral mucosa spared • bulla contains eosinophils</text>
<text x="735" y="396" font-size="8.5" text-anchor="middle" fill="#7f1d1d">Immunofluorescence: linear pattern along the epidermal-dermal junction</text>

<rect x="60" y="430" width="880" height="38" rx="8" fill="#111827"/>
<text x="500" y="450" font-size="10" font-weight="700" text-anchor="middle" fill="#f9fafb">PV: intraepidermal/high (suprabasal), less stable, Nikolsky (+) — BP: subepidermal/low, more stable, Nikolsky (−)</text>
<text x="500" y="462" font-size="8.5" text-anchor="middle" fill="#9ca3af">Mnemonic: Bullous pemphigoid antibodies "bullow" (knock down) the epidermis from below; in Pemphigus, cell-cell adhesion itself fails from within</text>
</svg>
