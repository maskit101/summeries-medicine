<svg class="diagram" viewBox="0 0 860 300" xmlns="http://www.w3.org/2000/svg">
<title>דה-אמינציה של אדנוזין ל-אינוזין ע"י ADA, וההשלכה במחסור</title>
<text x="430" y="24" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2937">מה בדיוק "זז" במולקולה: אדנוזין ← אינוזין</text>

<!-- Adenosine molecule (purine ring) -->
<g>
  <text x="150" y="55" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1e3a8a">אדנוזין (Adenosine)</text>
  <!-- 6-membered ring -->
  <polygon points="120,90 160,90 180,125 160,160 120,160 100,125" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <!-- fused 5-membered ring -->
  <polygon points="180,125 220,110 245,140 225,172 190,160" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <!-- N1 ring atoms labels -->
  <text x="140" y="112" font-size="10" text-anchor="middle" fill="#1e3a8a">N1</text>
  <text x="140" y="145" font-size="10" text-anchor="middle" fill="#1e3a8a">C6</text>
  <!-- amino substituent highlighted -->
  <circle cx="95" cy="145" r="20" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="95" y="149" font-size="12" font-weight="700" text-anchor="middle" fill="#b91c1c">NH₂</text>
  <line x1="100" y1="140" x2="118" y2="150" stroke="#b91c1c" stroke-width="2"/>
  <text x="95" y="180" font-size="10.5" text-anchor="middle" fill="#7f1d1d">קבוצת אמינו ב-C6</text>
  <text x="200" y="195" font-size="10" text-anchor="middle" fill="#1e3a8a">(+ ריבוז — לא מסומן)</text>
</g>

<!-- Arrow with enzyme -->
<g>
  <polygon points="330,120 390,120 390,108 420,130 390,152 390,140 330,140" fill="#047857"/>
  <text x="375" y="100" font-size="12.5" font-weight="700" text-anchor="middle" fill="#065f46">ADA</text>
  <text x="375" y="172" font-size="10.5" text-anchor="middle" fill="#065f46">+H₂O</text>
  <text x="375" y="188" font-size="10.5" font-weight="700" text-anchor="middle" fill="#b91c1c">משחרר NH₃</text>
</g>

<!-- Inosine molecule -->
<g>
  <text x="650" y="55" font-size="12.5" font-weight="700" text-anchor="middle" fill="#065f46">אינוזין (Inosine)</text>
  <polygon points="620,90 660,90 680,125 660,160 620,160 600,125" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <polygon points="680,125 720,110 745,140 725,172 690,160" fill="#d1fae5" stroke="#047857" stroke-width="2"/>
  <text x="640" y="112" font-size="10" text-anchor="middle" fill="#065f46">N1</text>
  <text x="640" y="145" font-size="10" text-anchor="middle" fill="#065f46">C6</text>
  <!-- keto substituent highlighted, same position as NH2 was -->
  <circle cx="595" cy="145" r="20" fill="#d1fae5" stroke="#047857" stroke-width="2"/>
  <text x="595" y="149" font-size="13" font-weight="700" text-anchor="middle" fill="#047857">=O</text>
  <line x1="600" y1="140" x2="618" y2="150" stroke="#047857" stroke-width="2"/>
  <text x="595" y="180" font-size="10.5" text-anchor="middle" fill="#065f46">אותה עמדה (C6): עכשיו קבוצת קטו</text>
</g>

<!-- explanation strip -->
<rect x="30" y="220" width="800" height="60" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
<text x="430" y="242" font-size="12" font-weight="700" text-anchor="middle" fill="#92400e">מה בדיוק זז: ה-NH₂ שעל פחמן C6 בטבעת הפורין מוחלף בקבוצת קטו (=O); מולקולת המים "תורמת" את החמצן, והחנקן עוזב כאמוניה (NH₃)</text>
<text x="430" y="262" font-size="11.5" text-anchor="middle" fill="#92400e">במחסור ב-ADA: התהליך הזה לא קורה → דאוקסיאדנוזין מצטבר → הופך ל-dATP → מעכב ריבונוקלאוטיד רדוקטאז → פגיעה בלימפוציטים</text>
</svg>
