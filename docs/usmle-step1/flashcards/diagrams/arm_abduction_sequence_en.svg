<svg class="diagram" viewBox="0 0 940 400" xmlns="http://www.w3.org/2000/svg" direction="ltr">
<title>Arm abduction sequence and rotator cuff muscles (SItS)</title>
<text x="470" y="26" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2937">Arm Abduction Sequence — Muscles and Nerves by Degree (SALT)</text>

<g>
<rect x="20" y="60" width="215" height="230" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
<text x="127" y="84" font-size="12" font-weight="700" text-anchor="middle" fill="#065f46">0°–15°</text>
<line x1="127" y1="230" x2="127" y2="150" stroke="#334155" stroke-width="6"/>
<line x1="127" y1="230" x2="150" y2="215" stroke="#34d399" stroke-width="6"/>
<text x="127" y="255" font-size="10" font-weight="700" text-anchor="middle" fill="#065f46">Supraspinatus</text>
<text x="127" y="272" font-size="9" text-anchor="middle" fill="#065f46">n. Suprascapular</text>
</g>

<g>
<rect x="248" y="60" width="215" height="230" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="355" y="84" font-size="12" font-weight="700" text-anchor="middle" fill="#92400e">15°–90°</text>
<line x1="355" y1="230" x2="355" y2="150" stroke="#334155" stroke-width="6"/>
<line x1="355" y1="230" x2="400" y2="165" stroke="#fbbf24" stroke-width="6"/>
<text x="355" y="255" font-size="10" font-weight="700" text-anchor="middle" fill="#92400e">Deltoid</text>
<text x="355" y="272" font-size="9" text-anchor="middle" fill="#92400e">n. Axillary</text>
</g>

<g>
<rect x="476" y="60" width="215" height="230" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="583" y="84" font-size="12" font-weight="700" text-anchor="middle" fill="#1e3a8a">&gt;90° (a)</text>
<line x1="583" y1="230" x2="583" y2="150" stroke="#334155" stroke-width="6"/>
<line x1="583" y1="230" x2="620" y2="120" stroke="#93c5fd" stroke-width="6"/>
<text x="583" y="255" font-size="10" font-weight="700" text-anchor="middle" fill="#1e3a8a">Trapezius</text>
<text x="583" y="272" font-size="9" text-anchor="middle" fill="#1e3a8a">n. Accessory (CN XI)</text>
</g>

<g>
<rect x="704" y="60" width="215" height="230" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
<text x="811" y="84" font-size="12" font-weight="700" text-anchor="middle" fill="#4c1d95">&gt;90° (b)</text>
<line x1="811" y1="230" x2="811" y2="150" stroke="#334155" stroke-width="6"/>
<line x1="811" y1="230" x2="850" y2="115" stroke="#c4b5fd" stroke-width="6"/>
<text x="811" y="255" font-size="10" font-weight="700" text-anchor="middle" fill="#4c1d95">Serratus Anterior</text>
<text x="811" y="272" font-size="9" text-anchor="middle" fill="#4c1d95">n. Long Thoracic</text>
</g>

<rect x="20" y="310" width="899" height="68" rx="8" fill="#f8fafc" stroke="#9ca3af" stroke-width="1"/>
<text x="470" y="332" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1f2937">SALT: Supraspinatus → Axillary(deltoid) → Long thoracic(serratus ant.) → Trapezius — abduction handoff as the arm rises</text>
<text x="470" y="352" font-size="9.5" text-anchor="middle" fill="#1f2937">Rotator cuff = SItS: Supraspinatus, Infraspinatus, teres minor (all suprascapular/axillary n.) + Subscapularis — stabilize the shoulder joint</text>
</svg>
