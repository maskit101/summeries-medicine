<svg class="diagram" viewBox="0 0 860 467" xmlns="http://www.w3.org/2000/svg">
<title>מנגנון הספליציאוזום: חיתוך GU...AG ויצירת לריאט</title>
<text x="430.0" y="20" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1f2937" >תעתיק ראשוני (hnRNA) — שימו לב לשני זוגות 5'/3' שונים!</text>
<rect x="40" y="44" width="780" height="50" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
<text x="58" y="66" font-size="9.3" font-weight="700" text-anchor="start" fill="#4b5563" >5' (של כל התעתוק)</text>
<rect x="90" y="74" width="110" height="16" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
<text x="145" y="86" font-size="9.6" font-weight="700" text-anchor="middle" fill="#1e3a8a" >אקסון 1</text>
<rect x="220" y="52" width="400" height="38" rx="5" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.3"/>
<text x="260" y="66" font-size="11" font-weight="700" text-anchor="middle" fill="#b91c1c" >5'-GU</text>
<text x="420" y="66" font-size="10" font-weight="400" text-anchor="middle" fill="#7f1d1d" >אינטרון</text>
<circle cx="420" cy="75" r="4" fill="#b91c1c"/>
<text x="420" y="85" font-size="8.6" font-weight="400" text-anchor="middle" fill="#7f1d1d" >▲ נקודת ענף (A)</text>
<text x="580" y="66" font-size="11" font-weight="700" text-anchor="middle" fill="#b91c1c" >AG-3'</text>
<rect x="650" y="74" width="110" height="16" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
<text x="705" y="86" font-size="9.6" font-weight="700" text-anchor="middle" fill="#1e3a8a" >אקסון 2</text>
<text x="802" y="66" font-size="9.3" font-weight="700" text-anchor="end" fill="#4b5563" >(של כל התעתוק) 3'</text>
<rect x="230" y="108" width="400" height="30" rx="6" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2"/>
<text x="430" y="128" font-size="9.2" font-weight="700" text-anchor="middle" fill="#92400e" >לעומת זאת: GU = 5' של האינטרון עצמו, AG = 3' של האינטרון עצמו — לא של כל התעתוק!</text>
<line x1="20" y1="152" x2="840" y2="152" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="430.0" y="168" font-size="11" font-weight="700" text-anchor="middle" fill="#1f2937" >שלב 1: U1 snRNP נקשר ל-5' splice site; U2 נקשר לנקודת הענף</text>
<text x="430.0" y="194" font-size="11" font-weight="700" text-anchor="middle" fill="#1f2937" >שלב 2: חיתוך ראשון ב-GU — קצה 5' של האינטרון נקשר לנקודת הענף ויוצר לולאת לריאט</text>
<circle cx="420" cy="271" r="42" fill="#fce7f3" stroke="#a21caf" stroke-width="2.5" stroke-dasharray="6,3"/>
<text x="420" y="267" font-size="11" font-weight="700" text-anchor="middle" fill="#701a75" >לריאט</text>
<text x="420" y="285" font-size="8.8" font-weight="400" text-anchor="middle" fill="#701a75" >(אינטרון בצורת לולאה)</text>
<rect x="90" y="256" width="110" height="30" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
<text x="145" y="275" font-size="10" font-weight="700" text-anchor="middle" fill="#1e3a8a" >אקסון 1</text>
<rect x="650" y="256" width="110" height="30" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
<text x="705" y="275" font-size="10" font-weight="700" text-anchor="middle" fill="#1e3a8a" >אקסון 2</text>
<text x="430.0" y="333" font-size="11" font-weight="700" text-anchor="middle" fill="#1f2937" >שלב 3: חיתוך שני ב-AG — האקסונים מתחברים, הלריאט משתחרר ומתפרק</text>
<rect x="90" y="359" width="110" height="30" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
<text x="145" y="379" font-size="10" font-weight="700" text-anchor="middle" fill="#1e3a8a" >אקסון 1</text>
<line x1="200" y1="374" x2="650" y2="374" stroke="#2563eb" stroke-width="3"/>
<text x="430" y="368" font-size="10" font-weight="700" text-anchor="middle" fill="#1e3a8a" >mRNA בשל</text>
<rect x="650" y="359" width="110" height="30" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
<text x="705" y="379" font-size="10" font-weight="700" text-anchor="middle" fill="#1e3a8a" >אקסון 2</text>
<rect x="20" y="413" width="820" height="44" rx="8" fill="#fce7f3" stroke="#a21caf" stroke-width="1.5"/>
<text x="430.0" y="431" font-size="10.6" font-weight="700" text-anchor="middle" fill="#701a75" >↓ SMN חלבון חסר → הרכבת snRNP לקויה → ניוון קרן קדמית → SMA ("תינוק רפוי")</text>
<text x="430.0" y="447" font-size="9.6" font-weight="400" text-anchor="middle" fill="#701a75" >נוגדני אנטי-U1 snRNP: SLE ומחלת רקמת חיבור מעורבת</text>
</svg>