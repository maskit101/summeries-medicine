<svg class="diagram" viewBox="0 0 860 300" xmlns="http://www.w3.org/2000/svg">
<title>פגיעה מרדיקלים חופשיים: יצירה, נזק, וניטרול</title>
<text x="430" y="24" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1f2937">מקורות רדיקלים חופשיים מול האנזימים/נוגדי-החמצון שמנטרלים אותם</text>

<rect x="20" y="50" width="380" height="130" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="210" y="72" font-size="12.5" font-weight="700" text-anchor="middle" fill="#7f1d1d">יצירה</text>
<text x="210" y="92" font-size="10.5" text-anchor="middle" fill="#1f2937">חשיפה לקרינה (למשל טיפול אונקולוגי)</text>
<text x="210" y="110" font-size="10.5" text-anchor="middle" fill="#1f2937">מטבוליזם תרופות (פאזה I) / תגובות רדוקס</text>
<text x="210" y="128" font-size="10.5" text-anchor="middle" fill="#1f2937">תחמוצת חנקן (דלקת)</text>
<text x="210" y="146" font-size="10.5" text-anchor="middle" fill="#1f2937">מתכות מעבר (תגובת Fenton)</text>
<text x="210" y="164" font-size="10.5" text-anchor="middle" fill="#1f2937">פרץ חמצוני של תאי דם לבנים</text>

<polygon points="405,110 435,103 435,117" fill="#4b5563"/>

<rect x="440" y="50" width="400" height="130" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="640" y="72" font-size="12.5" font-weight="700" text-anchor="middle" fill="#92400e">נזק תאי</text>
<text x="640" y="94" font-size="10.5" text-anchor="middle" fill="#1f2937">פרוקסידציה של ליפידי הממברנה</text>
<text x="640" y="114" font-size="10.5" text-anchor="middle" fill="#1f2937">שינוי חלבונים</text>
<text x="640" y="134" font-size="10.5" text-anchor="middle" fill="#1f2937">שבירת DNA</text>
<text x="640" y="156" font-size="10.5" font-weight="700" text-anchor="middle" fill="#92400e">דוגמאות: רעילות חמצן, רעילות תרופתית/כימית,</text>
<text x="640" y="172" font-size="10" text-anchor="middle" fill="#92400e">עודף ברזל/נחושת (המוכרומטוזיס, וילסון)</text>

<polygon points="640,190 640,210 635,200" fill="#4b5563"/>

<rect x="230" y="215" width="400" height="70" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
<text x="430" y="238" font-size="12" font-weight="700" text-anchor="middle" fill="#065f46">ניטרול (מסלקים רדיקלים)</text>
<text x="430" y="258" font-size="10.5" text-anchor="middle" fill="#1f2937">קטלאז, סופראוקסיד דיסמוטאז, גלוטתיון פראוקסידאז</text>
<text x="430" y="274" font-size="10.5" text-anchor="middle" fill="#1f2937">נוגדי חמצון (ויטמין A,C,E); טרנספרין, צרולופלסמין</text>
</svg>
