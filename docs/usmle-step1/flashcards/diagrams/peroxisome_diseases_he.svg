<svg class="diagram" viewBox="0 0 860 260" xmlns="http://www.w3.org/2000/svg">
<title>שלוש מחלות פרוקסיזום — כל אחת פוגעת בפונקציה אחרת</title>
<text x="430" y="24" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937">שלוש מחלות פרוקסיזום — פונקציה שונה נפגעת בכל אחת</text>
<rect x="20" y="45" width="270" height="195" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="155" y="70" font-size="12.5" font-weight="700" text-anchor="middle" fill="#7f1d1d">זלווגר (Zellweger)</text>
<text x="155" y="90" font-size="10.3" text-anchor="middle" fill="#1f2937">AR — גני PEX</text>
<text x="155" y="106" font-size="10.3" font-weight="700" text-anchor="middle" fill="#7f1d1d">ביוגנזת הפרוקסיזום כולו</text>
<text x="155" y="126" font-size="10" text-anchor="middle" fill="#1f2937">↑VLCFA + חומצה פיפקוליות</text>
<text x="155" y="150" font-size="10" text-anchor="middle" fill="#1f2937">היפוטוניה, פרכוסים</text>
<text x="155" y="168" font-size="10" text-anchor="middle" fill="#1f2937">דיסמורפיה, הפטומגליה</text>
<text x="155" y="186" font-size="10" text-anchor="middle" fill="#1f2937">מוות מוקדם</text>
<rect x="300" y="45" width="270" height="195" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="435" y="70" font-size="12.5" font-weight="700" text-anchor="middle" fill="#92400e">רפסום (Refsum)</text>
<text x="435" y="90" font-size="10.3" text-anchor="middle" fill="#1f2937">AR</text>
<text x="435" y="106" font-size="10.3" font-weight="700" text-anchor="middle" fill="#92400e">פגם ב-α-חמצון</text>
<text x="435" y="126" font-size="10" text-anchor="middle" fill="#1f2937">↑חומצה פיטאנית (מהתזונה)</text>
<text x="435" y="150" font-size="10" text-anchor="middle" fill="#1f2937">רטיניטיס פיגמנטוזה, אנוסמיה</text>
<text x="435" y="168" font-size="10" text-anchor="middle" fill="#1f2937">אטקסיה, נוירופתיה</text>
<text x="435" y="186" font-size="10" text-anchor="middle" fill="#1f2937">טיפול: דיאטה, פלזמפרזיס</text>
<rect x="580" y="45" width="260" height="195" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="710" y="70" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1e3a8a">אדרנולויקודיסטרופיה</text>
<text x="710" y="90" font-size="10.3" text-anchor="middle" fill="#1f2937">X-linked recessive — ABCD1</text>
<text x="710" y="106" font-size="10.3" font-weight="700" text-anchor="middle" fill="#1e3a8a">פגם ב-β-חמצון</text>
<text x="710" y="126" font-size="10" text-anchor="middle" fill="#1f2937">↑VLCFA</text>
<text x="710" y="150" font-size="10" text-anchor="middle" fill="#1f2937">יותרת כליה + חומר לבן</text>
<text x="710" y="168" font-size="10" text-anchor="middle" fill="#1f2937">+ אשכים</text>
<text x="710" y="186" font-size="10" text-anchor="middle" fill="#1f2937">אובדן נוירולוגי מתקדם</text>
</svg>
