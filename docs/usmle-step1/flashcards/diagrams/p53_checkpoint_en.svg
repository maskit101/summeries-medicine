<svg class="diagram" viewBox="0 0 860 300" xmlns="http://www.w3.org/2000/svg">
<title>The brake pathway: p53 to p21 to CDK inhibition to active Rb to G1-S arrest</title>
<text x="430" y="26" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1f2937">Cell cycle brake pathway (DNA damage)</text>
<rect x="20" y="55" width="150" height="60" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="95" y="82" font-size="12" font-weight="700" text-anchor="middle" fill="#7f1d1d">DNA damage</text>
<text x="95" y="100" font-size="10.5" text-anchor="middle" fill="#7f1d1d">sensed by p53</text>
<polygon points="195,85 175,78 175,92" fill="#4b5563"/>
<rect x="205" y="55" width="150" height="60" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="280" y="82" font-size="12" font-weight="700" text-anchor="middle" fill="#7f1d1d">p53 ↑</text>
<text x="280" y="100" font-size="10.5" text-anchor="middle" fill="#7f1d1d">induces p21 transcription</text>
<polygon points="380,85 360,78 360,92" fill="#4b5563"/>
<rect x="390" y="55" width="150" height="60" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="465" y="82" font-size="12" font-weight="700" text-anchor="middle" fill="#92400e">p21 ↑</text>
<text x="465" y="100" font-size="10.5" text-anchor="middle" fill="#92400e">inhibits Cyclin-CDK complex</text>
<polygon points="565,85 545,78 545,92" fill="#4b5563"/>
<rect x="575" y="55" width="150" height="60" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="650" y="76" font-size="12" font-weight="700" text-anchor="middle" fill="#1e3a8a">Rb stays</text>
<text x="650" y="94" font-size="11" text-anchor="middle" fill="#1e3a8a">hypophosphorylated (active)</text>
<polygon points="750,85 730,78 730,92" fill="#4b5563"/>
<rect x="760" y="55" width="80" height="60" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
<text x="800" y="82" font-size="11" font-weight="700" text-anchor="middle" fill="#065f46">Binds</text>
<text x="800" y="98" font-size="11" font-weight="700" text-anchor="middle" fill="#065f46">E2F</text>
<rect x="30" y="150" width="810" height="50" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
<text x="435" y="180" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1f2937">Result: E2F stays blocked → G1→S transition arrested until damage is repaired</text>
<rect x="30" y="215" width="380" height="65" rx="8" fill="#fce7f3" stroke="#a21caf" stroke-width="1.3"/>
<text x="220" y="238" font-size="12" font-weight="700" text-anchor="middle" fill="#701a75">Li-Fraumeni syndrome</text>
<text x="220" y="256" font-size="10.5" text-anchor="middle" fill="#701a75">Germline TP53 mutation (loss-of-function)</text>
<text x="220" y="272" font-size="10.5" text-anchor="middle" fill="#701a75">→ entire brake fails → multiple cancers</text>
<rect x="450" y="215" width="380" height="65" rx="8" fill="#fce7f3" stroke="#a21caf" stroke-width="1.3"/>
<text x="640" y="238" font-size="12" font-weight="700" text-anchor="middle" fill="#701a75">HPV — protein E6</text>
<text x="640" y="256" font-size="10.5" text-anchor="middle" fill="#701a75">Promotes p53 degradation (different route than CDK)</text>
<text x="640" y="272" font-size="10.5" text-anchor="middle" fill="#701a75">→ same end result: brake lost</text>
</svg>
