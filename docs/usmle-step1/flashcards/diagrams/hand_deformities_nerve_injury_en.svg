<svg class="diagram" viewBox="0 0 960 430" xmlns="http://www.w3.org/2000/svg" direction="ltr">
<title>Classic hand deformities from upper extremity nerve injuries</title>
<text x="480" y="26" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2937">Classic Hand Postures — Upper Extremity Nerve Injuries</text>

<g>
<rect x="15" y="60" width="220" height="250" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="125" y="82" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1e3a8a">Radial nerve</text>
<text x="125" y="98" font-size="9.5" text-anchor="middle" fill="#1e3a8a">"Wrist drop"</text>
<rect x="70" y="150" width="110" height="14" rx="4" fill="#93c5fd" stroke="#1e3a8a" transform="rotate(35 70 150)"/>
<circle cx="60" cy="185" r="7" fill="#93c5fd" stroke="#1e3a8a"/>
<circle cx="75" cy="195" r="7" fill="#93c5fd" stroke="#1e3a8a"/>
<circle cx="90" cy="203" r="7" fill="#93c5fd" stroke="#1e3a8a"/>
<circle cx="105" cy="210" r="7" fill="#93c5fd" stroke="#1e3a8a"/>
<text x="125" y="250" font-size="9" text-anchor="middle" fill="#1e3a8a">Wrist + finger extensors lost</text>
<text x="125" y="266" font-size="9" text-anchor="middle" fill="#1e3a8a">wrist falls into flexion</text>
<text x="125" y="290" font-size="8.5" font-weight="700" text-anchor="middle" fill="#1e3a8a">above elbow: posterior arm/</text>
<text x="125" y="303" font-size="8.5" font-weight="700" text-anchor="middle" fill="#1e3a8a">forearm + dorsal hand sensory loss</text>
</g>

<g>
<rect x="250" y="60" width="220" height="250" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="360" y="82" font-size="12.5" font-weight="700" text-anchor="middle" fill="#92400e">Median nerve (proximal)</text>
<text x="360" y="98" font-size="9.5" text-anchor="middle" fill="#92400e">"Ape hand" / "Hand of benediction"</text>
<circle cx="310" cy="180" r="8" fill="#fcd34d" stroke="#92400e"/>
<rect x="325" y="150" width="16" height="55" rx="6" fill="#fcd34d" stroke="#92400e"/>
<rect x="345" y="150" width="16" height="55" rx="6" fill="#fcd34d" stroke="#92400e"/>
<rect x="365" y="155" width="16" height="50" rx="6" fill="#fcd34d" stroke="#92400e" transform="rotate(20 365 155)"/>
<rect x="383" y="160" width="16" height="45" rx="6" fill="#fcd34d" stroke="#92400e" transform="rotate(30 383 160)"/>
<text x="360" y="250" font-size="9" text-anchor="middle" fill="#92400e">Thumb can't oppose (LOAF muscles)</text>
<text x="360" y="266" font-size="9" text-anchor="middle" fill="#92400e">flattened thenar, can't make a fist</text>
<text x="360" y="290" font-size="8.5" font-weight="700" text-anchor="middle" fill="#92400e">sensory loss: thenar + lateral 3½ fingers</text>
</g>

<g>
<rect x="485" y="60" width="220" height="250" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="595" y="82" font-size="12.5" font-weight="700" text-anchor="middle" fill="#7f1d1d">Ulnar nerve</text>
<text x="595" y="98" font-size="9.5" text-anchor="middle" fill="#7f1d1d">"Ulnar claw"</text>
<circle cx="545" cy="180" r="8" fill="#fca5a5" stroke="#7f1d1d"/>
<rect x="560" y="150" width="14" height="55" rx="6" fill="#fca5a5" stroke="#7f1d1d"/>
<path d="M578,150 Q590,175 578,195" stroke="#7f1d1d" stroke-width="3" fill="none"/>
<path d="M596,152 Q608,178 596,198" stroke="#7f1d1d" stroke-width="3" fill="none"/>
<path d="M614,155 Q624,178 614,198" stroke="#7f1d1d" stroke-width="3" fill="none"/>
<text x="595" y="250" font-size="9" text-anchor="middle" fill="#7f1d1d">↓lumbricals/interossei (ulnar 2 digits)</text>
<text x="595" y="266" font-size="9" text-anchor="middle" fill="#7f1d1d">unopposed extensors → clawing on extension</text>
<text x="595" y="290" font-size="8.5" font-weight="700" text-anchor="middle" fill="#7f1d1d">sensory loss: ulnar 1½ fingers + hypothenar</text>
</g>

<g>
<rect x="720" y="60" width="220" height="250" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
<text x="830" y="82" font-size="12.5" font-weight="700" text-anchor="middle" fill="#4c1d95">Axillary nerve</text>
<text x="830" y="98" font-size="9.5" text-anchor="middle" fill="#4c1d95">"Flattened deltoid"</text>
<circle cx="830" cy="150" r="14" fill="#ddd6fe" stroke="#4c1d95"/>
<path d="M810,175 Q830,165 850,175 L850,220 Q830,230 810,220 Z" fill="#e9d5ff" stroke="#4c1d95"/>
<line x1="830" y1="230" x2="830" y2="270" stroke="#4c1d95" stroke-width="6"/>
<text x="830" y="250" font-size="8" text-anchor="middle" fill="#4c1d95">↓ deltoid bulk</text>
<text x="830" y="290" font-size="9" text-anchor="middle" fill="#4c1d95">can't abduct arm &gt;15°</text>
<text x="830" y="303" font-size="8.5" text-anchor="middle" fill="#4c1d95">sensory loss over lateral arm</text>
</g>

<rect x="15" y="330" width="925" height="80" rx="8" fill="#f8fafc" stroke="#9ca3af" stroke-width="1"/>
<text x="477" y="352" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1f2937">Humerus fractures, proximal→distal, follow the A-R-M nerves: Axillary (surgical neck) → Radial (midshaft) → Median (supracondylar)</text>
<text x="477" y="372" font-size="9.5" text-anchor="middle" fill="#1f2937">Median at wrist (carpal tunnel) = distal lesion → sensory loss + thenar weakness, NO wrist flexion loss (unlike proximal lesion)</text>
<text x="477" y="392" font-size="9.5" text-anchor="middle" fill="#1f2937">Recurrent branch of median nerve (palm laceration): thenar motor loss ONLY — no sensory loss (branches after the sensory fibers)</text>
</svg>
