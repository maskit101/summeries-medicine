<svg class="diagram" viewBox="0 0 860 340" xmlns="http://www.w3.org/2000/svg" direction="ltr">
<title>Hardy-Weinberg principle: allele frequencies and genotype frequencies</title>
<text x="430" y="24" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1f2937">Hardy-Weinberg equilibrium: p + q = 1, so p&#178; + 2pq + q&#178; = 1</text>

<rect x="30" y="50" width="330" height="180" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="195" y="72" font-size="12" font-weight="700" text-anchor="middle" fill="#1e3a8a">Punnett-square logic</text>
<rect x="130" y="90" width="70" height="34" fill="#f3f4f6" stroke="#9ca3af"/>
<text x="165" y="112" font-size="12" text-anchor="middle" fill="#1f2937">A (p)</text>
<rect x="200" y="90" width="70" height="34" fill="#f3f4f6" stroke="#9ca3af"/>
<text x="235" y="112" font-size="12" text-anchor="middle" fill="#1f2937">a (q)</text>
<rect x="60" y="124" width="70" height="34" fill="#f3f4f6" stroke="#9ca3af"/>
<text x="95" y="146" font-size="12" text-anchor="middle" fill="#1f2937">A (p)</text>
<rect x="130" y="124" width="70" height="34" fill="#ecfdf5" stroke="#047857"/>
<text x="165" y="146" font-size="12" font-weight="700" text-anchor="middle" fill="#065f46">AA (p&#178;)</text>
<rect x="200" y="124" width="70" height="34" fill="#fffbeb" stroke="#b45309"/>
<text x="235" y="146" font-size="12" font-weight="700" text-anchor="middle" fill="#92400e">Aa (pq)</text>
<rect x="60" y="158" width="70" height="34" fill="#f3f4f6" stroke="#9ca3af"/>
<text x="95" y="180" font-size="12" text-anchor="middle" fill="#1f2937">a (q)</text>
<rect x="130" y="158" width="70" height="34" fill="#fffbeb" stroke="#b45309"/>
<text x="165" y="180" font-size="12" font-weight="700" text-anchor="middle" fill="#92400e">Aa (pq)</text>
<rect x="200" y="158" width="70" height="34" fill="#fef2f2" stroke="#b91c1c"/>
<text x="235" y="180" font-size="12" font-weight="700" text-anchor="middle" fill="#7f1d1d">aa (q&#178;)</text>
<text x="195" y="212" font-size="10.5" text-anchor="middle" fill="#374151">homozygous AA (p&#178;) + het Aa (2pq) + homozygous aa (q&#178;) = 1</text>

<rect x="390" y="50" width="440" height="180" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
<text x="610" y="72" font-size="12" font-weight="700" text-anchor="middle" fill="#4c1d95">Worked example: cystic fibrosis (AR)</text>
<text x="410" y="95" font-size="10.5" fill="#1f2937">Disease incidence (aa) &#8776; 1/3200 &#8594; q&#178; = 1/3200</text>
<text x="410" y="114" font-size="10.5" fill="#1f2937">q = &#8730;(1/3200) &#8776; 0.017 (1.7% of alleles)</text>
<text x="410" y="133" font-size="10.5" fill="#1f2937">p = 1 &#8722; q &#8776; 0.982 (since rare disease, p &#8776; 1)</text>
<text x="410" y="152" font-size="10.5" font-weight="700" fill="#4c1d95">Carrier frequency = 2pq &#8776; 0.035 &#8594; 3.5% of population</text>
<text x="410" y="178" font-size="10" fill="#4b5563">X-linked recessive: male incidence = q, female incidence = q&#178;</text>
<text x="410" y="196" font-size="10" fill="#4b5563">(males are hemizygous &#8212; one X only)</text>

<rect x="30" y="245" width="800" height="75" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
<text x="430" y="268" font-size="11.5" font-weight="700" text-anchor="middle" fill="#92400e">Assumptions: no mutation, no natural selection, random mating, no migration, large population</text>
<text x="430" y="288" font-size="10.5" text-anchor="middle" fill="#92400e">If any assumption is violated (bottleneck, founder effect, non-random mating) &#8594; allele frequencies shift = genetic drift</text>
<text x="430" y="306" font-size="9.5" text-anchor="middle" fill="#92400e">In equilibrium, p and q stay constant generation after generation</text>
</svg>
