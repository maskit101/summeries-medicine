<svg class="diagram" viewBox="0 0 940 460" xmlns="http://www.w3.org/2000/svg" direction="ltr">
<title>Immune checkpoint interactions: CTLA-4/B7 and PD-1/PD-L1</title>
<text x="470" y="26" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2937">Immune checkpoint interactions in cancer — CTLA-4/B7 and PD-1/PD-L1, and their drug blockade</text>

<g>
<rect x="30" y="55" width="230" height="150" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="145" y="78" font-size="12" font-weight="700" text-anchor="middle" fill="#1e3a8a">APC</text>
<text x="145" y="96" font-size="9" text-anchor="middle" fill="#1f2937">Presents antigen to T cell</text>
<text x="145" y="112" font-size="9" text-anchor="middle" fill="#1f2937">via MHC I/II</text>
<rect x="230" y="130" width="24" height="18" rx="3" fill="#93c5fd" stroke="#1e3a8a"/>
<text x="242" y="126" font-size="8" text-anchor="middle" fill="#1e3a8a">B7</text>

<rect x="330" y="55" width="230" height="150" rx="10" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
<text x="445" y="78" font-size="12" font-weight="700" text-anchor="middle" fill="#4c1d95">T cell</text>
<text x="445" y="96" font-size="9" text-anchor="middle" fill="#1f2937">CD28 competes for B7</text>
<text x="445" y="112" font-size="9" text-anchor="middle" fill="#1f2937">against CTLA-4</text>
<rect x="336" y="130" width="24" height="18" rx="3" fill="#c4b5fd" stroke="#4c1d95"/>
<text x="348" y="126" font-size="8" text-anchor="middle" fill="#4c1d95">CD28</text>
<rect x="336" y="160" width="30" height="18" rx="3" fill="#ddd6fe" stroke="#4c1d95"/>
<text x="351" y="176" font-size="7.5" text-anchor="middle" fill="#4c1d95">CTLA-4</text>

<line x1="254" y1="139" x2="336" y2="139" stroke="#1e3a8a" stroke-width="2.5"/>
<text x="295" y="134" font-size="7.5" text-anchor="middle" fill="#1e3a8a">Costimulation</text>
<line x1="254" y1="139" x2="336" y2="169" stroke="#b91c1c" stroke-width="2" stroke-dasharray="4 3"/>
<text x="470" y="205" font-size="9.5" font-weight="700" text-anchor="middle" fill="#7f1d1d">CTLA-4 outcompetes CD28 for B7 → loss of costimulatory signal</text>
</g>

<rect x="600" y="60" width="310" height="60" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="755" y="82" font-size="11" font-weight="700" text-anchor="middle" fill="#7f1d1d">CTLA-4 blockade: ipilimumab</text>
<text x="755" y="100" font-size="9" text-anchor="middle" fill="#1f2937">Antibody blocks CTLA-4 → restores B7-CD28 costimulation</text>
<line x1="595" y1="130" x2="560" y2="145" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="2 2"/>

<g>
<rect x="30" y="245" width="230" height="150" rx="10" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
<text x="145" y="268" font-size="12" font-weight="700" text-anchor="middle" fill="#4c1d95">T cell (in tumor)</text>
<text x="145" y="286" font-size="9" text-anchor="middle" fill="#1f2937">Expresses PD-1</text>
<rect x="230" y="320" width="24" height="18" rx="3" fill="#c4b5fd" stroke="#4c1d95"/>
<text x="242" y="316" font-size="8" text-anchor="middle" fill="#4c1d95">PD-1</text>

<rect x="330" y="245" width="230" height="150" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="445" y="268" font-size="12" font-weight="700" text-anchor="middle" fill="#7f1d1d">Tumor cell</text>
<text x="445" y="286" font-size="9" text-anchor="middle" fill="#1f2937">Expresses PD-L1/PD-L2</text>
<rect x="336" y="320" width="30" height="18" rx="3" fill="#fca5a5" stroke="#7f1d1d"/>
<text x="351" y="316" font-size="7.5" text-anchor="middle" fill="#7f1d1d">PD-L1/2</text>

<line x1="254" y1="329" x2="336" y2="329" stroke="#7f1d1d" stroke-width="2.5"/>
<text x="470" y="360" font-size="9.5" font-weight="700" text-anchor="middle" fill="#7f1d1d">PD-1/PD-L1 interaction → T-cell exhaustion/dysfunction</text>
<text x="470" y="378" font-size="8.5" text-anchor="middle" fill="#1f2937">Result: T cell fails to attack tumor cell — immune evasion</text>
</g>

<rect x="600" y="248" width="310" height="82" rx="8" fill="#e0e7ff" stroke="#4c1d95" stroke-width="1.5"/>
<text x="755" y="268" font-size="10.5" font-weight="700" text-anchor="middle" fill="#312e81">Anti-PD-1: cemiplimab, nivolumab, pembrolizumab</text>
<text x="755" y="288" font-size="10.5" font-weight="700" text-anchor="middle" fill="#312e81">Anti-PD-L1: atezolizumab, durvalumab, avelumab</text>
<text x="755" y="306" font-size="9" text-anchor="middle" fill="#1f2937">Blocking the interaction restores T-cell function against the tumor</text>
<line x1="595" y1="320" x2="560" y2="330" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="2 2"/>

<rect x="30" y="410" width="880" height="40" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
<text x="470" y="434" font-size="10.5" font-weight="700" text-anchor="middle" fill="#92400e">Both mechanisms reduce anti-tumor immune response — blocked by immunotherapies of growing surgical-oncologic importance (peri-operative use)</text>
</svg>
