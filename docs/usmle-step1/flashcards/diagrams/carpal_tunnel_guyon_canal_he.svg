<svg class="diagram" viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" direction="ltr">
<title>חתך שורש כף היד — תעלת קרפל מול תעלת גיון</title>
<text x="500" y="26" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2937">חתך שורש כף היד (פני כף היד) — תעלת קרפל מול תעלת גיון</text>

<g>
<rect x="20" y="60" width="470" height="340" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="255" y="85" font-size="13" font-weight="700" text-anchor="middle" fill="#1e3a8a">תעלת קרפל (Carpal Tunnel)</text>
<text x="255" y="102" font-size="10" text-anchor="middle" fill="#1e3a8a">עמוק ל-Flexor Retinaculum</text>

<rect x="60" y="120" width="390" height="24" rx="4" fill="#93c5fd" stroke="#1e3a8a" stroke-width="1.5"/>
<text x="255" y="137" font-size="10" font-weight="700" text-anchor="middle" fill="#1e3a8a">Flexor Retinaculum (Transverse Carpal Ligament)</text>

<circle cx="130" cy="220" r="26" fill="#fde68a" stroke="#92400e" stroke-width="2"/>
<text x="130" y="216" font-size="9.5" font-weight="700" text-anchor="middle" fill="#92400e">עצב</text>
<text x="130" y="229" font-size="9.5" font-weight="700" text-anchor="middle" fill="#92400e">מדיאני</text>

<rect x="185" y="195" width="55" height="50" rx="8" fill="#bfdbfe" stroke="#1e3a8a" stroke-width="1.5"/>
<text x="212" y="215" font-size="8" text-anchor="middle" fill="#1e3a8a">FDS</text>
<text x="212" y="227" font-size="8" text-anchor="middle" fill="#1e3a8a">tendons</text>

<rect x="255" y="195" width="55" height="50" rx="8" fill="#bfdbfe" stroke="#1e3a8a" stroke-width="1.5"/>
<text x="282" y="215" font-size="8" text-anchor="middle" fill="#1e3a8a">FDP</text>
<text x="282" y="227" font-size="8" text-anchor="middle" fill="#1e3a8a">tendons</text>

<rect x="325" y="200" width="45" height="42" rx="8" fill="#bfdbfe" stroke="#1e3a8a" stroke-width="1.5"/>
<text x="347" y="216" font-size="7.5" text-anchor="middle" fill="#1e3a8a">FPL</text>
<text x="347" y="227" font-size="7.5" text-anchor="middle" fill="#1e3a8a">tendon</text>

<rect x="385" y="195" width="55" height="50" rx="8" fill="#dbeafe" stroke="#1e3a8a" stroke-width="1.5" stroke-dasharray="3,3"/>
<text x="412" y="212" font-size="7.5" text-anchor="middle" fill="#1e3a8a">FCR</text>
<text x="412" y="223" font-size="7.5" text-anchor="middle" fill="#1e3a8a">(תא</text>
<text x="412" y="234" font-size="7.5" text-anchor="middle" fill="#1e3a8a">נפרד)</text>

<text x="255" y="280" font-size="9.5" font-weight="700" text-anchor="middle" fill="#1e3a8a">תוכן: עצב מדיאני + גידי FDS/FDP + FPL</text>
<text x="255" y="296" font-size="9" text-anchor="middle" fill="#1e3a8a">נקע ה-lunate ← לחץ על העצב המדיאני ← תסמונת התעלה הקרפלית</text>

<rect x="60" y="320" width="180" height="60" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="150" y="340" font-size="9" font-weight="700" text-anchor="middle" fill="#7f1d1d">תנר (Thenar)</text>
<text x="150" y="356" font-size="8" text-anchor="middle" fill="#7f1d1d">צד רדיאלי/לטרלי</text>
<text x="150" y="370" font-size="8" text-anchor="middle" fill="#7f1d1d">(אגודל)</text>

<rect x="270" y="320" width="180" height="60" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
<text x="360" y="340" font-size="9" font-weight="700" text-anchor="middle" fill="#065f46">היפותנר (Hypothenar)</text>
<text x="360" y="356" font-size="8" text-anchor="middle" fill="#065f46">צד אולנרי/מדיאלי</text>
<text x="360" y="370" font-size="8" text-anchor="middle" fill="#065f46">(זרת)</text>
</g>

<g>
<rect x="510" y="60" width="470" height="340" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="745" y="85" font-size="13" font-weight="700" text-anchor="middle" fill="#7f1d1d">תעלת גיון (Guyon Canal)</text>
<text x="745" y="102" font-size="10" text-anchor="middle" fill="#7f1d1d">שטחי ל-Flexor Retinaculum</text>

<circle cx="670" cy="150" r="24" fill="#fca5a5" stroke="#7f1d1d" stroke-width="2"/>
<text x="670" y="147" font-size="9" font-weight="700" text-anchor="middle" fill="#7f1d1d">עצב</text>
<text x="670" y="159" font-size="9" font-weight="700" text-anchor="middle" fill="#7f1d1d">אולנרי</text>

<circle cx="740" cy="150" r="18" fill="#fecaca" stroke="#7f1d1d" stroke-width="2"/>
<text x="740" y="147" font-size="7.5" font-weight="700" text-anchor="middle" fill="#7f1d1d">עורק</text>
<text x="740" y="157" font-size="7.5" font-weight="700" text-anchor="middle" fill="#7f1d1d">אולנרי</text>

<rect x="600" y="185" width="290" height="22" rx="4" fill="#fca5a5" stroke="#7f1d1d" stroke-width="1.5"/>
<text x="745" y="200" font-size="9" font-weight="700" text-anchor="middle" fill="#7f1d1d">עוברים שטחית לרצועה — לא נכנסים לתעלה הקרפלית</text>

<rect x="560" y="225" width="370" height="24" rx="4" fill="#93c5fd" stroke="#1e3a8a" stroke-width="1.5"/>
<text x="745" y="242" font-size="9.5" font-weight="700" text-anchor="middle" fill="#1e3a8a">Flexor Retinaculum (עמוק לתעלת גיון)</text>

<text x="745" y="280" font-size="9.5" font-weight="700" text-anchor="middle" fill="#7f1d1d">תוכן: עצב אולנרי + עורק אולנרי בלבד</text>
<text x="745" y="296" font-size="9" text-anchor="middle" fill="#7f1d1d">שבר hook of hamate ← לחץ על העצב האולנרי ← תסמונת תעלת גיון</text>

<rect x="550" y="320" width="180" height="60" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="640" y="340" font-size="9" font-weight="700" text-anchor="middle" fill="#7f1d1d">תנר (Thenar)</text>
<text x="640" y="356" font-size="8" text-anchor="middle" fill="#7f1d1d">צד רדיאלי/לטרלי</text>
<text x="640" y="370" font-size="8" text-anchor="middle" fill="#7f1d1d">(אגודל)</text>

<rect x="760" y="320" width="180" height="60" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
<text x="850" y="340" font-size="9" font-weight="700" text-anchor="middle" fill="#065f46">היפותנר (Hypothenar)</text>
<text x="850" y="356" font-size="8" text-anchor="middle" fill="#065f46">צד אולנרי/מדיאלי</text>
<text x="850" y="370" font-size="8" text-anchor="middle" fill="#065f46">(זרת)</text>
</g>

<rect x="20" y="415" width="960" height="70" rx="8" fill="#f8fafc" stroke="#9ca3af" stroke-width="1"/>
<text x="500" y="437" font-size="10" font-weight="700" text-anchor="middle" fill="#1f2937">תעלה קרפלית = עמוק לרצועה, מכילה עצב מדיאני + גידי כופפים (FDS/FDP/FPL). תעלת גיון = שטחי לרצועה, מכילה עצב אולנרי + עורק אולנרי בלבד</text>
<text x="500" y="457" font-size="9.5" text-anchor="middle" fill="#1f2937">הבדל אנטומי קריטי: פגיעה בתעלה הקרפלית (מדיאני) לעולם אינה זהה מבחינת תוכן לפגיעה בתעלת גיון (אולנרי) — שתי תסמונות לחיצה שונות לחלוטין</text>
</svg>