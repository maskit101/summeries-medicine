<svg class="diagram" viewBox="0 0 860 380" xmlns="http://www.w3.org/2000/svg" direction="ltr">
<title>מנגנון CFTR &#916;F508: מחלבון מעוות עד ריר סמיך</title>
<text x="430" y="24" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1f2937">סיסטיק פיברוזיס: איך מחיקת חומצת אמינו אחת (Phe508) גורמת להפרשות סמיכות</text>

<rect x="30" y="48" width="380" height="130" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
<text x="220" y="70" font-size="12" font-weight="700" text-anchor="middle" fill="#065f46">CFTR תקין</text>
<rect x="60" y="82" width="90" height="34" rx="6" fill="#fff" stroke="#047857"/>
<text x="105" y="103" font-size="9.5" text-anchor="middle" fill="#065f46">קיפול תקין</text>
<polygon points="155,99 180,92 180,106" fill="#4b5563"/>
<rect x="185" y="82" width="90" height="34" rx="6" fill="#fff" stroke="#047857"/>
<text x="230" y="103" font-size="9" text-anchor="middle" fill="#065f46">ER &#8592; גולג'י &#8592; ממברנה</text>
<polygon points="280,99 305,92 305,106" fill="#4b5563"/>
<rect x="310" y="82" width="90" height="34" rx="6" fill="#fff" stroke="#047857"/>
<text x="355" y="98" font-size="9" text-anchor="middle" fill="#065f46">תעלת Cl&#8315;</text>
<text x="355" y="111" font-size="9" text-anchor="middle" fill="#065f46">בפני התא</text>
<text x="220" y="140" font-size="10" text-anchor="middle" fill="#065f46">Cl&#8315; מופרש (ריאה/GI); Cl&#8315; נספג-חזרה (בלוטת זיעה)</text>
<text x="220" y="158" font-size="10" text-anchor="middle" fill="#065f46">H&#8322;O עוקב אחר Cl&#8315; &#8592; ריר דק ותקין</text>

<rect x="450" y="48" width="380" height="130" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="640" y="70" font-size="12" font-weight="700" text-anchor="middle" fill="#7f1d1d">CFTR מוטנטי &#916;F508</text>
<rect x="480" y="82" width="90" height="34" rx="6" fill="#fff" stroke="#b91c1c"/>
<text x="525" y="98" font-size="9" text-anchor="middle" fill="#7f1d1d">Phe508 נמחק</text>
<text x="525" y="111" font-size="9" text-anchor="middle" fill="#7f1d1d">&#8592; מתקפל לא-תקין</text>
<polygon points="575,99 600,92 600,106" fill="#4b5563"/>
<rect x="605" y="82" width="90" height="34" rx="6" fill="#fff" stroke="#b91c1c"/>
<text x="650" y="98" font-size="9" text-anchor="middle" fill="#7f1d1d">נתקע ב-ER &#8592;</text>
<text x="650" y="111" font-size="9" text-anchor="middle" fill="#7f1d1d">מפורק</text>
<polygon points="700,99 725,92 725,106" fill="#4b5563"/>
<rect x="730" y="82" width="90" height="34" rx="6" fill="#fff" stroke="#b91c1c"/>
<text x="775" y="98" font-size="9" text-anchor="middle" fill="#7f1d1d">נעדר מממברנת</text>
<text x="775" y="111" font-size="9" text-anchor="middle" fill="#7f1d1d">התא</text>
<text x="640" y="140" font-size="10" font-weight="700" text-anchor="middle" fill="#7f1d1d">&#8595; הפרשת Cl&#8315; (וגם H&#8322;O, HCO&#8323;&#8315;)</text>
<text x="640" y="158" font-size="10" text-anchor="middle" fill="#7f1d1d">ספיגת-חזרה מפצה של Na&#8314; דרך ENaC</text>

<path d="M 430 178 L 430 205" stroke="#4b5563" stroke-width="2.5" marker-end="url(#cftrArrHe)"/>
<defs><marker id="cftrArrHe" markerWidth="10" markerHeight="10" refX="5" refY="8" orient="auto"><polygon points="0,0 5,9 10,0" fill="#4b5563"/></marker></defs>

<rect x="130" y="210" width="600" height="60" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="430" y="233" font-size="11.5" font-weight="700" text-anchor="middle" fill="#92400e">&#8593; ספיגת Na&#8314; &#8592; &#8593; ספיגת H&#8322;O &#8592; ריר סמיך באופן חריג, מיובש</text>
<text x="430" y="252" font-size="10" text-anchor="middle" fill="#92400e">מופרש לריאות, מערכת העיכול, צינורות הלבלב, צינור הזרע</text>

<rect x="30" y="285" width="380" height="80" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="220" y="307" font-size="11" font-weight="700" text-anchor="middle" fill="#1e3a8a">בלוטת זיעה: כיוון הפוך</text>
<text x="220" y="325" font-size="10" text-anchor="middle" fill="#1f2937">CFTR תקין סופג את Cl&#8315; בצינורות</text>
<text x="220" y="343" font-size="10" font-weight="700" text-anchor="middle" fill="#1e3a8a">אובדן CFTR &#8592; &#8593;Cl&#8315; נשאר בזיעה</text>
<text x="220" y="358" font-size="9.5" text-anchor="middle" fill="#1f2937">&#8592; אבחנתי: &#8593; כלוריד בבדיקת זיעה</text>

<rect x="450" y="285" width="380" height="80" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
<text x="640" y="307" font-size="11" font-weight="700" text-anchor="middle" fill="#4c1d95">תרופות CFTR modulator</text>
<text x="640" y="325" font-size="10" text-anchor="middle" fill="#1f2937">Potentiators (ivacaftor): משאירות את השער פתוח</text>
<text x="640" y="343" font-size="10" text-anchor="middle" fill="#1f2937">Correctors (lumacaftor/tezacaftor): מתקנות קיפול תלת-מימדי</text>
<text x="640" y="358" font-size="9.5" text-anchor="middle" fill="#1f2937">כך שהחלבון יכול לעבור לממברנה</text>
</svg>
