<svg class="diagram" viewBox="0 0 860 460" xmlns="http://www.w3.org/2000/svg" direction="ltr">
<title>דפוסי תורשה: AD, AR, נסגר-X רצסיבי, נסגר-X דומיננטי</title>
<text x="430" y="24" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1f2937">ארבעת דפוסי התורשה המנדליים הקלאסיים ותרשימי ההצלבה שלהם</text>

<rect x="30" y="48" width="390" height="185" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="225" y="70" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1e3a8a">אוטוזומלי דומיננטי (Aa &#215; aa)</text>
<rect x="80" y="82" width="42" height="26" fill="#f3f4f6" stroke="#9ca3af"/><text x="101" y="99" font-size="10" text-anchor="middle">A</text>
<rect x="122" y="82" width="42" height="26" fill="#f3f4f6" stroke="#9ca3af"/><text x="143" y="99" font-size="10" text-anchor="middle">a</text>
<rect x="38" y="108" width="42" height="26" fill="#f3f4f6" stroke="#9ca3af"/><text x="59" y="125" font-size="10" text-anchor="middle">a</text>
<rect x="80" y="108" width="42" height="26" fill="#fef2f2" stroke="#b91c1c"/><text x="101" y="125" font-size="10" font-weight="700" text-anchor="middle" fill="#7f1d1d">Aa</text>
<rect x="122" y="108" width="42" height="26" fill="#fef2f2" stroke="#b91c1c"/><text x="143" y="125" font-size="10" font-weight="700" text-anchor="middle" fill="#7f1d1d">Aa</text>
<rect x="38" y="134" width="42" height="26" fill="#f3f4f6" stroke="#9ca3af"/><text x="59" y="151" font-size="10" text-anchor="middle">a</text>
<rect x="80" y="134" width="42" height="26" fill="#fef2f2" stroke="#b91c1c"/><text x="101" y="151" font-size="10" font-weight="700" text-anchor="middle" fill="#7f1d1d">Aa</text>
<rect x="122" y="134" width="42" height="26" fill="#fef2f2" stroke="#b91c1c"/><text x="143" y="151" font-size="10" font-weight="700" text-anchor="middle" fill="#7f1d1d">Aa</text>
<text x="270" y="100" font-size="10" fill="#1f2937">50% מהילדים חולים</text>
<text x="270" y="118" font-size="10" fill="#1f2937">בכל דור, שני המינים</text>
<text x="270" y="136" font-size="10" fill="#1f2937">אקספרסיביות משתנה</text>
<text x="270" y="154" font-size="10" fill="#1f2937">ופלייוטרופיה שכיחות</text>
<text x="225" y="182" font-size="10" text-anchor="middle" fill="#1e3a8a">למשל: מרפן, הנטינגטון, NF1, ADPKD</text>
<text x="225" y="200" font-size="10" text-anchor="middle" fill="#1e3a8a">אכונדרופלזיה, היפרכולסטרולמיה משפחתית</text>
<text x="225" y="218" font-size="9.5" text-anchor="middle" fill="#1e3a8a">פגם בגן מבני &#8212; עותק פגום אחד מספיק</text>

<rect x="440" y="48" width="390" height="185" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="635" y="70" font-size="12.5" font-weight="700" text-anchor="middle" fill="#7f1d1d">אוטוזומלי רצסיבי (Aa &#215; Aa)</text>
<rect x="490" y="82" width="42" height="26" fill="#f3f4f6" stroke="#9ca3af"/><text x="511" y="99" font-size="10" text-anchor="middle">A</text>
<rect x="532" y="82" width="42" height="26" fill="#f3f4f6" stroke="#9ca3af"/><text x="553" y="99" font-size="10" text-anchor="middle">a</text>
<rect x="448" y="108" width="42" height="26" fill="#f3f4f6" stroke="#9ca3af"/><text x="469" y="125" font-size="10" text-anchor="middle">A</text>
<rect x="490" y="108" width="42" height="26" fill="#ecfdf5" stroke="#047857"/><text x="511" y="125" font-size="10" font-weight="700" text-anchor="middle" fill="#065f46">AA</text>
<rect x="532" y="108" width="42" height="26" fill="#fffbeb" stroke="#b45309"/><text x="553" y="125" font-size="10" font-weight="700" text-anchor="middle" fill="#92400e">Aa</text>
<rect x="448" y="134" width="42" height="26" fill="#f3f4f6" stroke="#9ca3af"/><text x="469" y="151" font-size="10" text-anchor="middle">a</text>
<rect x="490" y="134" width="42" height="26" fill="#fffbeb" stroke="#b45309"/><text x="511" y="151" font-size="10" font-weight="700" text-anchor="middle" fill="#92400e">Aa</text>
<rect x="532" y="134" width="42" height="26" fill="#fef2f2" stroke="#b91c1c"/><text x="553" y="151" font-size="10" font-weight="700" text-anchor="middle" fill="#7f1d1d">aa</text>
<text x="680" y="100" font-size="10" fill="#1f2937">25% חולה, 50% נשא,</text>
<text x="680" y="118" font-size="10" fill="#1f2937">25% בריא-לא-נשא</text>
<text x="680" y="136" font-size="10" fill="#1f2937">לרוב חסר אנזימטי,</text>
<text x="680" y="154" font-size="10" fill="#1f2937">דור אחד, &#8593; בקרבת-דם</text>
<text x="635" y="182" font-size="10" text-anchor="middle" fill="#7f1d1d">למשל: סיסטיק פיברוזיס, אנמיה חרמשית, PKU,</text>
<text x="635" y="200" font-size="10" text-anchor="middle" fill="#7f1d1d">טיי-זקס, תלסמיה, מחלת וילסון</text>
<text x="635" y="218" font-size="9.5" text-anchor="middle" fill="#7f1d1d">אח בריא לילד חולה: 2/3 סיכוי להיות נשא</text>

<rect x="30" y="245" width="390" height="185" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="225" y="267" font-size="12.5" font-weight="700" text-anchor="middle" fill="#92400e">נסגר-X רצסיבי (נשאית X&#775;X &#215; XY)</text>
<rect x="80" y="279" width="42" height="26" fill="#f3f4f6" stroke="#9ca3af"/><text x="101" y="296" font-size="10" text-anchor="middle">X</text>
<rect x="122" y="279" width="42" height="26" fill="#f3f4f6" stroke="#9ca3af"/><text x="143" y="296" font-size="10" text-anchor="middle">Y</text>
<rect x="38" y="305" width="42" height="26" fill="#f3f4f6" stroke="#9ca3af"/><text x="59" y="322" font-size="10" text-anchor="middle">X</text>
<rect x="80" y="305" width="42" height="26" fill="#ecfdf5" stroke="#047857"/><text x="101" y="322" font-size="9" font-weight="700" text-anchor="middle" fill="#065f46">XX</text>
<rect x="122" y="305" width="42" height="26" fill="#eff6ff" stroke="#2563eb"/><text x="143" y="322" font-size="9" font-weight="700" text-anchor="middle" fill="#1e3a8a">XY</text>
<rect x="38" y="331" width="42" height="26" fill="#f3f4f6" stroke="#9ca3af"/><text x="59" y="348" font-size="10" text-anchor="middle">X&#775;</text>
<rect x="80" y="331" width="42" height="26" fill="#fffbeb" stroke="#b45309"/><text x="101" y="348" font-size="8.5" font-weight="700" text-anchor="middle" fill="#92400e">X&#775;X נשאית</text>
<rect x="122" y="331" width="42" height="26" fill="#fef2f2" stroke="#b91c1c"/><text x="143" y="348" font-size="8.5" font-weight="700" text-anchor="middle" fill="#7f1d1d">X&#775;Y חולה</text>
<text x="270" y="297" font-size="10" fill="#1f2937">50% מהבנים חולים,</text>
<text x="270" y="315" font-size="10" fill="#1f2937">50% מהבנות נשאיות</text>
<text x="270" y="333" font-size="10" fill="#1f2937">אין העברה מזכר לזכר,</text>
<text x="270" y="351" font-size="10" fill="#1f2937">מדלג דורות, חמור יותר בזכרים</text>
<text x="225" y="380" font-size="10" text-anchor="middle" fill="#92400e">למשל: DMD/BMD, המופיליה A/B, חסר G6PD,</text>
<text x="225" y="398" font-size="9.5" text-anchor="middle" fill="#92400e">פאברי, לש-נייהן, תסמונת האנטר</text>
<text x="225" y="416" font-size="9.5" text-anchor="middle" fill="#92400e">טרנר (45,XO) &#8592; &#8593; סיכון לביטוי מחלה נסגרת-X</text>

<rect x="440" y="245" width="390" height="185" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
<text x="635" y="267" font-size="12.5" font-weight="700" text-anchor="middle" fill="#4c1d95">נסגר-X דומיננטי (X&#775;X &#215; XY)</text>
<rect x="490" y="279" width="42" height="26" fill="#f3f4f6" stroke="#9ca3af"/><text x="511" y="296" font-size="10" text-anchor="middle">X</text>
<rect x="532" y="279" width="42" height="26" fill="#f3f4f6" stroke="#9ca3af"/><text x="553" y="296" font-size="10" text-anchor="middle">Y</text>
<rect x="448" y="305" width="42" height="26" fill="#f3f4f6" stroke="#9ca3af"/><text x="469" y="322" font-size="10" text-anchor="middle">X&#775;</text>
<rect x="490" y="305" width="42" height="26" fill="#fef2f2" stroke="#b91c1c"/><text x="511" y="322" font-size="8" font-weight="700" text-anchor="middle" fill="#7f1d1d">X&#775;X חולה</text>
<rect x="532" y="305" width="42" height="26" fill="#fef2f2" stroke="#b91c1c"/><text x="553" y="322" font-size="8" font-weight="700" text-anchor="middle" fill="#7f1d1d">X&#775;Y חולה</text>
<rect x="448" y="331" width="42" height="26" fill="#f3f4f6" stroke="#9ca3af"/><text x="469" y="348" font-size="10" text-anchor="middle">X</text>
<rect x="490" y="331" width="42" height="26" fill="#ecfdf5" stroke="#047857"/><text x="511" y="348" font-size="9" font-weight="700" text-anchor="middle" fill="#065f46">XX</text>
<rect x="532" y="331" width="42" height="26" fill="#eff6ff" stroke="#2563eb"/><text x="553" y="348" font-size="9" font-weight="700" text-anchor="middle" fill="#1e3a8a">XY</text>
<text x="680" y="297" font-size="10" fill="#1f2937">אם חולה: 50% מכלל</text>
<text x="680" y="315" font-size="10" fill="#1f2937">הילדים חולים</text>
<text x="680" y="333" font-size="10" fill="#1f2937">אב חולה: 100% מהבנות,</text>
<text x="680" y="351" font-size="10" fill="#1f2937">0% מהבנים חולים</text>
<text x="635" y="380" font-size="10" text-anchor="middle" fill="#4c1d95">למשל: תסמונת X שביר, תסמונת אלפורט,</text>
<text x="635" y="398" font-size="9.5" text-anchor="middle" fill="#4c1d95">רככת היפופוספטמית נסגרת-X</text>
<text x="635" y="416" font-size="9.5" text-anchor="middle" fill="#4c1d95">(בזבוז זרחה בטובולוס הפרוקסימלי)</text>
</svg>
