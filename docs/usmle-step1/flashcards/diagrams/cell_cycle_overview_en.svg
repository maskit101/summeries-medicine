<svg class="diagram" viewBox="0 0 860 240" xmlns="http://www.w3.org/2000/svg">
<title>Cell cycle phases and checkpoints</title>
<text x="430" y="24" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1f2937">G1 → S → G2 → M — with checkpoints between phases</text>
<rect x="30" y="55" width="170" height="70" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="115" y="82" font-size="13" font-weight="700" text-anchor="middle" fill="#1e3a8a">G1</text>
<text x="115" y="100" font-size="10.5" text-anchor="middle" fill="#1f2937">Highly variable length</text>
<text x="115" y="115" font-size="10.5" text-anchor="middle" fill="#1f2937">depends on growth factors</text>
<circle cx="215" cy="90" r="16" fill="#fbbf24" stroke="#92400e"/>
<text x="215" y="94" font-size="8.5" text-anchor="middle" fill="#78350f">check</text>
<rect x="240" y="55" width="150" height="70" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
<text x="315" y="82" font-size="13" font-weight="700" text-anchor="middle" fill="#065f46">S</text>
<text x="315" y="100" font-size="10.5" text-anchor="middle" fill="#1f2937">DNA replication</text>
<circle cx="410" cy="90" r="16" fill="#fbbf24" stroke="#92400e"/>
<text x="410" y="94" font-size="8.5" text-anchor="middle" fill="#78350f">check</text>
<rect x="430" y="55" width="150" height="70" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<text x="505" y="82" font-size="13" font-weight="700" text-anchor="middle" fill="#92400e">G2</text>
<text x="505" y="100" font-size="10.5" text-anchor="middle" fill="#1f2937">Final prep for mitosis</text>
<circle cx="600" cy="90" r="16" fill="#fbbf24" stroke="#92400e"/>
<text x="600" y="94" font-size="8.5" text-anchor="middle" fill="#78350f">check</text>
<rect x="620" y="55" width="210" height="70" rx="8" fill="#fce7f3" stroke="#a21caf" stroke-width="1.5"/>
<text x="725" y="78" font-size="13" font-weight="700" text-anchor="middle" fill="#701a75">M — shortest phase</text>
<text x="725" y="98" font-size="10" text-anchor="middle" fill="#1f2937">Mitosis (pro-prometa-meta-ana-telophase)</text>
<text x="725" y="113" font-size="10" text-anchor="middle" fill="#1f2937">+ cytokinesis</text>
<rect x="30" y="150" width="800" height="70" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
<text x="430" y="172" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1f2937">CDK: constitutively expressed, inactive without cyclin • Cyclin: phase-specific, activates CDK when growth factors stimulate</text>
<text x="430" y="192" font-size="11.5" text-anchor="middle" fill="#1f2937">Cyclin-CDK complex phosphorylates target proteins (like Rb) to drive the cell into the next phase</text>
<text x="430" y="210" font-size="11" font-weight="700" text-anchor="middle" fill="#4b5563">From G0 (resting), cells return to G1 when stimulated (cell types: see separate diagram)</text>
</svg>
