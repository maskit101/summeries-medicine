<svg class="diagram" viewBox="0 0 860 300" xmlns="http://www.w3.org/2000/svg" direction="ltr">
<title>Trinucleotide repeat expansion and genetic anticipation</title>
<text x="430" y="24" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1f2937">Anticipation: repeats expand across generations &#8594; earlier onset, greater severity</text>

<rect x="30" y="48" width="180" height="150" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
<text x="120" y="70" font-size="11.5" font-weight="700" text-anchor="middle" fill="#065f46">Generation 1</text>
<rect x="55" y="82" width="130" height="24" fill="#fff" stroke="#047857"/>
<text x="120" y="99" font-size="9.5" text-anchor="middle" fill="#065f46">(CGG)&#8319;&#8309; normal</text>
<text x="120" y="125" font-size="9.5" text-anchor="middle" fill="#1f2937">few repeats</text>
<text x="120" y="143" font-size="10" font-weight="700" text-anchor="middle" fill="#065f46">unaffected</text>
<text x="120" y="165" font-size="9" text-anchor="middle" fill="#4b5563">repeats can slip &amp; expand</text>
<text x="120" y="180" font-size="9" text-anchor="middle" fill="#4b5563">during replication (esp. oogenesis</text>
<text x="120" y="193" font-size="9" text-anchor="middle" fill="#4b5563">for FMR1)</text>

<polygon points="215,120 245,113 245,127" fill="#4b5563"/>

<rect x="255" y="48" width="180" height="150" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="345" y="70" font-size="11.5" font-weight="700" text-anchor="middle" fill="#92400e">Generation 2</text>
<rect x="270" y="82" width="150" height="24" fill="#fff" stroke="#b45309"/>
<text x="345" y="99" font-size="9.5" text-anchor="middle" fill="#92400e">(CGG)&#8319;&#8309;&#8319;&#8309; premutation</text>
<text x="345" y="125" font-size="9.5" text-anchor="middle" fill="#1f2937">50&#8211;200 repeats</text>
<text x="345" y="143" font-size="10" font-weight="700" text-anchor="middle" fill="#92400e">mild/late symptoms</text>
<text x="345" y="165" font-size="9" text-anchor="middle" fill="#4b5563">eg, fragile X premutation:</text>
<text x="345" y="180" font-size="9" text-anchor="middle" fill="#4b5563">tremor, ataxia, ovarian</text>
<text x="345" y="193" font-size="9" text-anchor="middle" fill="#4b5563">insufficiency</text>

<polygon points="440,120 470,113 470,127" fill="#4b5563"/>

<rect x="480" y="48" width="200" height="150" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="580" y="70" font-size="11.5" font-weight="700" text-anchor="middle" fill="#7f1d1d">Generation 3</text>
<rect x="495" y="82" width="170" height="24" fill="#fff" stroke="#b91c1c"/>
<text x="580" y="99" font-size="9.5" text-anchor="middle" fill="#7f1d1d">(CGG)&gt;&#8322;&#8320;&#8320; full mutation</text>
<text x="580" y="125" font-size="9.5" text-anchor="middle" fill="#1f2937">&gt;200 repeats</text>
<text x="580" y="143" font-size="10" font-weight="700" text-anchor="middle" fill="#7f1d1d">early, severe disease</text>
<text x="580" y="165" font-size="9" text-anchor="middle" fill="#4b5563">hypermethylation &#8594; gene silenced</text>
<text x="580" y="180" font-size="9" text-anchor="middle" fill="#4b5563">&#8594; intellectual disability, macroorchidism,</text>
<text x="580" y="193" font-size="9" text-anchor="middle" fill="#4b5563">long face, large ears</text>

<rect x="700" y="48" width="130" height="150" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
<text x="765" y="70" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1f2937">Repeat / disease /</text>
<text x="765" y="84" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1f2937">inheritance</text>
<text x="765" y="104" font-size="8.7" text-anchor="middle" fill="#1f2937">Huntington (CAG)n &#8212; AD</text>
<text x="765" y="122" font-size="8.7" text-anchor="middle" fill="#1f2937">Myotonic dystrophy</text>
<text x="765" y="135" font-size="8.7" text-anchor="middle" fill="#1f2937">(CTG)n &#8212; AD</text>
<text x="765" y="153" font-size="8.7" text-anchor="middle" fill="#1f2937">Fragile X (CGG)n &#8212; XD</text>
<text x="765" y="171" font-size="8.7" text-anchor="middle" fill="#1f2937">Friedreich ataxia</text>
<text x="765" y="184" font-size="8.7" text-anchor="middle" fill="#1f2937">(GAA)n &#8212; AR</text>

<rect x="30" y="215" width="800" height="65" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
<text x="430" y="238" font-size="11.5" font-weight="700" text-anchor="middle" fill="#4c1d95">Genetic anticipation = disease severity &#8593; and age of onset &#8595; in successive generations</text>
<text x="430" y="257" font-size="10" text-anchor="middle" fill="#4c1d95">Mechanism: DNA polymerase slippage during replication &#8594; repeat tract grows longer with each transmission</text>
<text x="430" y="273" font-size="9" text-anchor="middle" fill="#4c1d95">Mnemonic: "Caudate has &#8595;ACh and &#8595;GABA" (Huntington) &#8226; "Chin, Giant Gonads" (fragile X) &#8226; "Ataxic GAAit" (Friedreich)</text>
</svg>
