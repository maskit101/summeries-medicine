<svg class="diagram" viewBox="0 0 860 316" xmlns="http://www.w3.org/2000/svg">
<title>From chronic stimulus to malignancy: metaplasia → dysplasia → carcinoma</title>
<text x="430.0" y="20" font-size="12" font-weight="700" text-anchor="middle" fill="#1f2937" >Sustained chronic stimulus = ongoing selective pressure on stem cells</text>
<rect x="30" y="50" width="240" height="90" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/>
<text x="150.0" y="76" font-size="13.5" font-weight="700" text-anchor="middle" fill="#065f46" >Metaplasia</text>
<text x="150.0" y="100" font-size="9.8" font-weight="400" text-anchor="middle" fill="#1f2937" >differentiated cells, organized, still normal-looking</text>
<text x="150.0" y="124" font-size="10.6" font-weight="700" text-anchor="middle" fill="#065f46" >reversible</text>
<line x1="270" y1="95" x2="290" y2="95" stroke="#4b5563" stroke-width="2.5"/><polygon points="288,88 288,102 300,95" fill="#4b5563"/>
<rect x="300" y="50" width="240" height="90" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.6"/>
<text x="420.0" y="76" font-size="13.5" font-weight="700" text-anchor="middle" fill="#92400e" >Dysplasia</text>
<text x="420.0" y="100" font-size="9.8" font-weight="400" text-anchor="middle" fill="#1f2937" >disordered cells, still confined by basement membrane</text>
<text x="420.0" y="124" font-size="10.6" font-weight="700" text-anchor="middle" fill="#92400e" >reversible</text>
<line x1="540" y1="95" x2="560" y2="95" stroke="#4b5563" stroke-width="2.5"/><polygon points="558,88 558,102 570,95" fill="#4b5563"/>
<rect x="570" y="50" width="240" height="90" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.6"/>
<text x="690.0" y="76" font-size="13.5" font-weight="700" text-anchor="middle" fill="#7f1d1d" >Invasive carcinoma</text>
<text x="690.0" y="100" font-size="9.8" font-weight="400" text-anchor="middle" fill="#1f2937" >basement membrane breached — irreversible</text>
<text x="690.0" y="124" font-size="10.6" font-weight="700" text-anchor="middle" fill="#7f1d1d" >irreversible</text>
<line x1="30" y1="168" x2="540" y2="168" stroke="#4b5563" stroke-width="4"/>
<text x="285.0" y="158" font-size="9.3" font-weight="400" text-anchor="middle" fill="#4b5563" >intact basement membrane</text>
<line x1="570" y1="168" x2="650" y2="168" stroke="#4b5563" stroke-width="4" stroke-dasharray="6,5"/>
<line x1="670" y1="168" x2="810" y2="168" stroke="#4b5563" stroke-width="4" stroke-dasharray="6,5"/>
<text x="660" y="158" font-size="9.3" font-weight="700" text-anchor="middle" fill="#b91c1c" >breached</text>
<rect x="20" y="198" width="820" height="44" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.3"/>
<text x="430.0" y="216" font-size="10.6" font-weight="700" text-anchor="middle" fill="#1f2937" >Example: chronic reflux (GERD) → Barrett's esophagus (metaplasia) → dysplasia → esophageal adenocarcinoma</text>
<text x="430.0" y="232" font-size="9.6" font-weight="400" text-anchor="middle" fill="#4b5563" >removing the stimulus at the metaplasia/dysplasia stage can still halt or regress it</text>
<rect x="20" y="272" width="820" height="34" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
<text x="430.0" y="294" font-size="10.3" font-weight="700" text-anchor="middle" fill="#92400e" >What "moves": the critical boundary is the basement membrane — as long as the abnormal cells haven't crossed it, the state is reversible</text>
</svg>