<svg class="diagram" viewBox="0 0 860 200" xmlns="http://www.w3.org/2000/svg">
<title>The seven steps of collagen synthesis and a disease at each step</title>
<text x="430" y="20" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1f2937">From "translation" to "mature collagen fiber" — seven steps</text>
<rect x="20" y="42" width="105" height="55" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
<text x="72" y="63" font-size="9.4" font-weight="700" text-anchor="middle" fill="#1e3a8a">1. Translation</text>
<text x="72" y="80" font-size="8.4" text-anchor="middle" fill="#1f2937">Gly-X-Y in RER</text>
<rect x="135" y="42" width="105" height="55" rx="6" fill="#fce7f3" stroke="#a21caf" stroke-width="1.2"/>
<text x="187" y="63" font-size="9.4" font-weight="700" text-anchor="middle" fill="#701a75">2. Hydroxylation</text>
<text x="187" y="80" font-size="8.4" text-anchor="middle" fill="#701a75">Vitamin C ← scurvy</text>
<rect x="250" y="42" width="105" height="55" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.2"/>
<text x="302" y="58" font-size="9.4" font-weight="700" text-anchor="middle" fill="#7f1d1d">3. Glycosylation</text>
<text x="302" y="72" font-size="9.4" font-weight="700" text-anchor="middle" fill="#7f1d1d">+ triple helix</text>
<text x="302" y="86" font-size="8.4" text-anchor="middle" fill="#7f1d1d">← osteogen. imperfecta</text>
<rect x="365" y="42" width="105" height="55" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.2"/>
<text x="417" y="63" font-size="9.4" font-weight="700" text-anchor="middle" fill="#065f46">4. Exocytosis</text>
<text x="417" y="80" font-size="8.4" text-anchor="middle" fill="#1f2937">Procollagen leaves cell</text>
<rect x="480" y="42" width="105" height="55" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
<text x="532" y="58" font-size="9.4" font-weight="700" text-anchor="middle" fill="#1e3a8a">5. Proteolytic</text>
<text x="532" y="72" font-size="9.4" font-weight="700" text-anchor="middle" fill="#1e3a8a">processing</text>
<text x="532" y="86" font-size="8.4" text-anchor="middle" fill="#1f2937">→tropocollagen</text>
<rect x="595" y="42" width="105" height="55" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/>
<text x="647" y="63" font-size="9.4" font-weight="700" text-anchor="middle" fill="#1f2937">6. Self-assembly</text>
<text x="647" y="80" font-size="8.4" text-anchor="middle" fill="#1f2937">into collagen fibrils</text>
<rect x="710" y="42" width="130" height="55" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/>
<text x="775" y="58" font-size="9.4" font-weight="700" text-anchor="middle" fill="#92400e">7. Cross-linking</text>
<text x="775" y="72" font-size="8.4" text-anchor="middle" fill="#92400e">Lysyl oxidase (copper)</text>
<text x="775" y="86" font-size="8.4" text-anchor="middle" fill="#92400e">← Menkes disease</text>
<polygon points="128,68 133,63 133,73" fill="#4b5563"/>
<polygon points="243,68 248,63 248,73" fill="#4b5563"/>
<polygon points="358,68 363,63 363,73" fill="#4b5563"/>
<polygon points="473,68 478,63 478,73" fill="#4b5563"/>
<polygon points="588,68 593,63 593,73" fill="#4b5563"/>
<polygon points="703,68 708,63 708,73" fill="#4b5563"/>
<rect x="30" y="115" width="800" height="70" rx="8" fill="#f8fafc" stroke="#9ca3af" stroke-width="1"/>
<text x="430" y="140" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1f2937">Glycine = 1/3 of amino acids (small size needed in the crowded triple-helix core)</text>
<text x="430" y="160" font-size="11" text-anchor="middle" fill="#4b5563">A defect at each step → a different disease: vitamin C→scurvy, helix→OI, cross-linking→Menkes</text>
</svg>
