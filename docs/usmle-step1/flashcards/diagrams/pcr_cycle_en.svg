<svg class="diagram" viewBox="0 0 860 330" xmlns="http://www.w3.org/2000/svg">
<title>PCR cycle: Denaturation, Annealing, Elongation</title>
<text x="430" y="24" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1f2937">The three-step thermal cycle of PCR (repeated 20-40 times)</text>
<rect x="30" y="55" width="245" height="110" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="152" y="80" font-size="12.5" font-weight="700" text-anchor="middle" fill="#7f1d1d">1. Denaturation</text>
<text x="152" y="98" font-size="10.5" text-anchor="middle" fill="#7f1d1d">~95°C</text>
<text x="152" y="116" font-size="10" text-anchor="middle" fill="#7f1d1d">DNA strands separate</text>
<text x="152" y="132" font-size="10" text-anchor="middle" fill="#7f1d1d">(H-bonds broken)</text>
<text x="152" y="150" font-size="9.5" text-anchor="middle" fill="#7f1d1d">template + primers + polymerase + dNTPs</text>
<polygon points="280,102 310,95 310,109" fill="#4b5563"/>
<rect x="315" y="55" width="245" height="110" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="437" y="80" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1e3a8a">2. Annealing</text>
<text x="437" y="98" font-size="10.5" text-anchor="middle" fill="#1e3a8a">~50-65°C (cooled)</text>
<text x="437" y="116" font-size="10" text-anchor="middle" fill="#1f2937">Primers bind their</text>
<text x="437" y="132" font-size="10" text-anchor="middle" fill="#1f2937">complementary template sequence</text>
<polygon points="565,102 595,95 595,109" fill="#4b5563"/>
<rect x="600" y="55" width="230" height="110" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
<text x="715" y="80" font-size="12.5" font-weight="700" text-anchor="middle" fill="#065f46">3. Elongation</text>
<text x="715" y="98" font-size="10.5" text-anchor="middle" fill="#065f46">~72°C (heated)</text>
<text x="715" y="116" font-size="10" text-anchor="middle" fill="#1f2937">Heat-stable DNA polymerase</text>
<text x="715" y="132" font-size="10" text-anchor="middle" fill="#1f2937">adds dNTPs onward from primer</text>
<path d="M 715 165 C 715 210, 152 210, 152 165" fill="none" stroke="#4b5563" stroke-width="2" marker-end="url(#arrowPcrEn)"/>
<defs>
  <marker id="arrowPcrEn" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
    <polygon points="0,0 8,3 0,6" fill="#4b5563"/>
  </marker>
</defs>
<text x="430" y="228" font-size="11.5" font-weight="700" text-anchor="middle" fill="#374151">Repeats n times — exponential doubling (≈2ⁿ copies) until enough DNA is present</text>
<rect x="30" y="250" width="800" height="60" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
<text x="430" y="273" font-size="11.5" font-weight="700" text-anchor="middle" fill="#92400e">Diagnostic use: neonatal HIV (before maternal antibodies clear), herpes encephalitis (HSV DNA in CSF)</text>
<text x="430" y="293" font-size="10.5" text-anchor="middle" fill="#92400e">Extremely sensitive — detects tiny amounts of DNA/RNA otherwise undetectable</text>
</svg>
