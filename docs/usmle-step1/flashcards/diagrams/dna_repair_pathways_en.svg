<svg class="diagram" viewBox="0 0 860 404" xmlns="http://www.w3.org/2000/svg">
<title>NHEJ vs homologous recombination: two ways to repair a double-strand break</title>
<text x="430.0" y="20" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1f2937" >Double-strand DNA break — two different repair strategies</text>
<rect x="30" y="40" width="800" height="34" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
<text x="430.0" y="62" font-size="11.5" font-weight="400" text-anchor="middle" fill="#1f2937" >broken ends —— DNA —— broken ends</text>
<line x1="220" y1="74" x2="220" y2="88" stroke="#4b5563" stroke-width="2.5"/><polygon points="213,86 227,86 220,98" fill="#4b5563"/>
<line x1="640" y1="74" x2="640" y2="88" stroke="#4b5563" stroke-width="2.5"/><polygon points="633,86 647,86 640,98" fill="#4b5563"/>
<rect x="30" y="100" width="380" height="22" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="220.0" y="116" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1e3a8a" >NHEJ (nonhomologous end joining)</text>
<rect x="450" y="100" width="380" height="22" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
<text x="640.0" y="116" font-size="12.5" font-weight="700" text-anchor="middle" fill="#065f46" >Homologous recombination (HR)</text>
<rect x="30" y="134" width="26" height="24" rx="5" fill="#2563eb" stroke="#1e3a8a" stroke-width="1"/>
<text x="43" y="151" font-size="12" font-weight="700" text-anchor="middle" fill="#fff" >1</text>
<text x="64" y="151" font-size="10.3" font-weight="400" text-anchor="start" fill="#1f2937" >Two broken ends are exposed</text>
<rect x="30" y="168" width="26" height="24" rx="5" fill="#2563eb" stroke="#1e3a8a" stroke-width="1"/>
<text x="43" y="185" font-size="12" font-weight="700" text-anchor="middle" fill="#fff" >2</text>
<text x="64" y="185" font-size="10.3" font-weight="400" text-anchor="start" fill="#1f2937" >Ku70/Ku80 heterodimer binds and protects each end</text>
<rect x="30" y="202" width="26" height="24" rx="5" fill="#2563eb" stroke="#1e3a8a" stroke-width="1"/>
<text x="43" y="219" font-size="12" font-weight="700" text-anchor="middle" fill="#fff" >3</text>
<text x="64" y="219" font-size="10.3" font-weight="400" text-anchor="start" fill="#1f2937" >DNA-PKcs recruited — stabilizes and bridges the ends</text>
<rect x="30" y="236" width="26" height="24" rx="5" fill="#2563eb" stroke="#1e3a8a" stroke-width="1"/>
<text x="43" y="253" font-size="12" font-weight="700" text-anchor="middle" fill="#fff" >4</text>
<text x="64" y="253" font-size="10.3" font-weight="400" text-anchor="start" fill="#1f2937" >Minimal end processing (short trimming/fill-in) — nucleotides may be lost/altered here</text>
<rect x="30" y="270" width="26" height="24" rx="5" fill="#2563eb" stroke="#1e3a8a" stroke-width="1"/>
<text x="43" y="287" font-size="12" font-weight="700" text-anchor="middle" fill="#fff" >5</text>
<text x="64" y="287" font-size="10.3" font-weight="400" text-anchor="start" fill="#1f2937" >Ligase IV + XRCC4 complex seals the ends</text>
<rect x="450" y="134" width="26" height="24" rx="5" fill="#047857" stroke="#065f46" stroke-width="1"/>
<text x="463" y="151" font-size="12" font-weight="700" text-anchor="middle" fill="#fff" >1</text>
<text x="484" y="151" font-size="10.3" font-weight="400" text-anchor="start" fill="#1f2937" >Two broken ends are exposed</text>
<rect x="450" y="168" width="26" height="24" rx="5" fill="#047857" stroke="#065f46" stroke-width="1"/>
<text x="463" y="185" font-size="12" font-weight="700" text-anchor="middle" fill="#fff" >2</text>
<text x="484" y="185" font-size="10.3" font-weight="400" text-anchor="start" fill="#1f2937" >End resection exposes a single-stranded 3' overhang</text>
<rect x="450" y="202" width="26" height="24" rx="5" fill="#047857" stroke="#065f46" stroke-width="1"/>
<text x="463" y="219" font-size="12" font-weight="700" text-anchor="middle" fill="#fff" >3</text>
<text x="484" y="219" font-size="10.3" font-weight="400" text-anchor="start" fill="#1f2937" >Strand invades the intact sister chromatid — used as an exact template</text>
<rect x="450" y="236" width="26" height="24" rx="5" fill="#047857" stroke="#065f46" stroke-width="1"/>
<text x="463" y="253" font-size="12" font-weight="700" text-anchor="middle" fill="#fff" >4</text>
<text x="484" y="253" font-size="10.3" font-weight="400" text-anchor="start" fill="#1f2937" >Accurate synthesis copying the homologous template</text>
<rect x="450" y="270" width="26" height="24" rx="5" fill="#047857" stroke="#065f46" stroke-width="1"/>
<text x="463" y="287" font-size="12" font-weight="700" text-anchor="middle" fill="#fff" >5</text>
<text x="484" y="287" font-size="10.3" font-weight="400" text-anchor="start" fill="#1f2937" >Junction resolution — sequence restored exactly, no information lost</text>
<rect x="30" y="310" width="380" height="40" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
<text x="220.0" y="326" font-size="9.6" font-weight="700" text-anchor="middle" fill="#1e3a8a" >Available in any cell-cycle phase • fast • error-prone</text>
<text x="220.0" y="342" font-size="9.3" font-weight="400" text-anchor="middle" fill="#4b5563" >No classic disease is tied to a primary NHEJ defect (unlike HR)</text>
<rect x="450" y="310" width="380" height="40" rx="6" fill="#d1fae5" stroke="#047857" stroke-width="1"/>
<text x="640.0" y="326" font-size="9.6" font-weight="700" text-anchor="middle" fill="#065f46" >Available only in S/G2 (sister chromatid exists) • slower • accurate</text>
<text x="640.0" y="342" font-size="9.3" font-weight="400" text-anchor="middle" fill="#4b5563" >Impaired in BRCA1/BRCA2 mutations (breast/ovarian cancer) and some Fanconi anemia subtypes</text>
<rect x="30" y="360" width="800" height="34" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
<text x="430.0" y="382" font-size="10.8" font-weight="700" text-anchor="middle" fill="#92400e" >What actually "moves": in NHEJ, single nucleotides are trimmed/added right at the junction; in HR, a whole strand "invades" and copies sequence from the other chromatid</text>
</svg>