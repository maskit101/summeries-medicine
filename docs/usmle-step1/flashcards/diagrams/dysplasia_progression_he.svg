<svg class="diagram" viewBox="0 0 960 430" xmlns="http://www.w3.org/2000/svg" direction="ltr">
<title>רצף הפרוגרסיה הניאופלסטית: מאפיתל תקין ועד גרורה</title>
<text x="480" y="26" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2937">רצף הפרוגרסיה הניאופלסטית — מאפיתל תקין ועד גרורה מרוחקת</text>

<!-- 4 panels: normal, dysplasia, CIS, invasive -->
<!-- Panel 1: Normal -->
<g>
<rect x="15" y="60" width="220" height="230" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
<text x="125" y="82" font-size="12.5" font-weight="700" text-anchor="middle" fill="#065f46">1. אפיתל תקין</text>
<!-- basement membrane -->
<rect x="30" y="230" width="190" height="8" fill="#334155"/>
<text x="125" y="252" font-size="9" text-anchor="middle" fill="#334155">קרום בסיס (שלם)</text>
<!-- uniform cell layer with polarity -->
<rect x="30" y="160" width="190" height="70" fill="#a7f3d0" opacity="0.5"/>
<g>
<rect x="38" y="165" width="20" height="60" rx="4" fill="#6ee7b7" stroke="#047857"/>
<circle cx="48" cy="215" r="5" fill="#065f46"/>
<rect x="64" y="165" width="20" height="60" rx="4" fill="#6ee7b7" stroke="#047857"/>
<circle cx="74" cy="215" r="5" fill="#065f46"/>
<rect x="90" y="165" width="20" height="60" rx="4" fill="#6ee7b7" stroke="#047857"/>
<circle cx="100" cy="215" r="5" fill="#065f46"/>
<rect x="116" y="165" width="20" height="60" rx="4" fill="#6ee7b7" stroke="#047857"/>
<circle cx="126" cy="215" r="5" fill="#065f46"/>
<rect x="142" y="165" width="20" height="60" rx="4" fill="#6ee7b7" stroke="#047857"/>
<circle cx="152" cy="215" r="5" fill="#065f46"/>
<rect x="168" y="165" width="20" height="60" rx="4" fill="#6ee7b7" stroke="#047857"/>
<circle cx="178" cy="215" r="5" fill="#065f46"/>
</g>
<text x="125" y="150" font-size="8.5" text-anchor="middle" fill="#065f46">קוטביות בסיס→אפיקלי אחידה</text>
<line x1="60" y1="90" x2="60" y2="150" stroke="#94a3b8" stroke-width="4"/>
<polygon points="60,150 55,140 65,140" fill="#94a3b8"/>
<text x="65" y="100" font-size="7.5" fill="#4b5563">אפיקלי</text>
<text x="65" y="145" font-size="7.5" fill="#4b5563">בסיסי</text>
<text x="125" y="270" font-size="9" text-anchor="middle" fill="#1f2937">גודל/צורה אחידים</text>
</g>

<!-- arrow -->
<polygon points="238,175 262,168 262,182" fill="#4b5563"/>

<!-- Panel 2: Dysplasia -->
<g>
<rect x="265" y="60" width="220" height="230" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="375" y="82" font-size="12.5" font-weight="700" text-anchor="middle" fill="#92400e">2. דיספלזיה</text>
<rect x="280" y="230" width="190" height="8" fill="#334155"/>
<text x="375" y="252" font-size="9" text-anchor="middle" fill="#334155">קרום בסיס (עדיין שלם)</text>
<rect x="280" y="150" width="190" height="80" fill="#fde68a" opacity="0.4"/>
<!-- pleomorphic irregular cells -->
<ellipse cx="305" cy="205" rx="14" ry="20" fill="#fcd34d" stroke="#92400e" transform="rotate(-10 305 205)"/>
<circle cx="305" cy="205" r="8" fill="#78350f"/>
<ellipse cx="335" cy="195" rx="18" ry="14" fill="#fcd34d" stroke="#92400e" transform="rotate(15 335 195)"/>
<circle cx="335" cy="195" r="9" fill="#78350f"/>
<ellipse cx="368" cy="210" rx="12" ry="24" fill="#fcd34d" stroke="#92400e"/>
<circle cx="368" cy="210" r="9" fill="#78350f"/>
<ellipse cx="400" cy="190" rx="20" ry="13" fill="#fcd34d" stroke="#92400e" transform="rotate(-20 400 190)"/>
<circle cx="400" cy="190" r="8.5" fill="#78350f"/>
<ellipse cx="435" cy="208" rx="15" ry="18" fill="#fcd34d" stroke="#92400e" transform="rotate(8 435 208)"/>
<circle cx="435" cy="208" r="9.5" fill="#78350f"/>
<text x="375" y="146" font-size="8.5" text-anchor="middle" fill="#92400e">אובדן קוטביות + פליאומורפיזם</text>
<text x="375" y="266" font-size="8.5" font-weight="700" text-anchor="middle" fill="#92400e">↑ יחס גרעין:ציטופלזמה</text>
<text x="375" y="280" font-size="8" text-anchor="middle" fill="#1f2937">הפיך (לרוב)</text>
</g>

<polygon points="488,175 512,168 512,182" fill="#4b5563"/>

<!-- Panel 3: CIS -->
<g>
<rect x="515" y="60" width="220" height="230" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="625" y="82" font-size="12.5" font-weight="700" text-anchor="middle" fill="#7f1d1d">3. קרצינומה In Situ</text>
<rect x="530" y="230" width="190" height="8" fill="#334155"/>
<text x="625" y="252" font-size="9" text-anchor="middle" fill="#334155">קרום בסיס — עדיין שלם!</text>
<rect x="530" y="140" width="190" height="90" fill="#fecaca" opacity="0.5"/>
<!-- full thickness severe dysplasia -->
<ellipse cx="555" cy="150" rx="13" ry="12" fill="#fca5a5" stroke="#7f1d1d"/><circle cx="555" cy="150" r="8" fill="#7f1d1d"/>
<ellipse cx="580" cy="170" rx="14" ry="13" fill="#fca5a5" stroke="#7f1d1d"/><circle cx="580" cy="170" r="9" fill="#7f1d1d"/>
<ellipse cx="608" cy="150" rx="12" ry="14" fill="#fca5a5" stroke="#7f1d1d"/><circle cx="608" cy="150" r="8.5" fill="#7f1d1d"/>
<ellipse cx="635" cy="195" rx="15" ry="12" fill="#fca5a5" stroke="#7f1d1d"/><circle cx="635" cy="195" r="9" fill="#7f1d1d"/>
<ellipse cx="660" cy="160" rx="13" ry="15" fill="#fca5a5" stroke="#7f1d1d"/><circle cx="660" cy="160" r="9" fill="#7f1d1d"/>
<ellipse cx="690" cy="180" rx="14" ry="13" fill="#fca5a5" stroke="#7f1d1d"/><circle cx="690" cy="180" r="9" fill="#7f1d1d"/>
<ellipse cx="565" cy="210" rx="13" ry="12" fill="#fca5a5" stroke="#7f1d1d"/><circle cx="565" cy="210" r="8" fill="#7f1d1d"/>
<ellipse cx="600" cy="215" rx="14" ry="12" fill="#fca5a5" stroke="#7f1d1d"/><circle cx="600" cy="215" r="8.5" fill="#7f1d1d"/>
<ellipse cx="655" cy="215" rx="13" ry="12" fill="#fca5a5" stroke="#7f1d1d"/><circle cx="655" cy="215" r="8.5" fill="#7f1d1d"/>
<text x="625" y="264" font-size="8.5" font-weight="700" text-anchor="middle" fill="#7f1d1d">דיספלזיה חמורה בכל עובי האפיתל</text>
<text x="625" y="278" font-size="8" text-anchor="middle" fill="#1f2937">בלתי-הפיך; לא חדר לקרום הבסיס</text>
</g>

<polygon points="738,175 762,168 762,182" fill="#4b5563"/>

<!-- Panel 4: Invasive + metastasis -->
<g>
<rect x="765" y="60" width="180" height="230" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
<text x="855" y="82" font-size="12.5" font-weight="700" text-anchor="middle" fill="#4c1d95">4. פלישה וגרורה</text>
<!-- broken basement membrane -->
<rect x="780" y="230" width="60" height="8" fill="#334155"/>
<rect x="855" y="230" width="70" height="8" fill="#334155"/>
<text x="855" y="252" font-size="8" text-anchor="middle" fill="#334155">קרום בסיס נפרץ</text>
<!-- malignant cells breaking through -->
<ellipse cx="800" cy="200" rx="12" ry="11" fill="#c4b5fd" stroke="#4c1d95"/><circle cx="800" cy="200" r="7" fill="#4c1d95"/>
<ellipse cx="830" cy="185" rx="12" ry="11" fill="#c4b5fd" stroke="#4c1d95"/><circle cx="830" cy="185" r="7" fill="#4c1d95"/>
<!-- invading cells crossing membrane into stroma -->
<ellipse cx="845" cy="245" rx="11" ry="10" fill="#c4b5fd" stroke="#4c1d95"/><circle cx="845" cy="245" r="6.5" fill="#4c1d95"/>
<ellipse cx="870" cy="255" rx="11" ry="10" fill="#c4b5fd" stroke="#4c1d95"/><circle cx="870" cy="255" r="6.5" fill="#4c1d95"/>
<!-- vessel with tumor emboli -->
<ellipse cx="880" cy="130" rx="45" ry="16" fill="#fecaca" opacity="0.6" stroke="#b91c1c" stroke-width="1"/>
<circle cx="865" cy="130" r="6" fill="#4c1d95"/>
<circle cx="895" cy="128" r="6" fill="#4c1d95"/>
<text x="880" y="112" font-size="7.5" text-anchor="middle" fill="#7f1d1d">כלי דם/לימפה — תסחיף גידולי</text>
<text x="855" y="278" font-size="8" font-weight="700" text-anchor="middle" fill="#4c1d95">קולגנאזות/הידרולאזות + אובדן E-cadherin</text>
</g>

<!-- bottom legend strip -->
<rect x="15" y="305" width="930" height="105" rx="8" fill="#f8fafc" stroke="#9ca3af" stroke-width="1"/>
<text x="480" y="326" font-size="11" font-weight="700" text-anchor="middle" fill="#1f2937">נקודת המפתח: קרום הבסיס נשאר שלם עד שלב 4 (הבדל דיספלזיה/CIS מול סרטן פולשני)</text>
<text x="480" y="346" font-size="9.5" text-anchor="middle" fill="#1f2937">דיספלזיה: אובדן אחידות גודל/צורה (פליאומורפיזם) + אובדן כיוון רקמתי + ↑יחס גרעין:ציטופלזמה — לרוב הפיך</text>
<text x="480" y="364" font-size="9.5" text-anchor="middle" fill="#1f2937">CIS: דיספלזיה חמורה בעובי מלא, בלתי-הפיך, אך ללא חדירה דרך קרום הבסיס השלם</text>
<text x="480" y="382" font-size="9.5" text-anchor="middle" fill="#1f2937">פלישה: תאים חודרים קרום הבסיס ע"י קולגנאזות/הידרולאזות (מטלופרוטאינזות); אובדן קשרי תא-תא ע"י אינאקטיבציה של E-cadherin</text>
<text x="480" y="400" font-size="9.5" font-weight="700" text-anchor="middle" fill="#4c1d95">גרורה: התפשטות לאיבר מרוחק דרך לימפה או דם</text>
</svg>
