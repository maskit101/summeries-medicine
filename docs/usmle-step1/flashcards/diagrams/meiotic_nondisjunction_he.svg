<svg class="diagram" viewBox="0 0 860 370" xmlns="http://www.w3.org/2000/svg" direction="ltr">
<title>אי-הפרדה מייוטית: שגיאות במיוזה I מול מיוזה II</title>
<text x="430" y="24" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1f2937">אי-הפרדה: כרומוזומים הומולוגיים/כרומטידות אחיות לא נפרדים</text>

<rect x="30" y="48" width="380" height="270" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="220" y="70" font-size="12.5" font-weight="700" text-anchor="middle" fill="#7f1d1d">אי-הפרדה במיוזה I</text>
<text x="220" y="88" font-size="9.5" text-anchor="middle" fill="#7f1d1d">זוג הומולוגי לא נפרד</text>
<circle cx="140" cy="120" r="9" fill="#2563eb"/><circle cx="160" cy="120" r="9" fill="#2563eb"/>
<circle cx="280" cy="120" r="9" fill="#b45309"/><circle cx="300" cy="120" r="9" fill="#b45309"/>
<text x="220" y="140" font-size="9" text-anchor="middle" fill="#4b5563">שני ההומולוגים לאותו קוטב (שגיאת MI)</text>
<path d="M 150 150 L 150 180" stroke="#4b5563" stroke-width="2" marker-end="url(#ndArrHe1)"/>
<path d="M 290 150 L 290 180" stroke="#4b5563" stroke-width="2" marker-end="url(#ndArrHe1)"/>
<defs><marker id="ndArrHe1" markerWidth="10" markerHeight="10" refX="5" refY="8" orient="auto"><polygon points="0,0 5,9 10,0" fill="#4b5563"/></marker></defs>
<text x="150" y="196" font-size="9" text-anchor="middle" fill="#374151">MII ממשיכה תקין</text>
<text x="290" y="196" font-size="9" text-anchor="middle" fill="#374151">MII ממשיכה תקין</text>
<rect x="55" y="215" width="330" height="90" rx="6" fill="#fff" stroke="#9ca3af"/>
<text x="220" y="233" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1f2937">4 תאי מין נוצרים:</text>
<circle cx="100" cy="255" r="11" fill="#fecaca" stroke="#b91c1c"/><text x="100" y="259" font-size="8.5" text-anchor="middle" fill="#7f1d1d">n+1</text>
<circle cx="160" cy="255" r="11" fill="#fecaca" stroke="#b91c1c"/><text x="160" y="259" font-size="8.5" text-anchor="middle" fill="#7f1d1d">n+1</text>
<circle cx="280" cy="255" r="11" fill="#e5e7eb" stroke="#6b7280"/><text x="280" y="259" font-size="8.5" text-anchor="middle" fill="#374151">n&#8722;1</text>
<circle cx="340" cy="255" r="11" fill="#e5e7eb" stroke="#6b7280"/><text x="340" y="259" font-size="8.5" text-anchor="middle" fill="#374151">n&#8722;1</text>
<text x="220" y="285" font-size="10" font-weight="700" text-anchor="middle" fill="#7f1d1d">2 תאי טריזומיה + 2 תאי מונוזומיה</text>
<text x="220" y="300" font-size="9" text-anchor="middle" fill="#7f1d1d">(אף תא מין תקין)</text>

<rect x="450" y="48" width="380" height="270" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="640" y="70" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1e3a8a">אי-הפרדה במיוזה II</text>
<text x="640" y="88" font-size="9.5" text-anchor="middle" fill="#1e3a8a">MI תקינה; כרומטידות אחיות לא נפרדות</text>
<circle cx="560" cy="120" r="9" fill="#2563eb"/>
<circle cx="700" cy="115" r="9" fill="#047857"/><circle cx="700" cy="130" r="9" fill="#047857"/>
<text x="640" y="150" font-size="9" text-anchor="middle" fill="#4b5563">תא בת אחד מתחלק תקין, השני לא (שגיאת MII)</text>
<rect x="475" y="215" width="330" height="90" rx="6" fill="#fff" stroke="#9ca3af"/>
<text x="640" y="233" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1f2937">4 תאי מין נוצרים:</text>
<circle cx="520" cy="255" r="11" fill="#d1fae5" stroke="#047857"/><text x="520" y="259" font-size="8.5" text-anchor="middle" fill="#065f46">n</text>
<circle cx="580" cy="255" r="11" fill="#d1fae5" stroke="#047857"/><text x="580" y="259" font-size="8.5" text-anchor="middle" fill="#065f46">n</text>
<circle cx="690" cy="255" r="11" fill="#e5e7eb" stroke="#6b7280"/><text x="690" y="259" font-size="8.5" text-anchor="middle" fill="#374151">n&#8722;1</text>
<circle cx="750" cy="255" r="11" fill="#fecaca" stroke="#b91c1c"/><text x="750" y="259" font-size="8.5" text-anchor="middle" fill="#7f1d1d">n+1</text>
<text x="640" y="285" font-size="10" font-weight="700" text-anchor="middle" fill="#1e3a8a">2 תקינים + 1 מונוזומיה + 1 טריזומיה</text>
<text x="640" y="300" font-size="9" text-anchor="middle" fill="#1e3a8a">(השפעה קלה יותר מאשר שגיאת MI)</text>

<rect x="30" y="330" width="800" height="30" rx="6" fill="#fffbeb" stroke="#fcd34d"/>
<text x="430" y="350" font-size="10.5" font-weight="700" text-anchor="middle" fill="#92400e">תסמונת דאון: 95% אי-הפרדה (לרוב MI, &#8593; עם גיל אמהי), 4% טרנסלוקציה רוברטסונית, 1% מוזאיקה (לאחר הפריה)</text>
</svg>
