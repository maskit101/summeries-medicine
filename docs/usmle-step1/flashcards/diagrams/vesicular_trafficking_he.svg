<svg class="diagram" viewBox="0 0 860 260" xmlns="http://www.w3.org/2000/svg">
<title>שלוש מעטפות התחבורה: כיוון ויעד</title>
<text x="430" y="24" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937">מעטפות התחבורה השלפוחיתית — כיוון ויעד</text>
<rect x="30" y="55" width="230" height="90" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="145" y="80" font-size="13" font-weight="700" text-anchor="middle" fill="#1e3a8a">COPII</text>
<text x="145" y="100" font-size="11" text-anchor="middle" fill="#1f2937">ER ← cis-Golgi</text>
<text x="145" y="118" font-size="10.5" text-anchor="middle" fill="#1f2937">אנטרוגרד (קדימה)</text>
<text x="145" y="134" font-size="10" font-weight="700" text-anchor="middle" fill="#1e3a8a">"שני צעדים קדימה"</text>
<rect x="305" y="55" width="230" height="90" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
<text x="420" y="80" font-size="13" font-weight="700" text-anchor="middle" fill="#065f46">COPI</text>
<text x="420" y="100" font-size="11" text-anchor="middle" fill="#1f2937">Golgi↔Golgi, cis-Golgi←ER</text>
<text x="420" y="118" font-size="10.5" text-anchor="middle" fill="#1f2937">רטרוגרד (לאחור)</text>
<text x="420" y="134" font-size="10" font-weight="700" text-anchor="middle" fill="#065f46">"צעד אחד אחורה"</text>
<rect x="580" y="55" width="250" height="90" rx="8" fill="#fce7f3" stroke="#a21caf" stroke-width="1.5"/>
<text x="705" y="80" font-size="13" font-weight="700" text-anchor="middle" fill="#701a75">קלתרין (Clathrin)</text>
<text x="705" y="100" font-size="11" text-anchor="middle" fill="#1f2937">trans-Golgi→ליזוזום</text>
<text x="705" y="118" font-size="10.5" text-anchor="middle" fill="#1f2937">קרום←אנדוזום (אנדוציטוזה)</text>
<text x="705" y="134" font-size="10" font-weight="700" text-anchor="middle" fill="#701a75">למשל: קליטת LDL</text>
<rect x="30" y="165" width="800" height="80" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
<text x="430" y="188" font-size="11.5" font-weight="700" text-anchor="middle" fill="#92400e">מחלת תאי-I: פגם בזרחון מנוז (↓M6P) בגולג'י על אנזימי ליזוזום</text>
<text x="430" y="207" font-size="10.8" text-anchor="middle" fill="#92400e">← האנזימים "מפספסים" את התג ומופרשים החוצה במקום להגיע לליזוזום</text>
<text x="430" y="226" font-size="10.8" text-anchor="middle" fill="#92400e">→ הליזוזום ריק (גופיפי הכלה), ↑ אנזימים ליזוזומליים בפלזמה</text>
</svg>
