<svg class="diagram" viewBox="0 0 860 240" xmlns="http://www.w3.org/2000/svg">
<title>The three single-strand repair mechanisms: NER, BER, MMR</title>
<text x="430.0" y="18" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1f2937" >What kind of defect each mechanism fixes, and how</text>
<rect x="15" y="38" width="260" height="190" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="145.0" y="63" font-size="14" font-weight="700" text-anchor="middle" fill="#1e3a8a" >NER</text>
<text x="145.0" y="85" font-size="11" font-weight="400" text-anchor="middle" fill="#1f2937" >helix-distorting defect</text>
<text x="145.0" y="103" font-size="10.3" font-weight="400" text-anchor="middle" fill="#1f2937" >(pyrimidine dimer, UV)</text>
<text x="145.0" y="130" font-size="9.8" font-weight="400" text-anchor="middle" fill="#1f2937" >excise a whole oligonucleotide around the defect</text>
<text x="145.0" y="155" font-size="10.6" font-weight="700" text-anchor="middle" fill="#1e3a8a" >G1 phase</text>
<text x="145.0" y="205" font-size="10" font-weight="700" text-anchor="middle" fill="#b91c1c" >Defective: xeroderma pigmentosum</text>
<rect x="290" y="38" width="260" height="190" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
<text x="420.0" y="63" font-size="14" font-weight="700" text-anchor="middle" fill="#065f46" >BER</text>
<text x="420.0" y="85" font-size="11" font-weight="400" text-anchor="middle" fill="#1f2937" >single damaged base</text>
<text x="420.0" y="103" font-size="10.3" font-weight="400" text-anchor="middle" fill="#1f2937" >(deamination, oxidation)</text>
<text x="420.0" y="130" font-size="9.8" font-weight="400" text-anchor="middle" fill="#1f2937" >glycosylase→endonuclease/lyase→pol β→ligase</text>
<text x="420.0" y="155" font-size="10.6" font-weight="700" text-anchor="middle" fill="#065f46" >throughout the cell cycle</text>
<text x="420.0" y="205" font-size="10" font-weight="700" text-anchor="middle" fill="#b91c1c" >"GEL Please" mnemonic</text>
<rect x="565" y="38" width="260" height="190" rx="10" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
<text x="695.0" y="63" font-size="14" font-weight="700" text-anchor="middle" fill="#4c1d95" >MMR</text>
<text x="695.0" y="85" font-size="11" font-weight="400" text-anchor="middle" fill="#1f2937" >post-replication mismatch</text>
<text x="695.0" y="103" font-size="10.3" font-weight="400" text-anchor="middle" fill="#1f2937" >in the newly made strand</text>
<text x="695.0" y="130" font-size="9.8" font-weight="400" text-anchor="middle" fill="#1f2937" >removes mismatched nucleotides and repairs</text>
<text x="695.0" y="155" font-size="10.6" font-weight="700" text-anchor="middle" fill="#4c1d95" >S phase</text>
<text x="695.0" y="205" font-size="10" font-weight="700" text-anchor="middle" fill="#b91c1c" >Defective: Lynch syndrome (HNPCC)</text>
</svg>