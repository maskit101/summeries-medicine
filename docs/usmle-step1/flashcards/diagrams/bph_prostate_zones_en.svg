<svg class="diagram" viewBox="0 0 860 394" xmlns="http://www.w3.org/2000/svg">
<title>Prostate zones: transitional (BPH) vs peripheral (cancer)</title>
<text x="430.0" y="20" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937" >Schematic cross-section of the prostate</text>
<circle cx="300" cy="190" r="130" fill="#fce7f3" stroke="#a21caf" stroke-width="2"/>
<text x="300" y="50" font-size="11" font-weight="700" text-anchor="middle" fill="#701a75" >peripheral zone</text>
<circle cx="300" cy="190" r="55" fill="#dbeafe" stroke="#2563eb" stroke-width="2.2"/>
<text x="300" y="170" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1e3a8a" >transitional</text>
<text x="300" y="184" font-size="9" font-weight="400" text-anchor="middle" fill="#1e3a8a" >(periurethral)</text>
<line x1="300" y1="55" x2="300" y2="325" stroke="#4b5563" stroke-width="6"/>
<text x="370" y="314" font-size="9.5" font-weight="400" text-anchor="middle" fill="#4b5563" >urethra</text>
<rect x="560" y="50" width="260" height="120" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="690" y="72" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1e3a8a" >BPH — transitional zone</text>
<text x="690" y="94" font-size="9.8" font-weight="400" text-anchor="middle" fill="#1f2937" >caused by accumulation of</text>
<text x="690" y="110" font-size="9.8" font-weight="700" text-anchor="middle" fill="#1e3a8a" >dihydrotestosterone (DHT)</text>
<text x="690" y="132" font-size="9.8" font-weight="400" text-anchor="middle" fill="#1f2937" >compresses the urethra</text>
<text x="690" y="150" font-size="9.8" font-weight="700" text-anchor="middle" fill="#1e3a8a" >→ urinary difficulty</text>
<rect x="560" y="185" width="260" height="120" rx="8" fill="#fce7f3" stroke="#a21caf" stroke-width="1.5"/>
<text x="690" y="207" font-size="11.3" font-weight="700" text-anchor="middle" fill="#701a75" >Prostate cancer — peripheral zone</text>
<text x="690" y="229" font-size="9.8" font-weight="400" text-anchor="middle" fill="#1f2937" >a completely separate pathway from BPH</text>
<text x="690" y="249" font-size="9.5" font-weight="400" text-anchor="middle" fill="#1f2937" >detected on rectal exam (DRE) —</text>
<text x="690" y="267" font-size="9.5" font-weight="400" text-anchor="middle" fill="#1f2937" >close to the posterior rectal wall</text>
<text x="690" y="288" font-size="9.8" font-weight="700" text-anchor="middle" fill="#701a75" >→ neither raises the other's risk</text>
<rect x="20" y="350" width="820" height="34" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
<text x="430.0" y="372" font-size="10.4" font-weight="700" text-anchor="middle" fill="#92400e" >What's "located where": the anatomic location within the prostate determines a completely different mechanism and clinical picture</text>
</svg>