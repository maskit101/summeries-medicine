<svg class="diagram" viewBox="0 0 860 260" xmlns="http://www.w3.org/2000/svg">
<title>Three peroxisomal diseases — each hits a different function</title>
<text x="430" y="24" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937">Three peroxisomal diseases — a different function fails in each</text>
<rect x="20" y="45" width="270" height="195" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="155" y="70" font-size="12.5" font-weight="700" text-anchor="middle" fill="#7f1d1d">Zellweger syndrome</text>
<text x="155" y="90" font-size="10.3" text-anchor="middle" fill="#1f2937">AR — PEX genes</text>
<text x="155" y="106" font-size="10.3" font-weight="700" text-anchor="middle" fill="#7f1d1d">Peroxisome biogenesis itself</text>
<text x="155" y="126" font-size="10" text-anchor="middle" fill="#1f2937">↑VLCFA + pipecolic acid</text>
<text x="155" y="150" font-size="10" text-anchor="middle" fill="#1f2937">Hypotonia, seizures</text>
<text x="155" y="168" font-size="10" text-anchor="middle" fill="#1f2937">Dysmorphia, hepatomegaly</text>
<text x="155" y="186" font-size="10" text-anchor="middle" fill="#1f2937">Early death</text>
<rect x="300" y="45" width="270" height="195" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="435" y="70" font-size="12.5" font-weight="700" text-anchor="middle" fill="#92400e">Refsum disease</text>
<text x="435" y="90" font-size="10.3" text-anchor="middle" fill="#1f2937">AR</text>
<text x="435" y="106" font-size="10.3" font-weight="700" text-anchor="middle" fill="#92400e">Defective α-oxidation</text>
<text x="435" y="126" font-size="10" text-anchor="middle" fill="#1f2937">↑phytanic acid (from diet)</text>
<text x="435" y="150" font-size="10" text-anchor="middle" fill="#1f2937">Retinitis pigmentosa, anosmia</text>
<text x="435" y="168" font-size="10" text-anchor="middle" fill="#1f2937">Ataxia, neuropathy</text>
<text x="435" y="186" font-size="10" text-anchor="middle" fill="#1f2937">Treatment: diet, plasmapheresis</text>
<rect x="580" y="45" width="260" height="195" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="710" y="70" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1e3a8a">Adrenoleukodystrophy</text>
<text x="710" y="90" font-size="10.3" text-anchor="middle" fill="#1f2937">X-linked recessive — ABCD1</text>
<text x="710" y="106" font-size="10.3" font-weight="700" text-anchor="middle" fill="#1e3a8a">Defective β-oxidation</text>
<text x="710" y="126" font-size="10" text-anchor="middle" fill="#1f2937">↑VLCFA</text>
<text x="710" y="150" font-size="10" text-anchor="middle" fill="#1f2937">Adrenal gland + white matter</text>
<text x="710" y="168" font-size="10" text-anchor="middle" fill="#1f2937">+ testes</text>
<text x="710" y="186" font-size="10" text-anchor="middle" fill="#1f2937">Progressive neurologic loss</text>
</svg>
