<svg class="diagram" viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" direction="ltr">
<title>השערת שני הפגיעות של קנודסון (Knudson two-hit hypothesis) לגנים מדכאי גידול</title>
<text x="450" y="26" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2937">השערת "שני הפגיעות" של קנודסון — גנים מדכאי גידול דורשים אובדן שני האללים</text>

<!-- Panel 1: normal cell -->
<g>
<rect x="20" y="55" width="860" height="125" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
<text x="40" y="76" font-size="12.5" font-weight="700" fill="#065f46">1. תא תקין</text>
<rect x="330" y="90" width="140" height="55" rx="6" fill="#a7f3d0" stroke="#047857" stroke-width="1.5"/>
<text x="400" y="113" font-size="10.5" font-weight="700" text-anchor="middle" fill="#065f46">אלל 1</text>
<text x="400" y="130" font-size="9.5" text-anchor="middle" fill="#065f46">תקין ✓</text>
<rect x="490" y="90" width="140" height="55" rx="6" fill="#a7f3d0" stroke="#047857" stroke-width="1.5"/>
<text x="560" y="113" font-size="10.5" font-weight="700" text-anchor="middle" fill="#065f46">אלל 2</text>
<text x="560" y="130" font-size="9.5" text-anchor="middle" fill="#065f46">תקין ✓</text>
<text x="450" y="167" font-size="10" text-anchor="middle" fill="#065f46">שני אללי הגן המדכא-גידול תקינים → תפקוד מלא, בקרה תקינה על מחזור התא</text>
</g>

<!-- Arrow 1 -->
<line x1="450" y1="180" x2="450" y2="200" stroke="#b45309" stroke-width="3"/>
<polygon points="450,200 444,188 456,188" fill="#b45309"/>
<text x="600" y="194" font-size="10.5" font-weight="700" fill="#92400e">פגיעה ראשונה (Hit 1)</text>

<!-- Panel 2: one hit, heterozygous, no disease -->
<g>
<rect x="20" y="200" width="860" height="125" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="40" y="221" font-size="12.5" font-weight="700" fill="#92400e">2. פגיעה באלל אחד בלבד (Hit 1) — טרם מחלה</text>
<rect x="330" y="235" width="140" height="55" rx="6" fill="#fecaca" stroke="#b91c1c" stroke-width="1.5"/>
<text x="400" y="258" font-size="10.5" font-weight="700" text-anchor="middle" fill="#7f1d1d">אלל 1</text>
<text x="400" y="275" font-size="9.5" text-anchor="middle" fill="#7f1d1d">פגוע ✗</text>
<rect x="490" y="235" width="140" height="55" rx="6" fill="#a7f3d0" stroke="#047857" stroke-width="1.5"/>
<text x="560" y="258" font-size="10.5" font-weight="700" text-anchor="middle" fill="#065f46">אלל 2</text>
<text x="560" y="275" font-size="9.5" text-anchor="middle" fill="#065f46">תקין ✓</text>
<text x="450" y="312" font-size="10" font-weight="700" text-anchor="middle" fill="#92400e">האלל התקין הנותר עדיין מספק תפקוד תקין → אין מחלה עדיין</text>
</g>

<!-- Arrow 2 -->
<line x1="450" y1="325" x2="450" y2="345" stroke="#b91c1c" stroke-width="3"/>
<polygon points="450,345 444,333 456,333" fill="#b91c1c"/>
<text x="600" y="339" font-size="10.5" font-weight="700" fill="#7f1d1d">פגיעה שנייה (Hit 2)</text>

<!-- Panel 3: both hits, cancer -->
<g>
<rect x="20" y="345" width="860" height="125" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="40" y="366" font-size="12.5" font-weight="700" fill="#7f1d1d">3. שני האללים אבדו (Hit 2) — התאמת סרטן</text>
<rect x="330" y="380" width="140" height="55" rx="6" fill="#fecaca" stroke="#b91c1c" stroke-width="1.5"/>
<text x="400" y="403" font-size="10.5" font-weight="700" text-anchor="middle" fill="#7f1d1d">אלל 1</text>
<text x="400" y="420" font-size="9.5" text-anchor="middle" fill="#7f1d1d">פגוע ✗</text>
<rect x="490" y="380" width="140" height="55" rx="6" fill="#fecaca" stroke="#b91c1c" stroke-width="1.5"/>
<text x="560" y="403" font-size="10.5" font-weight="700" text-anchor="middle" fill="#7f1d1d">אלל 2</text>
<text x="560" y="420" font-size="9.5" text-anchor="middle" fill="#7f1d1d">פגוע ✗</text>
<text x="450" y="457" font-size="10" font-weight="700" text-anchor="middle" fill="#7f1d1d">אובדן מוחלט של תפקוד הגן המדכא-גידול → אובדן בקרה על מחזור התא → סרטן</text>
</g>

<!-- Bottom note -->
<rect x="20" y="480" width="860" height="65" rx="8" fill="#f8fafc" stroke="#9ca3af" stroke-width="1"/>
<text x="450" y="502" font-size="10" text-anchor="middle" fill="#1f2937">בתסמונות משפחתיות (למשל רטינובלסטומה תורשתית): Hit 1 מולד (בתאי נבט) — נדרש Hit 2 סומטי בלבד → הופעה מוקדמת, לעיתים דו-צדדית</text>
<text x="450" y="522" font-size="10" text-anchor="middle" fill="#1f2937">במקרים ספורדיים: שתי הפגיעות סומטיות ומקריות → הופעה מאוחרת יותר, לרוב חד-צדדית ונדירה יותר</text>
</svg>
