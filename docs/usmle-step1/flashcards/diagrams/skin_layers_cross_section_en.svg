<svg class="diagram" viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" direction="ltr">
<title>Skin layers — epidermis, dermis, subcutis</title>
<text x="500" y="26" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2937">Skin Layers — Epidermis (5 sublayers), Dermis, Subcutaneous Fat</text>
<text x="500" y="45" font-size="10.5" text-anchor="middle" fill="#4b5563">Mnemonic (superficial→deep): "Come, Let's Get Sun Burned"</text>

<rect x="60" y="65" width="430" height="330" rx="8" fill="#fff7ed" stroke="#9a3412" stroke-width="1.5"/>
<text x="275" y="88" font-size="12.5" font-weight="700" text-anchor="middle" fill="#7c2d12">Epidermis</text>

<rect x="80" y="100" width="390" height="48" rx="6" fill="#fde68a" stroke="#92400e" stroke-width="1.5"/>
<text x="275" y="120" font-size="11.5" font-weight="700" text-anchor="middle" fill="#78350f">Stratum Corneum</text>
<text x="275" y="136" font-size="9" text-anchor="middle" fill="#78350f">Dead, keratinized cells — water/microbe barrier ("Come")</text>

<rect x="80" y="152" width="390" height="40" rx="6" fill="#fcd34d" stroke="#92400e" stroke-width="1.5"/>
<text x="275" y="170" font-size="11" font-weight="700" text-anchor="middle" fill="#78350f">Stratum Lucidum</text>
<text x="275" y="184" font-size="8.5" text-anchor="middle" fill="#78350f">Thick skin only (palms/soles) ("Let's")</text>

<rect x="80" y="196" width="390" height="44" rx="6" fill="#fbbf24" stroke="#92400e" stroke-width="1.5"/>
<text x="275" y="216" font-size="11" font-weight="700" text-anchor="middle" fill="#78350f">Stratum Granulosum</text>
<text x="275" y="231" font-size="8.5" text-anchor="middle" fill="#78350f">Keratohyalin granules — keratinization begins ("Get")</text>

<rect x="80" y="244" width="390" height="48" rx="6" fill="#f59e0b" stroke="#92400e" stroke-width="1.5"/>
<text x="275" y="264" font-size="11" font-weight="700" text-anchor="middle" fill="#78350f">Stratum Spinosum</text>
<text x="275" y="280" font-size="8.5" text-anchor="middle" fill="#78350f">Desmosomes ("spines") connect keratinocytes ("Sun")</text>

<rect x="80" y="296" width="390" height="60" rx="6" fill="#d97706" stroke="#78350f" stroke-width="1.5"/>
<text x="275" y="318" font-size="11.5" font-weight="700" text-anchor="middle" fill="#fff7ed">Stratum Basale</text>
<text x="275" y="335" font-size="8.5" text-anchor="middle" fill="#fff7ed">Germinative layer — dividing stem cells;</text>
<text x="275" y="348" font-size="8.5" text-anchor="middle" fill="#fff7ed">source for split-thickness graft re-epithelialization</text>

<rect x="80" y="362" width="390" height="26" rx="4" fill="#fed7aa" stroke="#9a3412" stroke-width="1"/>
<text x="275" y="379" font-size="9" font-weight="700" text-anchor="middle" fill="#7c2d12">Basement Membrane ↓ hemidesmosome attachment</text>

<rect x="520" y="65" width="420" height="170" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="730" y="90" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1e3a8a">Dermis</text>
<text x="730" y="112" font-size="9.5" text-anchor="middle" fill="#1e3a8a">Collagen (I&gt;III) + elastin + vessels/nerves</text>
<text x="730" y="130" font-size="9.5" text-anchor="middle" fill="#1e3a8a">Hair follicles, sweat/sebaceous glands</text>
<text x="730" y="152" font-size="9.5" font-weight="700" text-anchor="middle" fill="#1e3a8a">Full-thickness graft takes the</text>
<text x="730" y="168" font-size="9.5" font-weight="700" text-anchor="middle" fill="#1e3a8a">epidermis + the entire dermis</text>
<text x="730" y="190" font-size="9" text-anchor="middle" fill="#1e3a8a">Scleroderma: dermal fibrosis/thickening</text>
<text x="730" y="208" font-size="9" text-anchor="middle" fill="#1e3a8a">→ taut, puffy skin without wrinkles</text>

<rect x="520" y="245" width="420" height="150" rx="8" fill="#fef9c3" stroke="#a16207" stroke-width="1.5"/>
<text x="730" y="270" font-size="12.5" font-weight="700" text-anchor="middle" fill="#713f12">Subcutaneous Fat (Hypodermis, Subcutis)</text>
<text x="730" y="292" font-size="9.5" text-anchor="middle" fill="#713f12">Adipose tissue — thermal insulation,</text>
<text x="730" y="308" font-size="9.5" text-anchor="middle" fill="#713f12">energy storage, mechanical padding</text>
<text x="730" y="330" font-size="9.5" font-weight="700" text-anchor="middle" fill="#713f12">Relevant to flap design (fasciocutaneous/</text>
<text x="730" y="346" font-size="9.5" font-weight="700" text-anchor="middle" fill="#713f12">adipofascial) and tissue thickness in closure</text>

<rect x="520" y="410" width="420" height="90" rx="8" fill="#f8fafc" stroke="#9ca3af" stroke-width="1"/>
<text x="730" y="432" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1f2937">Graft depth — the anatomic basis of plastic surgery</text>
<text x="730" y="452" font-size="9" text-anchor="middle" fill="#1f2937">Split-thickness graft: epidermis + part of dermis</text>
<text x="730" y="468" font-size="9" text-anchor="middle" fill="#1f2937">(leaves stratum basale at donor site to re-epithelialize)</text>
<text x="730" y="486" font-size="9" text-anchor="middle" fill="#1f2937">Full-thickness graft: epidermis + entire dermis (no donor re-epithelialization)</text>

<rect x="60" y="410" width="430" height="90" rx="8" fill="#f8fafc" stroke="#9ca3af" stroke-width="1"/>
<text x="275" y="432" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1f2937">3 skin layers overall</text>
<text x="275" y="452" font-size="9" text-anchor="middle" fill="#1f2937">1. Epidermis (5 sublayers) → 2. Dermis →</text>
<text x="275" y="468" font-size="9" text-anchor="middle" fill="#1f2937">3. Subcutaneous fat (hypodermis/subcutis)</text>
<text x="275" y="486" font-size="9" text-anchor="middle" fill="#1f2937">Stratum basale = stem cell source, determines "graft take"</text>

<rect x="60" y="515" width="880" height="35" rx="8" fill="#111827"/>
<text x="500" y="538" font-size="10.5" font-weight="700" text-anchor="middle" fill="#f9fafb">Plastic surgery key point: the epidermis-dermis junction is exactly the cut line that defines every skin graft's depth</text>
</svg>
