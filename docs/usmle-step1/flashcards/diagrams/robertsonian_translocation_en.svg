<svg class="diagram" viewBox="0 0 860 330" xmlns="http://www.w3.org/2000/svg" direction="ltr">
<title>Robertsonian translocation mechanism</title>
<text x="430" y="24" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1f2937">Robertsonian translocation: two acrocentric chromosomes fuse at the centromere</text>

<rect x="30" y="50" width="230" height="150" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
<text x="145" y="72" font-size="12" font-weight="700" text-anchor="middle" fill="#1f2937">Two normal acrocentric</text>
<text x="145" y="88" font-size="12" font-weight="700" text-anchor="middle" fill="#1f2937">chromosomes (eg, 14 &amp; 21)</text>
<rect x="70" y="100" width="16" height="60" rx="6" fill="#2563eb"/>
<circle cx="78" cy="112" r="4" fill="#1e3a8a"/>
<text x="78" y="175" font-size="9" text-anchor="middle" fill="#1e3a8a">chr 14</text>
<rect x="160" y="100" width="16" height="60" rx="6" fill="#b45309"/>
<circle cx="168" cy="112" r="4" fill="#78350f"/>
<text x="168" y="175" font-size="9" text-anchor="middle" fill="#92400e">chr 21</text>
<text x="145" y="190" font-size="9" text-anchor="middle" fill="#4b5563">centromere near the end; tiny short arms</text>

<polygon points="270,120 300,113 300,127" fill="#4b5563"/>
<text x="285" y="105" font-size="9.5" text-anchor="middle" fill="#4b5563">fusion at</text>
<text x="285" y="145" font-size="9.5" text-anchor="middle" fill="#4b5563">centromere</text>

<rect x="310" y="50" width="230" height="150" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
<text x="425" y="72" font-size="12" font-weight="700" text-anchor="middle" fill="#065f46">Robertsonian fusion product</text>
<text x="425" y="88" font-size="10" text-anchor="middle" fill="#065f46">long arms fused; both short arms lost</text>
<rect x="395" y="105" width="20" height="70" rx="8" fill="#6d28d9"/>
<circle cx="405" cy="140" r="5" fill="#4c1d95"/>
<text x="405" y="192" font-size="9" text-anchor="middle" fill="#4c1d95">der(14;21)</text>
<text x="425" y="190" font-size="0" > </text>

<polygon points="550,120 580,113 580,127" fill="#4b5563"/>

<rect x="590" y="50" width="240" height="150" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="710" y="72" font-size="12" font-weight="700" text-anchor="middle" fill="#92400e">Carrier: 45 chromosomes total</text>
<text x="710" y="90" font-size="10" text-anchor="middle" fill="#92400e">balanced &#8212; no significant genetic</text>
<text x="710" y="105" font-size="10" text-anchor="middle" fill="#92400e">material gained/lost</text>
<text x="710" y="125" font-size="10.5" font-weight="700" text-anchor="middle" fill="#92400e">Phenotypically normal carrier</text>
<text x="710" y="145" font-size="10" text-anchor="middle" fill="#92400e">but at meiosis can segregate into</text>
<text x="710" y="163" font-size="10" font-weight="700" text-anchor="middle" fill="#7f1d1d">unbalanced gametes</text>
<text x="710" y="181" font-size="9.5" text-anchor="middle" fill="#7f1d1d">&#8594; miscarriage, or Down/Patau syndrome</text>

<rect x="30" y="220" width="800" height="90" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="430" y="243" font-size="11.5" font-weight="700" text-anchor="middle" fill="#7f1d1d">Most common translocation type &#8212; typically involves chromosomes 13, 14, 15, 21, 22</text>
<text x="430" y="263" font-size="10.5" text-anchor="middle" fill="#7f1d1d">Balanced translocation carrier &#8594; normal phenotype, but &#8593; risk of unbalanced gametes in offspring</text>
<text x="430" y="283" font-size="10.5" text-anchor="middle" fill="#7f1d1d">Unbalanced translocation (extra/missing genetic material) &#8594; miscarriage, stillbirth, or trisomy (eg, ~4% of Down syndrome via der(14;21))</text>
<text x="430" y="300" font-size="9.5" text-anchor="middle" fill="#7f1d1d">Not detected by nondisjunction-associated maternal-age risk &#8212; can recur regardless of maternal age</text>
</svg>
