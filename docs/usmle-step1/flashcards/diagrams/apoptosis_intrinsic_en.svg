<svg class="diagram" viewBox="0 0 860 240" xmlns="http://www.w3.org/2000/svg">
<title>The intrinsic (mitochondrial) apoptosis pathway</title>
<text x="430" y="24" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937">BCL-2/BAX balance on the mitochondrial membrane</text>
<rect x="20" y="50" width="240" height="70" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
<text x="140" y="76" font-size="12" font-weight="700" text-anchor="middle" fill="#065f46">BCL-2 / BCL-XL</text>
<text x="140" y="94" font-size="10.5" text-anchor="middle" fill="#065f46">"Guards" — inhibit BAX/BAK</text>
<text x="140" y="110" font-size="10.5" text-anchor="middle" fill="#065f46">Normal state: cell survives</text>
<polygon points="270,85 300,78 300,92" fill="#4b5563"/>
<text x="285" y="70" font-size="10" text-anchor="middle" fill="#4b5563">p53 / stress</text>
<rect x="305" y="50" width="235" height="70" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="422" y="76" font-size="12" font-weight="700" text-anchor="middle" fill="#7f1d1d">BAX / BAK released</text>
<text x="422" y="94" font-size="10.5" text-anchor="middle" fill="#7f1d1d">Form pores in the</text>
<text x="422" y="110" font-size="10.5" text-anchor="middle" fill="#7f1d1d">mitochondrial membrane</text>
<polygon points="550,85 580,78 580,92" fill="#4b5563"/>
<rect x="585" y="50" width="240" height="70" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="705" y="76" font-size="12" font-weight="700" text-anchor="middle" fill="#92400e">Cytochrome c release</text>
<text x="705" y="94" font-size="10.5" text-anchor="middle" fill="#92400e">→ caspase activation</text>
<text x="705" y="110" font-size="10.5" text-anchor="middle" fill="#92400e">→ controlled cell dismantling</text>
<rect x="30" y="150" width="380" height="65" rx="8" fill="#fce7f3" stroke="#a21caf" stroke-width="1.3"/>
<text x="220" y="173" font-size="12" font-weight="700" text-anchor="middle" fill="#701a75">Li-Fraumeni (nonfunctional p53)</text>
<text x="220" y="191" font-size="10.5" text-anchor="middle" fill="#701a75">Nobody triggers BAX/BAK when needed</text>
<text x="220" y="207" font-size="10.5" text-anchor="middle" fill="#701a75">→ damaged cells keep surviving</text>
<rect x="450" y="150" width="380" height="65" rx="8" fill="#fce7f3" stroke="#a21caf" stroke-width="1.3"/>
<text x="640" y="173" font-size="12" font-weight="700" text-anchor="middle" fill="#701a75">HPV — protein E6</text>
<text x="640" y="191" font-size="10.5" text-anchor="middle" fill="#701a75">Promotes p53 degradation (different mechanism)</text>
<text x="640" y="207" font-size="10.5" text-anchor="middle" fill="#701a75">→ same end result</text>
</svg>
