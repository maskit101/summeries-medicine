<svg class="diagram" viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" direction="ltr">
<title>Wrist cross-section — carpal tunnel vs Guyon canal</title>
<text x="500" y="26" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2937">Wrist cross-section (palmar surface) — carpal tunnel vs Guyon canal</text>

<g>
<rect x="20" y="60" width="470" height="340" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="255" y="85" font-size="13" font-weight="700" text-anchor="middle" fill="#1e3a8a">Carpal Tunnel</text>
<text x="255" y="102" font-size="10" text-anchor="middle" fill="#1e3a8a">Deep to Flexor Retinaculum</text>

<rect x="60" y="120" width="390" height="24" rx="4" fill="#93c5fd" stroke="#1e3a8a" stroke-width="1.5"/>
<text x="255" y="137" font-size="10" font-weight="700" text-anchor="middle" fill="#1e3a8a">Flexor Retinaculum (Transverse Carpal Ligament)</text>

<circle cx="130" cy="220" r="26" fill="#fde68a" stroke="#92400e" stroke-width="2"/>
<text x="130" y="216" font-size="9.5" font-weight="700" text-anchor="middle" fill="#92400e">Median</text>
<text x="130" y="229" font-size="9.5" font-weight="700" text-anchor="middle" fill="#92400e">nerve</text>

<rect x="185" y="195" width="55" height="50" rx="8" fill="#bfdbfe" stroke="#1e3a8a" stroke-width="1.5"/>
<text x="212" y="215" font-size="8" text-anchor="middle" fill="#1e3a8a">FDS</text>
<text x="212" y="227" font-size="8" text-anchor="middle" fill="#1e3a8a">tendons</text>

<rect x="255" y="195" width="55" height="50" rx="8" fill="#bfdbfe" stroke="#1e3a8a" stroke-width="1.5"/>
<text x="282" y="215" font-size="8" text-anchor="middle" fill="#1e3a8a">FDP</text>
<text x="282" y="227" font-size="8" text-anchor="middle" fill="#1e3a8a">tendons</text>

<rect x="325" y="200" width="45" height="42" rx="8" fill="#bfdbfe" stroke="#1e3a8a" stroke-width="1.5"/>
<text x="347" y="216" font-size="7.5" text-anchor="middle" fill="#1e3a8a">FPL</text>
<text x="347" y="227" font-size="7.5" text-anchor="middle" fill="#1e3a8a">tendon</text>

<rect x="385" y="195" width="55" height="50" rx="8" fill="#dbeafe" stroke="#1e3a8a" stroke-width="1.5" stroke-dasharray="3,3"/>
<text x="412" y="212" font-size="7.5" text-anchor="middle" fill="#1e3a8a">FCR</text>
<text x="412" y="223" font-size="7.5" text-anchor="middle" fill="#1e3a8a">(own</text>
<text x="412" y="234" font-size="7.5" text-anchor="middle" fill="#1e3a8a">compt.)</text>

<text x="255" y="280" font-size="9.5" font-weight="700" text-anchor="middle" fill="#1e3a8a">Contents: median nerve + FDS/FDP tendons + FPL</text>
<text x="255" y="296" font-size="9" text-anchor="middle" fill="#1e3a8a">Lunate dislocation → median nerve compression → carpal tunnel syndrome</text>

<rect x="60" y="320" width="180" height="60" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="150" y="340" font-size="9" font-weight="700" text-anchor="middle" fill="#7f1d1d">Thenar</text>
<text x="150" y="356" font-size="8" text-anchor="middle" fill="#7f1d1d">radial/lateral side</text>
<text x="150" y="370" font-size="8" text-anchor="middle" fill="#7f1d1d">(thumb)</text>

<rect x="270" y="320" width="180" height="60" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
<text x="360" y="340" font-size="9" font-weight="700" text-anchor="middle" fill="#065f46">Hypothenar</text>
<text x="360" y="356" font-size="8" text-anchor="middle" fill="#065f46">ulnar/medial side</text>
<text x="360" y="370" font-size="8" text-anchor="middle" fill="#065f46">(pinky)</text>
</g>

<g>
<rect x="510" y="60" width="470" height="340" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="745" y="85" font-size="13" font-weight="700" text-anchor="middle" fill="#7f1d1d">Guyon Canal</text>
<text x="745" y="102" font-size="10" text-anchor="middle" fill="#7f1d1d">Superficial to Flexor Retinaculum</text>

<circle cx="670" cy="150" r="24" fill="#fca5a5" stroke="#7f1d1d" stroke-width="2"/>
<text x="670" y="147" font-size="9" font-weight="700" text-anchor="middle" fill="#7f1d1d">Ulnar</text>
<text x="670" y="159" font-size="9" font-weight="700" text-anchor="middle" fill="#7f1d1d">nerve</text>

<circle cx="740" cy="150" r="18" fill="#fecaca" stroke="#7f1d1d" stroke-width="2"/>
<text x="740" y="147" font-size="7.5" font-weight="700" text-anchor="middle" fill="#7f1d1d">Ulnar</text>
<text x="740" y="157" font-size="7.5" font-weight="700" text-anchor="middle" fill="#7f1d1d">artery</text>

<rect x="600" y="185" width="290" height="22" rx="4" fill="#fca5a5" stroke="#7f1d1d" stroke-width="1.5"/>
<text x="745" y="200" font-size="9" font-weight="700" text-anchor="middle" fill="#7f1d1d">Pass superficial to the ligament — not within the carpal tunnel</text>

<rect x="560" y="225" width="370" height="24" rx="4" fill="#93c5fd" stroke="#1e3a8a" stroke-width="1.5"/>
<text x="745" y="242" font-size="9.5" font-weight="700" text-anchor="middle" fill="#1e3a8a">Flexor Retinaculum (deep to Guyon canal)</text>

<text x="745" y="280" font-size="9.5" font-weight="700" text-anchor="middle" fill="#7f1d1d">Contents: ulnar nerve + ulnar artery only</text>
<text x="745" y="296" font-size="9" text-anchor="middle" fill="#7f1d1d">Hook of hamate fracture → ulnar nerve compression → Guyon canal syndrome</text>

<rect x="550" y="320" width="180" height="60" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="640" y="340" font-size="9" font-weight="700" text-anchor="middle" fill="#7f1d1d">Thenar</text>
<text x="640" y="356" font-size="8" text-anchor="middle" fill="#7f1d1d">radial/lateral side</text>
<text x="640" y="370" font-size="8" text-anchor="middle" fill="#7f1d1d">(thumb)</text>

<rect x="760" y="320" width="180" height="60" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
<text x="850" y="340" font-size="9" font-weight="700" text-anchor="middle" fill="#065f46">Hypothenar</text>
<text x="850" y="356" font-size="8" text-anchor="middle" fill="#065f46">ulnar/medial side</text>
<text x="850" y="370" font-size="8" text-anchor="middle" fill="#065f46">(pinky)</text>
</g>

<rect x="20" y="415" width="960" height="70" rx="8" fill="#f8fafc" stroke="#9ca3af" stroke-width="1"/>
<text x="500" y="437" font-size="10" font-weight="700" text-anchor="middle" fill="#1f2937">Carpal tunnel = deep to ligament, contains median nerve + flexor tendons (FDS/FDP/FPL). Guyon canal = superficial to ligament, contains ulnar nerve + ulnar artery only</text>
<text x="500" y="457" font-size="9.5" text-anchor="middle" fill="#1f2937">Critical anatomic distinction: carpal tunnel (median) injury is never the same in content as Guyon canal (ulnar) injury — two entirely different compression syndromes</text>
</svg>
