<svg class="diagram" viewBox="0 0 860 454" xmlns="http://www.w3.org/2000/svg">
<title>Nucleosome structure and heterochromatin vs euchromatin</title>
<text x="430.0" y="20" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1f2937" >A single nucleosome</text>
<circle cx="150" cy="100" r="46" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
<text x="150" y="96" font-size="9.6" font-weight="700" text-anchor="middle" fill="#92400e" >histone octamer</text>
<text x="150" y="110" font-size="8.6" font-weight="400" text-anchor="middle" fill="#92400e" >(H2A,H2B,H3,H4)×2</text>
<ellipse cx="150" cy="100" rx="64" ry="56" fill="none" stroke="#2563eb" stroke-width="4" stroke-dasharray="14,6"/>
<text x="150" y="30" font-size="10" font-weight="700" text-anchor="middle" fill="#1e3a8a" >DNA (~147bp) wrapped around the core</text>
<circle cx="206" cy="148" r="12" fill="#fecaca" stroke="#b91c1c" stroke-width="2"/>
<text x="206" y="152" font-size="10" font-weight="700" text-anchor="middle" fill="#7f1d1d" >H1</text>
<text x="261" y="142" font-size="9.6" font-weight="700" text-anchor="start" fill="#7f1d1d" >Histone H1: "locks"</text>
<text x="261" y="156" font-size="9.6" font-weight="400" text-anchor="start" fill="#7f1d1d" >DNA at its entry/exit point</text>
<text x="430.0" y="196" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1f2937" >"beads on a string" — chain of nucleosomes</text>
<circle cx="60" cy="236" r="16" fill="#fde68a" stroke="#b45309" stroke-width="1.6"/>
<line x1="76" y1="236" x2="114" y2="236" stroke="#2563eb" stroke-width="2.5"/>
<circle cx="130" cy="236" r="16" fill="#fde68a" stroke="#b45309" stroke-width="1.6"/>
<line x1="146" y1="236" x2="184" y2="236" stroke="#2563eb" stroke-width="2.5"/>
<circle cx="200" cy="236" r="16" fill="#fde68a" stroke="#b45309" stroke-width="1.6"/>
<line x1="216" y1="236" x2="254" y2="236" stroke="#2563eb" stroke-width="2.5"/>
<circle cx="270" cy="236" r="16" fill="#fde68a" stroke="#b45309" stroke-width="1.6"/>
<line x1="286" y1="236" x2="324" y2="236" stroke="#2563eb" stroke-width="2.5"/>
<circle cx="340" cy="236" r="16" fill="#fde68a" stroke="#b45309" stroke-width="1.6"/>
<line x1="430" y1="268" x2="430" y2="280" stroke="#4b5563" stroke-width="2.5"/><polygon points="423,278 437,278 430,290" fill="#4b5563"/>
<rect x="60" y="300" width="370" height="90" rx="8" fill="#374151" stroke="#111827" stroke-width="1.5"/>
<text x="245.0" y="322" font-size="12.5" font-weight="700" text-anchor="middle" fill="#fff" >Heterochromatin</text>
<text x="245.0" y="342" font-size="10" font-weight="400" text-anchor="middle" fill="#e5e7eb" >condensed • dark on EM</text>
<text x="245.0" y="360" font-size="10" font-weight="400" text-anchor="middle" fill="#e5e7eb" >less accessible to RNA polymerase</text>
<text x="245.0" y="378" font-size="10.5" font-weight="700" text-anchor="middle" fill="#fca5a5" >→ transcriptionally silent</text>
<rect x="430" y="300" width="370" height="90" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="615.0" y="322" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1e3a8a" >Euchromatin</text>
<text x="615.0" y="342" font-size="10" font-weight="400" text-anchor="middle" fill="#1f2937" >open • light on EM</text>
<text x="615.0" y="360" font-size="10" font-weight="400" text-anchor="middle" fill="#1f2937" >accessible to RNA polymerase and transcription factors</text>
<text x="615.0" y="378" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1d4ed8" >→ transcriptionally active</text>
<rect x="20" y="410" width="820" height="34" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
<text x="430.0" y="432" font-size="10.6" font-weight="700" text-anchor="middle" fill="#92400e" >What "moves": how tightly DNA is wound/packed around histones determines whether genes in that region are accessible for transcription</text>
</svg>