<svg class="diagram" viewBox="0 0 860 408" xmlns="http://www.w3.org/2000/svg">
<title>Purines vs pyrimidines and deamination reactions</title>
<text x="430.0" y="20" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937" >Structural difference: double ring vs single ring</text>
<rect x="40" y="40" width="380" height="70" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="230" y="62" font-size="12" font-weight="700" text-anchor="middle" fill="#1e3a8a" >Purines (double ring): A, G</text>
<circle cx="150" cy="88" r="14" fill="none" stroke="#1e3a8a" stroke-width="2"/>
<circle cx="172" cy="88" r="10" fill="none" stroke="#1e3a8a" stroke-width="2"/>
<text x="310" y="92" font-size="10" font-weight="400" text-anchor="middle" fill="#1f2937" >two fused rings</text>
<rect x="440" y="40" width="380" height="70" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
<text x="630" y="62" font-size="12" font-weight="700" text-anchor="middle" fill="#065f46" >Pyrimidines (single ring): C, T, U</text>
<circle cx="550" cy="88" r="14" fill="none" stroke="#065f46" stroke-width="2"/>
<text x="710" y="92" font-size="10" font-weight="400" text-anchor="middle" fill="#1f2937" >one ring</text>
<text x="430.0" y="140" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1f2937" >Deamination: loss of an amino (NH2) group from the base</text>
<rect x="40" y="162" width="780" height="56" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/>
<text x="60" y="184" font-size="11.5" font-weight="700" text-anchor="start" fill="#1e3a8a" >Cytosine → Uracil</text>
<text x="60" y="204" font-size="9.8" font-weight="400" text-anchor="start" fill="#1f2937" >Relatively spontaneous • repaired by BER (uracil-DNA glycosylase) — otherwise misread as T ⇒ C→T transition</text>
<rect x="40" y="226" width="780" height="56" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="1.3"/>
<text x="60" y="248" font-size="11.5" font-weight="700" text-anchor="start" fill="#92400e" >Adenine → Hypoxanthine</text>
<text x="60" y="268" font-size="9.8" font-weight="400" text-anchor="start" fill="#1f2937" >hypoxanthine is read by the cellular machinery as G ⇒ mispairing</text>
<rect x="40" y="290" width="780" height="56" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.3"/>
<text x="60" y="312" font-size="11.5" font-weight="700" text-anchor="start" fill="#7f1d1d" >5-methylcytosine → Thymine</text>
<text x="60" y="332" font-size="9.8" font-weight="400" text-anchor="start" fill="#1f2937" >thymine is a "normal" base — harder to flag as wrong ⇒ classic CpG mutation hotspot</text>
<rect x="20" y="364" width="820" height="34" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
<text x="430.0" y="386" font-size="10.4" font-weight="700" text-anchor="middle" fill="#92400e" >What "moves": the amino (NH2) group leaves the base — the base "turns into" a different molecule read differently by replication/repair enzymes</text>
</svg>