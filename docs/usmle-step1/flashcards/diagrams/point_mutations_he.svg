<svg class="diagram" viewBox="0 0 860 260" xmlns="http://www.w3.org/2000/svg">
<title>מוטציות נקודתיות: איזה בסיס משתנה ומה קורה לחלבון</title>
<text x="430" y="22" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2937">בסיס יחיד שמשתנה בקודון — ומה זה עושה לחומצת האמינו</text>

<text x="90" y="55" font-size="12" font-weight="700" text-anchor="middle" fill="#1f2937">קודון מקורי</text>
<rect x="40" y="65" width="100" height="42" rx="6" fill="#f3f4f6" stroke="#9ca3af"/>
<text x="90" y="92" font-size="15" font-weight="700" text-anchor="middle" fill="#1f2937">GAG</text>
<text x="90" y="122" font-size="11" text-anchor="middle" fill="#4b5563">= גלוטמט (Glu)</text>

<polygon points="160,80 190,80 190,70 210,88 190,106 190,96 160,96" fill="#9ca3af"/>

<!-- silent -->
<rect x="230" y="45" width="180" height="90" rx="8" fill="#ecfdf5" stroke="#047857"/>
<text x="320" y="65" font-size="12" font-weight="700" text-anchor="middle" fill="#065f46">אילמת (Silent)</text>
<text x="320" y="86" font-size="14" font-weight="700" text-anchor="middle" fill="#065f46">GA<tspan fill="#b91c1c" text-decoration="underline">A</tspan></text>
<text x="320" y="106" font-size="11" text-anchor="middle" fill="#1f2937">בסיס 3 השתנה (wobble)</text>
<text x="320" y="122" font-size="11" font-weight="700" text-anchor="middle" fill="#065f46">עדיין גלוטמט — אין שינוי בחלבון</text>

<!-- missense -->
<rect x="430" y="45" width="180" height="90" rx="8" fill="#fffbeb" stroke="#b45309"/>
<text x="520" y="65" font-size="12" font-weight="700" text-anchor="middle" fill="#92400e">שינוי-משמעות (Missense)</text>
<text x="520" y="86" font-size="14" font-weight="700" text-anchor="middle" fill="#92400e">G<tspan fill="#b91c1c" text-decoration="underline">T</tspan>G</text>
<text x="520" y="106" font-size="11" text-anchor="middle" fill="#1f2937">בסיס 2 השתנה</text>
<text x="520" y="122" font-size="11" font-weight="700" text-anchor="middle" fill="#92400e">ואלין (Val) במקום גלוטמט</text>

<!-- nonsense -->
<rect x="630" y="45" width="180" height="90" rx="8" fill="#fef2f2" stroke="#b91c1c"/>
<text x="720" y="65" font-size="12" font-weight="700" text-anchor="middle" fill="#7f1d1d">שטות (Nonsense)</text>
<text x="720" y="86" font-size="14" font-weight="700" text-anchor="middle" fill="#7f1d1d"><tspan fill="#b91c1c" text-decoration="underline">TAG</tspan></text>
<text x="720" y="106" font-size="11" text-anchor="middle" fill="#1f2937">בסיס 1+2 השתנו (לדוגמה)</text>
<text x="720" y="122" font-size="11" font-weight="700" text-anchor="middle" fill="#7f1d1d">קודון עצירה — חלבון נקטע</text>

<rect x="30" y="155" width="800" height="75" rx="8" fill="#eff6ff" stroke="#2563eb"/>
<text x="430" y="177" font-size="12" font-weight="700" text-anchor="middle" fill="#1e3a8a">מה בדיוק "זז": תמיד רק בסיס DNA/RNA בודד מוחלף בקודון אחד</text>
<text x="430" y="197" font-size="11.5" text-anchor="middle" fill="#1f2937">בעמדה 3 (wobble) → לרוב אילמת • בעמדה 1-2 עם חומצת אמינו דומה כימית → משמרת (סוג של missense) • בעמדה כלשהי שיוצרת קודון עצירה → שטות</text>
<text x="430" y="215" font-size="11" text-anchor="middle" fill="#4b5563">חומרה עולה: אילמת &lt; שינוי-משמעות &lt; שטות &lt; פריימשיפט (ראו איור נפרד)</text>
</svg>
