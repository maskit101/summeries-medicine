<svg class="diagram" viewBox="0 0 860 300" xmlns="http://www.w3.org/2000/svg">
<title>ציר הבקרה: p53 → p21 → עיכוב CDK → Rb פעיל → עצירת G1-S</title>
<text x="430" y="26" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1f2937">מסלול הבלם של מחזור התא (נזק ל-DNA)</text>
<rect x="30" y="55" width="150" height="60" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="105" y="82" font-size="12" font-weight="700" text-anchor="middle" fill="#7f1d1d">נזק ל-DNA</text>
<text x="105" y="100" font-size="10.5" text-anchor="middle" fill="#7f1d1d">מזוהה ע"י p53</text>
<polygon points="185,85 210,78 210,92" fill="#4b5563"/>
<rect x="215" y="55" width="150" height="60" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="290" y="82" font-size="12" font-weight="700" text-anchor="middle" fill="#7f1d1d">p53 ↑</text>
<text x="290" y="100" font-size="10.5" text-anchor="middle" fill="#7f1d1d">מפעיל תעתוק p21</text>
<polygon points="370,85 395,78 395,92" fill="#4b5563"/>
<rect x="400" y="55" width="150" height="60" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="475" y="82" font-size="12" font-weight="700" text-anchor="middle" fill="#92400e">p21 ↑</text>
<text x="475" y="100" font-size="10.5" text-anchor="middle" fill="#92400e">מעכב קומפלקס Cyclin-CDK</text>
<polygon points="555,85 580,78 580,92" fill="#4b5563"/>
<rect x="585" y="55" width="150" height="60" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="660" y="76" font-size="12" font-weight="700" text-anchor="middle" fill="#1e3a8a">Rb נשאר</text>
<text x="660" y="94" font-size="11" text-anchor="middle" fill="#1e3a8a">לא-מזורחן (פעיל)</text>
<polygon points="740,85 765,78 765,92" fill="#4b5563"/>
<rect x="770" y="55" width="70" height="60" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
<text x="805" y="82" font-size="11" font-weight="700" text-anchor="middle" fill="#065f46">קושר</text>
<text x="805" y="98" font-size="11" font-weight="700" text-anchor="middle" fill="#065f46">E2F</text>
<rect x="30" y="150" width="810" height="50" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
<text x="435" y="180" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1f2937">התוצאה: E2F נשאר חסום → עצירת המעבר G1→S עד שהנזק מתוקן</text>
<rect x="30" y="215" width="380" height="65" rx="8" fill="#fce7f3" stroke="#a21caf" stroke-width="1.3"/>
<text x="220" y="238" font-size="12" font-weight="700" text-anchor="middle" fill="#701a75">לי-פראומני (Li-Fraumeni)</text>
<text x="220" y="256" font-size="10.5" text-anchor="middle" fill="#701a75">מוטציית נבט ב-TP53 (אובדן-תפקוד)</text>
<text x="220" y="272" font-size="10.5" text-anchor="middle" fill="#701a75">→ הבלם כולו לא פועל → ריבוי סרטנים</text>
<rect x="450" y="215" width="380" height="65" rx="8" fill="#fce7f3" stroke="#a21caf" stroke-width="1.3"/>
<text x="640" y="238" font-size="12" font-weight="700" text-anchor="middle" fill="#701a75">HPV — חלבון E6</text>
<text x="640" y="256" font-size="10.5" text-anchor="middle" fill="#701a75">מקדם פירוק p53 (בדרך שונה מ-CDK)</text>
<text x="640" y="272" font-size="10.5" text-anchor="middle" fill="#701a75">→ אותה תוצאה: אובדן הבלם</text>
</svg>
